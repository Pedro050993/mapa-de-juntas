        Relatorios.salvarOverride(r, { desc: r.desc });
        renderPreview();
      }));
    });

    body.appendChild(g);

    var ta = el('textarea', { rows: 2, style: { marginTop: '10px' } });
    ta.value = r.obs || '';
    ta.addEventListener('change', function () { r.obs = ta.value; Relatorios.salvarOverride(r, { obs: ta.value }); renderPreview(); });
    body.appendChild(el('div', { class: 'f', style: { marginTop: '12px' } }, [el('label', { text: 'Observações' }), ta]));

    var tc = el('textarea', { rows: 2 });
    tc.value = r.croqui || '';
    tc.addEventListener('change', function () { r.croqui = tc.value; Relatorios.salvarOverride(r, { croqui: tc.value }); renderPreview(); });
    body.appendChild(el('div', { class: 'f', style: { marginTop: '10px' } }, [
      el('label', { text: 'Croqui (texto / descrição)' }), tc,
      el('div', { class: 'hint', text: 'O quadro do croqui é impresso em branco para desenho à mão quando este campo está vazio.' })
    ]));

    card.appendChild(body);
    return card;
  }

  /* ---------------- ações ---------------- */
  function imprimirUm() {
    if (!rels.length) { UI.toast('Nenhum relatório para imprimir.', 'err'); return; }
    Print.relatorios([rels[sel]]);
  }
  function imprimirTodos() {
    if (!rels.length) { UI.toast('Nenhum relatório para imprimir.', 'err'); return; }
    Print.relatorios(rels);
  }

  async function excelUm() {
    if (!rels.length) { UI.toast('Nenhum relatório para exportar.', 'err'); return; }
    try {
      var r = rels[sel];
      var blob = await Excel.blobRelatorio(r);
      UI.baixar(blob, (tipo === 'EVS' ? 'FOR-266_' : 'FOR-053_') + UI.slug(r.numero) + '.xlsx');
      UI.toast('Relatório exportado sobre o modelo original', 'ok');
    } catch (e) {
      console.error(e);
      UI.toast(e.message, 'err');
    }
  }

  async function excelTodos() {
    if (!rels.length) { UI.toast('Nenhum relatório para exportar.', 'err'); return; }
    try {
      UI.toast('Gerando ' + rels.length + ' arquivos…');
      var blob = await Excel.zipRelatorios(rels);
      UI.baixar(blob, (tipo === 'EVS' ? 'FOR-266' : 'FOR-053') + ' - ' +
        UI.slug(Store.config.projeto.projeto || 'relatorios') + '.zip');
      UI.toast(rels.length + ' relatórios exportados em .zip', 'ok');
    } catch (e) {
      console.error(e);
      UI.toast(e.message, 'err');
    }
  }

  global.RelatoriosUI = { montar: montar, atualizar: atualizar };
})(window);

</script>
<script>
/* ============================================================
   ui-dashboard.js - Painel interativo
   Gráficos em SVG puro, com hover e filtro cruzado por clique.
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el;
  var root, corpo;
  var filtros = {};
  var medida = 'juntas';        // 'juntas' | 'pd' (polegadas diametrais)

  function unidade() { return medida === 'pd' ? 'pol' : 'juntas'; }
  function fmt(v) { return medida === 'pd' ? Store.formatarPD(v) : String(v); }

  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, kids) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined) continue;
      e.setAttribute(k, attrs[k]);
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  /* ---------------- tooltip ---------------- */
  function tip() {
    var t = document.getElementById('viz-tip');
    if (!t) { t = el('div', { id: 'viz-tip' }); document.body.appendChild(t); }
    return t;
  }
  function mostrarTip(ev, titulo, linhas) {
    var t = tip();
    t.innerHTML = '';
    t.appendChild(el('b', { text: titulo }));
    (linhas || []).forEach(function (l) {
      t.appendChild(el('div', { class: 'row' }, [el('span', { text: l[0] }), el('span', { text: l[1] })]));
    });
    t.classList.add('on');
    moverTip(ev);
  }
  function moverTip(ev) {
    var t = tip();
    var x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + t.offsetWidth > window.innerWidth - 8) x = ev.clientX - t.offsetWidth - 12;
    if (y + t.offsetHeight > window.innerHeight - 8) y = ev.clientY - t.offsetHeight - 12;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function esconderTip() { tip().classList.remove('on'); }

  function interativo(node, titulo, linhas, onClick) {
    node.style.cursor = onClick ? 'pointer' : 'default';
    node.addEventListener('mouseenter', function (ev) { mostrarTip(ev, titulo, linhas); });
    node.addEventListener('mousemove', moverTip);
    node.addEventListener('mouseleave', esconderTip);
    if (onClick) node.addEventListener('click', function () { esconderTip(); onClick(); });
    return node;
  }

  /* ---------------- cores por situação ---------------- */
  var CORSIT = {
    concluido: 'var(--good)',
    aguardando: 'var(--warning)',
    reprovado: 'var(--critical)',
    cancelado: 'var(--text-muted)'
  };
  var SERIE_SIT = Store.SITUACOES.map(function (x) {
    return { key: x.k, label: x.icone + ' ' + x.label, cor: CORSIT[x.k] };
  });

  /* ---------------- dados ---------------- */
  function base() { return Store.juntasPreenchidas(); }

  /* ============================================================
     PERÍODO
     Cada junta tem uma data por etapa, então filtrar "agosto" exige
     dizer QUAL data conta. Por padrão vale qualquer data lançada:
     a junta entra no recorte se teve alguma atividade no intervalo.
     ============================================================ */
  var CAMPOS_PERIODO = [
    { k: '', nome: 'Qualquer data lançada' },
    { k: 'dataVA', nome: 'Ajuste de solda (VA)' },
    { k: 'dataVS', nome: 'Visual de solda (VS)' },
    { k: 'dataLPR', nome: 'LP raiz' },
    { k: 'dataLPA', nome: 'LP acabamento' },
    { k: 'dataUS', nome: 'Ultrassom (US)' },
    { k: 'dataDM', nome: 'DM / END pré-fabricação' },
    { k: 'dataJato', nome: 'Jateamento' },
    { k: 'dataFundo', nome: 'Fundo (pintura)' },
    { k: 'dataPMI', nome: 'PMI' },
    { k: 'dataTH', nome: 'Teste hidrostático' },
    { k: 'dataLib', nome: 'Liberação' }
  ];
  var TODAS_DATAS = CAMPOS_PERIODO
    .filter(function (c) { return c.k; })
    .map(function (c) { return c.k; });

  /* Datas ficam em 'aaaa-mm-dd', então a comparação de texto já é cronológica. */
  function noPeriodo(j) {
    if (!filtros.de && !filtros.ate) return true;
    var campos = filtros.campoData ? [filtros.campoData] : TODAS_DATAS;
    for (var i = 0; i < campos.length; i++) {
      var v = j[campos[i]];
      if (!Store.ehData(v)) continue;
      if (filtros.de && v < filtros.de) continue;
      if (filtros.ate && v > filtros.ate) continue;
      return true;
    }
    return false;
  }

  function rotuloPeriodo() {
    var c = CAMPOS_PERIODO.filter(function (x) { return x.k === (filtros.campoData || ''); })[0];
    var nome = c ? c.nome : 'Qualquer data lançada';
    if (filtros.de && filtros.ate) return nome + ': ' + UI.dataBR(filtros.de) + ' a ' + UI.dataBR(filtros.ate);
    if (filtros.de) return nome + ': a partir de ' + UI.dataBR(filtros.de);
    return nome + ': até ' + UI.dataBR(filtros.ate);
  }

  function aplicaFiltros(js) {
    return js.filter(function (j) {
      if (!noPeriodo(j)) return false;
      if (filtros.area && j.area !== filtros.area) return false;
      if (filtros.linha && j.linha !== filtros.linha) return false;
      if (filtros.empresa && j.empresa !== filtros.empresa) return false;
      if (filtros.soldador && j.soldRaiz !== filtros.soldador && j.soldAcab !== filtros.soldador) return false;
      if (filtros.pc && j.pc !== filtros.pc) return false;
      if (filtros.tipo && j.tipo !== filtros.tipo) return false;
      if (filtros.material && j.material !== filtros.material) return false;
      if (filtros.situacao && Store.situacao(j) !== filtros.situacao) return false;
      if (filtros.ensaio) {
        if (!Store.exigeEnsaio(j, filtros.ensaio)) return false;
        if (Store.estadoEnsaio(j, filtros.ensaio) !== 'falta') return false;
      }
      if (filtros.etapa) {
        var pe = String(filtros.etapa).split('|');
        var et = ETAPAMAP[pe[0]];
        if (et) {
          if (pe[1] === 'c' && !et.ids.some(function (id) { return Store.exigeEnsaio(j, id); })) return false;
          if (et.ids.every(function (id) { return Store.executado(j, id); })) return false;
        }
      }
      if (filtros.pendentes && !Store.pendencias(j).length) return false;
      if (filtros.semClasse && Store.ensaiosExigidos(j).length) return false;
      if (filtros.liberadaAberta && (!Store.ehData(j.dataLib) || !Store.pendencias(j).length)) return false;
      if (filtros.classeInsp && j.classeInsp !== filtros.classeInsp) return false;
      if (filtros.spool && j.spool !== filtros.spool) return false;
      if (filtros.diametro && j.diametro !== filtros.diametro) return false;
      return true;
    });
  }

  /** Predicado equivalente aos filtros atuais — usado ao levar o recorte para o mapa. */
  function predicadoAtual() {
    var f = {};
    for (var k in filtros) f[k] = filtros[k];
    return function (j) { return aplicaFiltrosCom(f, j); };
  }
  function aplicaFiltrosCom(f, j) {
    var salvo = filtros;
    filtros = f;
    var ok = aplicaFiltros([j]).length > 0;
    filtros = salvo;
    return ok;
  }

  function agrupar(js, fn) {
    var m = {}, ordem = [];
    js.forEach(function (j) {
      var ks = fn(j);
      (Array.isArray(ks) ? ks : [ks]).forEach(function (k) {
        k = String(k === null || k === undefined ? '' : k).trim();
        if (!k) return;
        if (!m[k]) { m[k] = []; ordem.push(k); }
        m[k].push(j);
      });
    });
    return ordem.map(function (k) { return { chave: k, itens: m[k] }; });
  }

  /** Contagem por situação na unidade corrente (juntas ou polegadas). */
  function contarSit(js, med) {
    med = med || medida;
    var c = { concluido: 0, aguardando: 0, reprovado: 0, cancelado: 0 };
    js.forEach(function (j) {
      c[Store.situacao(j)] += (med === 'pd' ? Store.polegadas(j) : 1);
    });
    if (med === 'pd') for (var k in c) c[k] = Math.round(c[k] * 100) / 100;
    return c;
  }

  function totalMed(js, med) { return Store.medir(js, med || medida); }

  /* ============================================================
     BLOCOS DO PAINEL
     O usuário escolhe o que fica na tela; a lista abaixo define a
     ordem e o que vem ligado por padrão.
     ============================================================ */
  var BLOCOS = [
    { id: 'etapas', nome: 'Avanço por etapa', padrao: true },
    { id: 'avanco', nome: 'Avanço físico — juntas × polegadas', padrao: true },
    { id: 'situacao', nome: 'Situação geral das juntas', padrao: true },
    { id: 'ensaios', nome: 'Avanço dos ensaios exigidos', padrao: true },
    { id: 'topSoldadores', nome: 'Top 10 soldadores', padrao: true },
    { id: 'evolucao', nome: 'Evolução acumulada', padrao: true },
    { id: 'dim.area', nome: 'Área', padrao: true },
    { id: 'dim.pc', nome: 'Pré-fabricação × campo', padrao: true },
    { id: 'dim.material', nome: 'Material', padrao: true },
    { id: 'dim.diametro', nome: 'Diâmetro', padrao: true },
    { id: 'dim.empresa', nome: 'Empresa responsável', padrao: false },
    { id: 'dim.tipo', nome: 'Tipo de junta', padrao: false },
    { id: 'soldadores', nome: 'Desempenho por soldador (barras empilhadas)', padrao: false },
    { id: 'linhas', nome: 'Avanço por linha / isométrico', padrao: false },
    { id: 'pendencias', nome: 'Tabela de pendências de ensaio', padrao: false },
    { id: 'tabSoldadores', nome: 'Tabela de desempenho por soldador', padrao: false }
  ];

  var KEY_BLOCOS = 'mapaJuntas.painelBlocos';
  var blocosOcultos = null;

  function lerBlocos() {
    if (blocosOcultos) return blocosOcultos;
    try { blocosOcultos = JSON.parse(localStorage.getItem(KEY_BLOCOS) || 'null'); } catch (e) { blocosOcultos = null; }
    if (!blocosOcultos) {
      blocosOcultos = {};
      BLOCOS.forEach(function (b) { if (!b.padrao) blocosOcultos[b.id] = true; });
    }
    return blocosOcultos;
  }
  function visivel(id) { return !lerBlocos()[id]; }
  function gravarBlocos() {
    try { localStorage.setItem(KEY_BLOCOS, JSON.stringify(lerBlocos())); } catch (e) { }
  }

  function escolherBlocos() {
    var box = el('div');
    box.appendChild(el('div', {
      class: 'hint', style: { marginBottom: '12px' },
      text: 'Marque o que deve aparecer no painel. A escolha fica gravada neste navegador.'
    }));
    var lista = el('div', { style: { display: 'grid', gap: '4px' } });
    BLOCOS.forEach(function (b) {
      lista.appendChild(el('label', { class: 'chk', style: { padding: '4px 0' } }, [
        el('input', {
          type: 'checkbox', checked: visivel(b.id) ? true : null,
          onchange: function () {
            if (this.checked) delete lerBlocos()[b.id]; else lerBlocos()[b.id] = true;
            gravarBlocos(); render();
          }
        }),
        el('span', { text: b.nome })
      ]));
    });
    box.appendChild(lista);
    UI.modal('Blocos do painel', box, [{ label: 'Fechar', class: 'primary' }]);
  }

  /* ---------------- componentes ---------------- */
  /**
   * kpi(...) — todo indicador é um botão: clicar aplica o filtro
   * correspondente ao painel inteiro, como num dashboard de BI.
   */
  function kpi(label, valor, sub, tom, filtro) {
    var ativo = filtro && filtros[filtro[0]] === filtro[1];
    var k = el(filtro ? 'button' : 'div', {
      class: 'kpi ' + (tom || '') + (filtro ? ' clicavel' : '') + (ativo ? ' ativo' : ''),
      type: filtro ? 'button' : null,
      title: filtro ? (ativo ? 'Clique para remover o filtro' : 'Clique para filtrar o painel por ' + label.toLowerCase()) : null,
      onclick: filtro ? toggle(filtro[0], filtro[1]) : null
    }, [
      el('div', { class: 'k-bar' }),
      el('div', { class: 'k-label', text: label }),
      el('div', { class: 'k-value', text: valor }),
      sub ? el('div', { class: 'k-sub', text: sub }) : null
    ]);
    return k;
  }

  function cardChart(id, titulo, sub, acoes) {
    var corpo = el('div');
    if (sub) corpo.appendChild(el('div', { class: 'sub', text: sub }));

    var botoes = (acoes || []).slice();
    botoes.push(el('button', {
      class: 'icon-btn expandir', title: 'Ampliar este gráfico', text: '⤢',
      onclick: function (ev) { ev.stopPropagation(); ampliar(titulo, corpo); }
    }));

    var c = UI.card('dash.' + id, titulo, null, corpo, { classe: 'chart-card', acoes: botoes });
    c.corpo = corpo;
    c.appendChild = function (n) { corpo.appendChild(n); return n; };
    return c;
  }

  /**
   * Amplia um gráfico numa janela grande. O conteúdo é MOVIDO para lá e
   * devolvido ao fechar, então tooltips e cliques continuam funcionando.
   */
  function ampliar(titulo, corpo) {
    var paiOriginal = corpo.parentNode;
    var irmaoOriginal = corpo.nextSibling;

    var caixa = el('div', { class: 'viz-grande' });
    var dlg = UI.modal(titulo, caixa, [{
      label: 'Fechar', class: 'primary',
      onClick: function () { devolver(); }
    }]);

    var bg = caixa.closest('.modal-bg');
    if (bg) {
      bg.classList.add('modal-largo');
      bg.addEventListener('mousedown', function (ev) { if (ev.target === bg) devolver(); });
    }
    caixa.appendChild(corpo);

    function devolver() {
      if (corpo.parentNode === caixa && paiOriginal) {
        paiOriginal.insertBefore(corpo, irmaoOriginal);
      }
    }
    return dlg;
  }

  /** Legenda clicável: cada item liga/desliga o filtro daquela situação. */
  function legenda(series, campo) {
    var d = el('div', { class: 'legend' });
    series.forEach(function (se) {
      var clicavel = campo && se.key;
      var ativo = clicavel && filtros[campo] === se.key;
      d.appendChild(el(clicavel ? 'button' : 'span', {
        class: 'leg-item' + (clicavel ? ' clicavel' : '') + (ativo ? ' ativo' : ''),
        type: clicavel ? 'button' : null,
        title: clicavel ? 'Filtrar por ' + se.label : null,
        onclick: clicavel ? toggle(campo, se.key) : null
      }, [
        el('i', { style: { background: se.cor } }),
        document.createTextNode(se.label)
      ]));
    });
    return d;
  }

  function cortar(t, n) {
    t = String(t || '');
    return t.length > n ? t.slice(0, n - 1) + '…' : t;
  }

  function barrasEmpilhadas(items, series, opts) {
    opts = opts || {};
    var feitoKey = opts.chaveFeito || 'concluido';
    var W = 720, rotuloW = opts.rotuloW || 160, valorW = opts.valorW || 128;
    var alturaBarra = 20, gap = 11;
    var H = Math.max(1, items.length) * (alturaBarra + gap) + 4;
    var trilha = W - rotuloW - valorW;
    var max = opts.max || Math.max(1, Math.max.apply(null, items.map(function (i) { return i.total; })));

    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });

    items.forEach(function (it, i) {
      var y = i * (alturaBarra + gap);
      var meio = y + alturaBarra / 2 + 4;

      var rot = s('text', {
        x: rotuloW - 8, y: meio, 'text-anchor': 'end',
        'font-size': 11.5, fill: 'var(--text-secondary)'
      }, cortar(it.rotulo, opts.corte || 26));
      if (it.rotulo && it.rotulo.length > (opts.corte || 26)) rot.appendChild(s('title', null, it.rotulo));
      svg.appendChild(rot);

      svg.appendChild(s('rect', { x: rotuloW, y: y, width: trilha, height: alturaBarra, rx: 4, fill: 'var(--surface-3)' }));

      var x = rotuloW;
      series.forEach(function (se) {
        var v = it.segs[se.key] || 0;
        if (!v) return;
        var w = (v / max) * trilha;
        if (w < 2) w = 2;
        var r = s('rect', { x: x, y: y, width: Math.max(0, w - 2), height: alturaBarra, rx: 4, fill: se.cor });
        interativo(r, it.rotulo,
          [[se.label, fmt(v) + ' ' + unidade() + ' (' + UI.pct(v, it.total) + '%)'],
          ['Total', fmt(it.total) + ' ' + unidade()]],
          it.onClick);
        svg.appendChild(r);

        /* percentual dentro do próprio segmento, quando couber */
        var pctSeg = UI.pct(v, it.total);
        if (w > 40) {
          svg.appendChild(s('text', {
            x: x + w / 2 - 1, y: meio, 'text-anchor': 'middle',
            'font-size': 10.5, 'font-weight': 700, fill: '#fff',
            'pointer-events': 'none'
          }, pctSeg + '%'));
        }
        x += w;
      });

      /* à direita: total, quanto está feito e quanto falta */
      var feito = it.segs[feitoKey] || 0;
      var falta = Math.max(0, it.total - feito);
      var pctFeito = UI.pct(feito, it.total);
      var pctFalta = Math.round((100 - pctFeito) * 10) / 10;

      svg.appendChild(s('text', {
        x: W - valorW + 8, y: y + alturaBarra / 2 - 1, 'font-size': 11.5,
        fill: 'var(--text-primary)', 'font-weight': 600
      }, opts.rotuloValor ? opts.rotuloValor(it) : fmt(it.total)));

      var det = s('text', { x: W - valorW + 8, y: y + alturaBarra / 2 + 10, 'font-size': 9.5 });
      det.appendChild(s('tspan', { fill: 'var(--good)', 'font-weight': 700 }, '✔ ' + pctFeito + '%'));
      det.appendChild(s('tspan', { fill: 'var(--text-muted)' }, '  ·  '));
      det.appendChild(s('tspan', { fill: 'var(--warning)', 'font-weight': 700 }, '○ ' + pctFalta + '%'));
      det.appendChild(s('title', null, 'Realizado ' + fmt(feito) + ' · falta ' + fmt(falta) + ' ' + unidade()));
      svg.appendChild(det);
    });

    return svg;
  }

  /**
   * Barras horizontais de série única — usada no ranking de soldadores.
   * items: [{ rotulo, valor, sub, onClick, tooltip:[[rótulo,valor]] }]
   */
  function barrasSimples(items, cor, opts) {
    opts = opts || {};
    var W = 660, rotuloW = opts.rotuloW || 150, valorW = opts.valorW || 96;
    var alturaBarra = 18, gap = 10;
    var H = Math.max(1, items.length) * (alturaBarra + gap) + 4;
    var trilha = W - rotuloW - valorW;
    var max = Math.max(1, Math.max.apply(null, items.map(function (i) { return i.valor; })));

    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });

    items.forEach(function (it, i) {
      var y = i * (alturaBarra + gap);

      svg.appendChild(s('text', {
        x: 4, y: y + alturaBarra / 2 + 4, 'font-size': 11,
        fill: 'var(--text-muted)', 'font-weight': 700
      }, String(i + 1) + '.'));

      svg.appendChild(s('text', {
        x: rotuloW - 8, y: y + alturaBarra / 2 + 4, 'text-anchor': 'end',
        'font-size': 11.5, fill: 'var(--text-secondary)'
      }, cortar(it.rotulo, opts.corte || 24)));

      svg.appendChild(s('rect', { x: rotuloW, y: y, width: trilha, height: alturaBarra, rx: 4, fill: 'var(--surface-3)' }));

      var w = Math.max(3, (it.valor / max) * trilha);
      var r = s('rect', { x: rotuloW, y: y, width: w - 2, height: alturaBarra, rx: 4, fill: cor });
      interativo(r, it.rotulo, it.tooltip, it.onClick);
      svg.appendChild(r);

      svg.appendChild(s('text', {
        x: W - valorW + 8, y: y + alturaBarra / 2 + 4, 'font-size': 11.5,
        fill: 'var(--text-primary)', 'font-weight': 600
      }, it.sub || fmt(it.valor)));
    });
    return svg;
  }

  function barra100(cont, series) {
    var W = 660, H = 26;
    var total = series.reduce(function (a, se) { return a + se.valor; }, 0) || 1;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H });
    var x = 0;
    series.forEach(function (se) {
      if (!se.valor) return;
      var w = (se.valor / total) * W;
      var r = s('rect', { x: x, y: 0, width: Math.max(0, w - 2), height: H, rx: 4, fill: se.cor });
      interativo(r, se.label, [
        [medida === 'pd' ? 'Polegadas' : 'Juntas', fmt(se.valor)],
        ['Participação', UI.pct(se.valor, total) + '%']
      ], se.onClick);
      svg.appendChild(r);
      if (w > 58) {
        svg.appendChild(s('text', {
          x: x + w / 2 - 1, y: H / 2 + 4, 'text-anchor': 'middle',
          'font-size': 11.5, 'font-weight': 700, fill: '#fff'
        }, fmt(se.valor) + ' · ' + UI.pct(se.valor, total) + '%'));
      }
      x += w;
    });
    cont.appendChild(svg);
    cont.appendChild(legenda(series, 'situacao'));
  }

  function linhas(pontos, series) {
    var W = 660, H = 210, mT = 12, mR = 14, mB = 26, mL = 42;
    var iw = W - mL - mR, ih = H - mT - mB;
    var max = 1;
    pontos.forEach(function (p) { series.forEach(function (se) { max = Math.max(max, p.vals[se.key] || 0); }); });
    max = Math.ceil(max / 5) * 5 || 5;

    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H });
    for (var g = 0; g <= 4; g++) {
      var y = mT + ih - (g / 4) * ih;
      svg.appendChild(s('line', { x1: mL, y1: y, x2: mL + iw, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 }));
      svg.appendChild(s('text', { x: mL - 7, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--text-muted)' },
        String(Math.round((g / 4) * max))));
    }

    function px(i) { return mL + (pontos.length === 1 ? iw / 2 : (i / (pontos.length - 1)) * iw); }
    function py(v) { return mT + ih - (v / max) * ih; }

    series.forEach(function (se) {
      var d = pontos.map(function (p, i) {
        return (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(p.vals[se.key] || 0).toFixed(1);
      }).join(' ');
      svg.appendChild(s('path', {
        d: d, fill: 'none', stroke: se.cor, 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      }));
    });

    pontos.forEach(function (p, i) {
      series.forEach(function (se) {
        var c = s('circle', {
          cx: px(i), cy: py(p.vals[se.key] || 0), r: 4, fill: se.cor,
          stroke: 'var(--surface-1)', 'stroke-width': 2
        });
        interativo(c, UI.dataBR(p.x), series.map(function (t) { return [t.label, String(p.vals[t.key] || 0)]; }));
        svg.appendChild(c);
      });
      if (i === 0 || i === pontos.length - 1 || (pontos.length <= 8)) {
        svg.appendChild(s('text', {
          x: px(i), y: H - 8,
          'text-anchor': i === 0 ? 'start' : (i === pontos.length - 1 ? 'end' : 'middle'),
          'font-size': 10, fill: 'var(--text-muted)'
        }, UI.dataBR(p.x).slice(0, 5)));
      }
    });
    return svg;
  }

  /* ---------------- montagem ---------------- */
  function montar(container) {
    root = container;
    UI.clear(root);
    root.appendChild(barra());
    corpo = el('div', { class: 'page wide', id: 'dashBody' });
    root.appendChild(corpo);
    render();
  }

  function barra() {
    var b = el('div', { class: 'toolbar' });
    b.appendChild(el('strong', { text: 'Painel de controle', style: { fontSize: '13px' } }));
    b.appendChild(el('span', { class: 'sep' }));

    b.appendChild(el('span', { class: 'field-inline', text: 'Medir por' }));
    var seg = el('div', { style: { display: 'flex', gap: '2px' } });
    [['juntas', 'Juntas'], ['pd', 'Polegadas (PD)']].forEach(function (m) {
      seg.appendChild(el('button', {
        class: 'btn sm' + (medida === m[0] ? ' primary' : ''),
        text: m[1],
        title: m[0] === 'pd'
          ? 'Polegadas diametrais: soma do diâmetro nominal das juntas'
          : 'Contagem simples de juntas',
        onclick: function () { medida = m[0]; montar(root); }
      }));
    });
    b.appendChild(seg);
    b.appendChild(el('span', { class: 'sep' }));

    b.appendChild(periodo());
    b.appendChild(el('span', { class: 'sep' }));

    /* remonta a barra junto: os campos de data precisam voltar a ficar vazios */
    b.appendChild(el('button', { class: 'btn', text: 'Limpar filtros', onclick: function () { filtros = {}; montar(root); } }));
    b.appendChild(el('button', {
      class: 'btn', text: 'Ver no mapa', title: 'Abre o mapa mostrando apenas as juntas do recorte atual',
      onclick: function () { Mapa.filtrarPor(predicadoAtual(), descricaoFiltros()); App.abrir('mapa'); }
    }));
    b.appendChild(el('button', {
      class: 'btn', text: 'Blocos…', title: 'Escolher o que aparece no painel',
      onclick: escolherBlocos
    }));
    b.appendChild(el('button', {
      class: 'btn', text: 'Imprimir painel',
      onclick: function () { Print.dashboard(document.getElementById('dashBody')); }
    }));
    b.appendChild(el('span', { class: 'sep' }));
    b.appendChild(UI.botoesAbrirFechar(function () { return corpo; }));
    b.appendChild(el('span', { class: 'spacer' }));
    b.appendChild(el('span', { class: 'status-chip', id: 'dashChip' }));
    return b;
  }

  /* ---------------- controle de período ----------------
     Qual data conta, de quando até quando, mais os atalhos que
     cobrem quase todo uso real: mês corrente, 30 dias e o ano.
  ------------------------------------------------------ */
  function periodo() {
    var box = el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' } });

    var selCampo = el('select', {
      title: 'Qual data da junta é usada no filtro de período',
      onchange: function () {
        if (this.value) filtros.campoData = this.value; else delete filtros.campoData;
        render();
      }
    });
    CAMPOS_PERIODO.forEach(function (c) {
      selCampo.appendChild(el('option', { value: c.k, text: c.nome }));
    });
    selCampo.value = filtros.campoData || '';

    function campoData(chave, titulo) {
      return el('input', {
        type: 'date', value: filtros[chave] || '', title: titulo,
        onchange: function () {
          if (this.value) filtros[chave] = this.value; else delete filtros[chave];
          render();
        }
      });
    }

    box.appendChild(el('span', { class: 'field-inline', text: 'Período por' }));
    box.appendChild(selCampo);
    box.appendChild(el('label', { class: 'field-inline' }, [
      el('span', { text: 'de' }), campoData('de', 'Início do período')
    ]));
    box.appendChild(el('label', { class: 'field-inline' }, [
      el('span', { text: 'até' }), campoData('ate', 'Fim do período')
    ]));

    [['mes', 'Este mês'], ['30', '30 dias'], ['ano', 'Este ano']].forEach(function (p) {
      box.appendChild(el('button', {
        class: 'btn sm', text: p[1], onclick: function () { atalhoPeriodo(p[0]); }
      }));
    });

    if (filtros.de || filtros.ate) {
      box.appendChild(el('button', {
        class: 'btn sm', text: 'Todo o período',
        title: 'Voltar a considerar todas as datas',
        onclick: function () { delete filtros.de; delete filtros.ate; montar(root); }
      }));
    }
    return box;
  }

  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function atalhoPeriodo(qual) {
    var hoje = new Date(), ini;
    if (qual === 'mes') ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    else if (qual === 'ano') ini = new Date(hoje.getFullYear(), 0, 1);
    else { ini = new Date(hoje.getTime()); ini.setDate(ini.getDate() - 29); }
    filtros.de = iso(ini);
    filtros.ate = iso(hoje);
    montar(root);
  }

  var ROTFILTRO = {
    area: 'Área', linha: 'Linha', empresa: 'Empresa', soldador: 'Soldador',
    pc: 'P/C', tipo: 'Tipo', material: 'Material', diametro: 'Ø', spool: 'Spool',
    classeInsp: 'Classe insp.', situacao: 'Situação', ensaio: 'Pendência em',
    pendentes: 'Só com pendência', semClasse: 'Sem classe de inspeção',
    liberadaAberta: 'Liberada com ensaio em aberto', etapa: 'Pendente na etapa'
  };

  var ROTSITUACAO = {};
  Store.SITUACOES.forEach(function (x) { ROTSITUACAO[x.k] = x.icone + ' ' + x.label; });

  function rotuloValorFiltro(k, v) {
    if (k === 'situacao') return ROTSITUACAO[v] || v;
    if (k === 'pendentes' || k === 'semClasse' || k === 'liberadaAberta') return 'sim';
    if (k === 'ensaio') return (Store.ENSAIOMAP[v] || {}).nome || v;
    if (k === 'etapa') { var e = ETAPAMAP[String(v).split('|')[0]]; return e ? e.nome : v; }
    return v;
  }

  function chipsFiltro(js) {
    var d = el('div', { class: 'filters' });
    var algum = false;

    if (filtros.de || filtros.ate) {
      algum = true;
      d.appendChild(el('button', {
        class: 'chipf on', title: 'Remover o filtro de período',
        onclick: function () { delete filtros.de; delete filtros.ate; montar(root); }
      }, [
        document.createTextNode(rotuloPeriodo()),
        el('span', { class: 'x', text: '×' })
      ]));
    }

    Object.keys(ROTFILTRO).forEach(function (k) {
      if (!filtros[k]) return;
      algum = true;
      d.appendChild(el('button', {
        class: 'chipf on', title: 'Remover este filtro',
        onclick: function () { delete filtros[k]; render(); }
      }, [
        document.createTextNode(ROTFILTRO[k] + ': ' + cortar(rotuloValorFiltro(k, filtros[k]), 34)),
        el('span', { class: 'x', text: '×' })
      ]));
    });

    if (algum) {
      d.appendChild(el('button', {
        class: 'chipf', text: 'Limpar tudo', onclick: function () { filtros = {}; render(); }
      }));
      d.appendChild(el('button', {
        class: 'chipf', title: 'Abre o mapa mostrando exatamente estas juntas',
        text: '→ Ver ' + js.length + ' juntas no mapa',
        onclick: function () {
          Mapa.filtrarPor(predicadoAtual(), descricaoFiltros());
          App.abrir('mapa');
        }
      }));
    } else {
      d.appendChild(el('span', {
        class: 'hint',
        text: 'Tudo aqui é clicável: indicadores, barras, legendas e linhas das tabelas filtram o painel inteiro.'
      }));
    }
    return d;
  }

  function descricaoFiltros() {
    var p = [];
    if (filtros.de || filtros.ate) p.push(rotuloPeriodo());
    Object.keys(ROTFILTRO).forEach(function (k) {
      if (filtros[k]) p.push(ROTFILTRO[k] + ': ' + rotuloValorFiltro(k, filtros[k]));
    });
    return p.join(' · ') || 'recorte do painel';
  }

  function toggle(campo, valor) {
    return function () {
      if (filtros[campo] === valor) delete filtros[campo]; else filtros[campo] = valor;
      render();
    };
  }

  /* ---------------- render ---------------- */
  function render() {
    if (!corpo) return;
    UI.clear(corpo);

    var todas = base();
    var js = aplicaFiltros(todas);
    var chip = document.getElementById('dashChip');
    if (chip) chip.textContent = js.length + ' de ' + todas.length + ' juntas no recorte';

    if (!todas.length) {
      corpo.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'Sem dados para analisar' }),
        el('p', { text: 'Traga a planilha do mapa de juntas ou comece a preencher na aba "Mapa de Juntas".' }),
        el('div', { style: { display: 'flex', gap: '8px', justifyContent: 'center', marginTop: '14px' } }, [
          el('button', { class: 'btn primary', text: 'Importar mapa do Excel', onclick: function () { Mapa.importar(); } }),
          el('button', { class: 'btn', text: 'Ir para o mapa', onclick: function () { App.abrir('mapa'); } })
        ])
      ]));
      return;
    }

    corpo.appendChild(chipsFiltro(js));
    corpo.appendChild(kpis(js, todas));

    var g = el('div', { class: 'charts' });
    function juntar(id, fn) {
      if (!visivel(id)) return;
      var c = fn();
      if (c) g.appendChild(c);
    }

    juntar('etapas', function () { return cEtapas(js); });
    juntar('avanco', function () { return cardAvanco(js); });
    juntar('situacao', function () { return cSituacao(js); });
    juntar('ensaios', function () { return cEnsaios(js); });
    juntar('topSoldadores', function () { return cTopSoldadores(js); });
    juntar('evolucao', function () { return cEvolucao(js); });
    juntar('soldadores', function () { return cSoldadores(js); });
    juntar('linhas', function () { return cLinhas(js); });
    dimensoes(js).forEach(function (c) { if (visivel(c._bloco)) g.appendChild(c); });
    corpo.appendChild(g);

    if (visivel('pendencias')) corpo.appendChild(tabelaPendencias(js));
    if (visivel('tabSoldadores')) corpo.appendChild(tabelaSoldadores(js));

    if (!g.children.length) {
      corpo.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'Nenhum bloco selecionado' }),
        el('p', { text: 'Use “Blocos…” na barra acima para escolher o que aparece no painel.' })
      ]));
    }
  }

  function kpis(js, todas) {
    var cj = contarSit(js, 'juntas');
    var cp = contarSit(js, 'pd');
    var pdTotal = Store.somaPolegadas(js);
    var pdProjeto = Store.somaPolegadas(todas);

    var totalPend = 0, comPend = 0, porLib = 0, porEnsaio = 0, semClasse = 0, libAberta = 0;
    js.forEach(function (j) {
      var p = Store.pendencias(j).length;
      totalPend += p;
      if (p) comPend++;
      if (!Store.ensaiosExigidos(j).length) semClasse++;
      var liberada = Store.ehData(j.dataLib);
      if (Store.situacao(j) === 'concluido') {
        if (liberada) porLib++; else porEnsaio++;
      }
      if (liberada && p) libAberta++;
    });
    var reparo = UI.pct(cj.reprovado, cj.concluido + cj.reprovado);
    var semDiam = js.filter(function (j) { return !Store.polegadas(j); }).length;

    var k = el('div', { class: 'kpis' });

    k.appendChild(kpi('Juntas no projeto', String(todas.length),
      todas.length !== js.length ? js.length + ' no recorte atual' : 'nenhum filtro aplicado'));

    k.appendChild(kpi('Polegadas diametrais', Store.formatarPD(pdProjeto) + '″',
      (todas.length !== js.length ? Store.formatarPD(pdTotal) + '″ no recorte' : 'soma dos diâmetros nominais') +
      (semDiam ? ' · ' + semDiam + ' sem Ø' : '')));

    var detalhe = porLib && porEnsaio
      ? porLib + ' liberadas · ' + porEnsaio + ' com ensaios completos'
      : (porLib ? 'todas com data de liberação' : 'todos os ensaios exigidos executados');

    k.appendChild(kpi('Juntas concluídas', String(cj.concluido),
      UI.pct(cj.concluido, js.length) + '% de avanço · ' + detalhe, 'good', ['situacao', 'concluido']));

    k.appendChild(kpi('Polegadas concluídas', Store.formatarPD(cp.concluido) + '″',
      UI.pct(cp.concluido, pdTotal) + '% de avanço em polegadas', 'good', ['situacao', 'concluido']));

    k.appendChild(kpi('Aguardando ensaio', String(cj.aguardando),
      Store.formatarPD(cp.aguardando) + '″ · ' + UI.pct(cj.aguardando, js.length) + '% do recorte', 'warn',
      ['situacao', 'aguardando']));

    k.appendChild(kpi('Reprovadas', String(cj.reprovado),
      Store.formatarPD(cp.reprovado) + '″ · índice de reparo ' + reparo + '%', cj.reprovado ? 'bad' : 'good',
      ['situacao', 'reprovado']));

    k.appendChild(kpi('Pendências de ensaio', String(totalPend),
      comPend + ' juntas com pendência', totalPend ? 'warn' : 'good', ['pendentes', '1']));

    if (libAberta) {
      k.appendChild(kpi('Liberadas com ensaio em aberto', String(libAberta),
        'têm data de liberação, mas falta data ou relatório de algum ensaio', 'bad',
        ['liberadaAberta', '1']));
    }

    if (semClasse) {
      k.appendChild(kpi('Sem classe de inspeção', String(semClasse),
        'não entram como concluídas sem data de liberação', 'warn', ['semClasse', '1']));
    }

    return k;
  }

  /* ---------------- avanço físico: juntas × polegadas ---------------- */
  function cardAvanco(js) {
    var pdTot = Store.somaPolegadas(js);
    var nTot = js.length;

    function linhaTab(rot, sub, arr, destaque, onClick) {
      var n = arr.length, pd = Store.somaPolegadas(arr);
      var tr = el('tr', {
        style: destaque ? { fontWeight: '700', background: 'var(--surface-2)' } : null
      }, [
        el('td', null, [
          el('div', { text: rot, style: { fontWeight: destaque ? '700' : '600' } }),
          sub ? el('div', { class: 'hint', text: sub }) : null
        ]),
        el('td', { text: String(n), style: { textAlign: 'right', fontVariantNumeric: 'tabular-nums' } }),
        el('td', { text: UI.pct(n, nTot) + '%', style: { textAlign: 'right', color: 'var(--text-muted)' } }),
        el('td', { text: Store.formatarPD(pd) + '″', style: { textAlign: 'right', fontVariantNumeric: 'tabular-nums' } }),
        el('td', { text: UI.pct(pd, pdTot) + '%', style: { textAlign: 'right', color: 'var(--text-muted)' } })
      ]);
      if (onClick) {
        tr.classList.add('clicavel');
        tr.title = 'Clique para filtrar o painel por esta linha';
        tr.addEventListener('click', onClick);
      }
      return tr;
    }

    var card = cardChart('avanco', 'Avanço físico — juntas × polegadas',
      'Polegadas diametrais (PD) = soma do diâmetro nominal. Clique numa linha para filtrar o painel.');

    var t = el('table', { class: 'plain', style: { marginTop: '4px' } });
    t.appendChild(el('thead', null, [el('tr', null, [
      el('th', { text: '' }),
      el('th', { text: 'Juntas', style: { textAlign: 'right' } }),
      el('th', { text: '%', style: { textAlign: 'right' } }),
      el('th', { text: 'Polegadas', style: { textAlign: 'right' } }),
      el('th', { text: '%', style: { textAlign: 'right' } })
    ])]));

    var tb = el('tbody');
    tb.appendChild(linhaTab('Total do recorte', null, js, true, null));

    var pipe = js.filter(function (j) { return j.pc === 'P'; });
    var campo = js.filter(function (j) { return j.pc === 'C'; });
    var semPC = js.filter(function (j) { return j.pc !== 'P' && j.pc !== 'C'; });
    tb.appendChild(linhaTab('Pipe shop (P)', 'pré-fabricação', pipe, false, toggle('pc', 'P')));
    tb.appendChild(linhaTab('Campo (C)', 'montagem em campo', campo, false, toggle('pc', 'C')));
    if (semPC.length) tb.appendChild(linhaTab('Sem P/C informado', null, semPC, false, null));

    tb.appendChild(el('tr', null, [el('td', { colspan: 5, style: { padding: '2px' } })]));

    Store.SITUACOES.forEach(function (sit) {
      var arr = js.filter(function (j) { return Store.situacao(j) === sit.k; });
      if (!arr.length && sit.k === 'cancelado') return;
      tb.appendChild(linhaTab(sit.icone + ' ' + sit.label, null, arr, false, toggle('situacao', sit.k)));
    });

    t.appendChild(tb);
    card.appendChild(t);
    return card;
  }

  function cSituacao(js) {
    var c = contarSit(js);
    var card = cardChart('situacao', 'Situação geral das juntas', 'Concluída = liberada pela qualidade OU com todos os ensaios exigidos executados (data e relatório lançados)');
    barra100(card, SERIE_SIT.map(function (se) {
      return { key: se.key, label: se.label, cor: se.cor, valor: c[se.key], onClick: toggle('situacao', se.key) };
    }));
    return card;
  }

  function cEnsaios(js) {
    var itens = Store.ENSAIOS.map(function (e) {
      var exigidas = 0, ok = 0, falta = 0;
      js.forEach(function (j) {
        if (!Store.exigeEnsaio(j, e.id)) return;
        var peso = medida === 'pd' ? Store.polegadas(j) : 1;
        exigidas += peso;
        if (Store.estadoEnsaio(j, e.id) === 'ok') ok += peso; else falta += peso;
      });
      var arr = Math.round;
      return {
        rotulo: e.nome, total: arr(exigidas * 100) / 100, id: e.id,
        segs: { ok: arr(ok * 100) / 100, falta: arr(falta * 100) / 100 },
        onClick: falta ? toggle('ensaio', e.id) : null
      };
    }).filter(function (i) { return i.total > 0; });

    var series = [
      { key: 'ok', label: '✔ Concluído', cor: 'var(--good)' },
      { key: 'falta', label: '◷ Pendente', cor: 'var(--warning)' }
    ];
    var card = cardChart('ensaios', 'Avanço dos ensaios exigidos',
      'Apenas os ensaios que a classe de inspeção da junta exige — clique para filtrar as pendências');
    if (!itens.length) {
      card.appendChild(el('div', { class: 'hint', text: 'Nenhuma classe de inspeção informada nas juntas do recorte.' }));
      return card;
    }
    card.appendChild(barrasEmpilhadas(itens, series, {
      rotuloW: 205, corte: 30, chaveFeito: 'ok',
      rotuloValor: function (it) { return fmt(it.segs.ok) + ' / ' + fmt(it.total); }
    }));
    card.appendChild(legenda(series));
    return card;
  }

  function cSoldadores(js) {
    var itens = agrupar(js, function (j) { return [j.soldRaiz, j.soldAcab]; })
      .map(function (x) {
        var cc = contarSit(x.itens);
        return {
          rotulo: x.chave + (Store.nomeSoldador(x.chave) ? ' · ' + Store.nomeSoldador(x.chave) : ''),
          total: totalMed(x.itens), segs: cc, juntas: x.itens.length,
          reparo: UI.pct(cc.reprovado, cc.concluido + cc.reprovado),
          onClick: toggle('soldador', x.chave)
        };
      })
      .sort(function (a, b) { return b.total - a.total; }).slice(0, 14);
    if (!itens.length) return null;

    var card = cardChart('soldadores', 'Desempenho por soldador (sinete)', 'Juntas executadas e índice de reparo — clique para filtrar');
    card.appendChild(barrasEmpilhadas(itens, SERIE_SIT, {
      rotuloW: 170, rotuloValor: function (it) { return fmt(it.total) + ' · ' + it.reparo + '%'; }
    }));
    card.appendChild(legenda(SERIE_SIT, 'situacao'));
    return card;
  }

  /* ============================================================
     AVANÇO POR ETAPA
     Um card por etapa do processo. A base de cada etapa é o que a
     classe de inspeção exige; quando a classe não trata da etapa
     (pintura e teste hidrostático, por exemplo), a base passa a ser
     todas as juntas do recorte — e o card avisa.
     ============================================================ */
  var ETAPAS = [
    { id: 'soldagem', nome: 'Soldagem', sigla: 'VA', ids: ['VA'] },
    { id: 'vs', nome: 'Visual de solda', sigla: 'VS', ids: ['VS'] },
    { id: 'lpr', nome: 'LP raiz', sigla: 'LP-R', ids: ['LPR'] },
    { id: 'lpa', nome: 'LP acabamento', sigla: 'LP-A', ids: ['LPA'] },
    { id: 'us', nome: 'Ultrassom', sigla: 'US', ids: ['US'] },
    { id: 'pintura', nome: 'Pintura', sigla: 'JAT+FUN', ids: ['JAT', 'FUN'] },
    { id: 'th', nome: 'Teste hidrostático', sigla: 'TH', ids: ['TH'] }
  ];
  var ETAPAMAP = {};
  ETAPAS.forEach(function (e) { ETAPAMAP[e.id] = e; });

  function dadosEtapa(js, et) {
    var exigidas = js.filter(function (j) {
      return et.ids.some(function (id) { return Store.exigeEnsaio(j, id); });
    });
    var porClasse = exigidas.length > 0;
    var base = porClasse ? exigidas : js;
    var feitas = base.filter(function (j) {
      return et.ids.every(function (id) { return Store.executado(j, id); });
    });
    return {
      et: et, porClasse: porClasse,
      n: base.length, nf: feitas.length,
      pd: Store.somaPolegadas(base), pdf: Store.somaPolegadas(feitas)
    };
  }

  function cardEtapa(d) {
    var pctJ = UI.pct(d.nf, d.n);
    var pctP = UI.pct(d.pdf, d.pd);
    var pctPrincipal = medida === 'pd' ? pctP : pctJ;
    var faltaN = d.n - d.nf;
    var chave = d.et.id + '|' + (d.porClasse ? 'c' : 't');
    var ativo = filtros.etapa === chave;

    var tom = pctPrincipal >= 99.5 ? 'ok' : (pctPrincipal >= 50 ? 'meio' : 'baixo');

    var card = el('button', {
      class: 'etapa-card ' + tom + (ativo ? ' ativo' : ''),
      type: 'button',
      title: faltaN
        ? 'Clique para ver as ' + faltaN + ' juntas pendentes em ' + d.et.nome.toLowerCase()
        : 'Etapa concluída no recorte atual',
      onclick: faltaN ? toggle('etapa', chave) : null
    });

    card.appendChild(el('div', { class: 'et-topo' }, [
      el('span', { class: 'et-nome', text: d.et.nome }),
      el('span', { class: 'et-sigla', text: d.et.sigla })
    ]));

    card.appendChild(el('div', { class: 'et-pct' }, [
      el('b', { text: pctPrincipal + '%' }),
      el('span', { class: 'et-un', text: medida === 'pd' ? 'das polegadas' : 'das juntas' })
    ]));

    card.appendChild(el('div', { class: 'et-barra' }, [
      el('i', { style: { width: Math.min(100, pctPrincipal) + '%' } })
    ]));

    card.appendChild(el('div', { class: 'et-linha' }, [
      el('span', { text: d.nf.toLocaleString('pt-BR') + ' de ' + d.n.toLocaleString('pt-BR') + ' juntas' }),
      el('b', { text: pctJ + '%' })
    ]));
    card.appendChild(el('div', { class: 'et-linha' }, [
      el('span', { text: Store.formatarPD(d.pdf) + '″ de ' + Store.formatarPD(d.pd) + '″' }),
      el('b', { text: pctP + '%' })
    ]));

    card.appendChild(el('div', { class: 'et-rodape' }, [
      faltaN
        ? el('span', { class: 'et-falta', text: '○ faltam ' + faltaN.toLocaleString('pt-BR') + ' juntas · ' + Store.formatarPD(d.pd - d.pdf) + '″' })
        : el('span', { class: 'et-feito', text: '✔ etapa concluída' }),
      d.porClasse ? null : el('span', { class: 'et-aviso', title: 'A classe de inspeção não cita esta etapa; a base são todas as juntas do recorte.', text: 'base: todas' })
    ]));

    return card;
  }

  function cEtapas(js) {
    var dados = ETAPAS.map(function (et) { return dadosEtapa(js, et); })
      .filter(function (d) { return d.n > 0; });

    var card = cardChart('etapas', 'Avanço por etapa',
      'Cada etapa é considerada executada quando tem data válida e, quando gera relatório, o número dele — clique para ver as pendentes');
    card.classList.add('largo');

    if (!dados.length) {
      card.appendChild(el('div', { class: 'hint', text: 'Nenhuma junta no recorte atual.' }));
      return card;
    }

    var grade = el('div', { class: 'etapas-grade' });
    dados.forEach(function (d) { grade.appendChild(cardEtapa(d)); });
    card.appendChild(grade);
    return card;
  }

  /**
   * Top 10 soldadores por trabalho concluído, na unidade escolhida
   * (juntas ou polegadas). Empate desempata pelo menor índice de reparo.
   */
  function cTopSoldadores(js) {
    var dados = agrupar(js, function (j) { return [j.soldRaiz, j.soldAcab]; })
      .map(function (x) {
        var cj = contarSit(x.itens, 'juntas');
        var concl = 0, total = 0;
        x.itens.forEach(function (j) {
          var peso = medida === 'pd' ? Store.polegadas(j) : 1;
          total += peso;
          if (Store.situacao(j) === 'concluido') concl += peso;
        });
        return {
          sinete: x.chave,
          nome: Store.nomeSoldador(x.chave),
          concluidas: Math.round(concl * 100) / 100,
          total: Math.round(total * 100) / 100,
          juntas: x.itens.length,
          reprovadas: cj.reprovado,
          aguardando: cj.aguardando,
          reparo: UI.pct(cj.reprovado, cj.concluido + cj.reprovado)
        };
      })
      .filter(function (d) { return d.concluidas > 0; })
      .sort(function (a, b) {
        if (b.concluidas !== a.concluidas) return b.concluidas - a.concluidas;
        return a.reparo - b.reparo;
      })
      .slice(0, 10);

    var card = cardChart('topSoldadores', 'Top 10 soldadores',
      'Ranking por ' + (medida === 'pd' ? 'polegadas concluídas' : 'juntas concluídas') +
      ' — clique numa barra para filtrar o painel');

    if (!dados.length) {
      card.appendChild(el('div', { class: 'hint', text: 'Nenhuma junta concluída com sinete informado no recorte.' }));
      return card;
    }

    var itens = dados.map(function (d) {
      return {
        rotulo: d.sinete + (d.nome ? ' · ' + d.nome : ''),
        valor: d.concluidas,
        sub: fmt(d.concluidas) + '  ·  ' + UI.pct(d.concluidas, d.total) + '%',
        onClick: toggle('soldador', d.sinete),
        tooltip: [
          [medida === 'pd' ? 'Polegadas concluídas' : 'Juntas concluídas', fmt(d.concluidas)],
          ['Total executado', fmt(d.total) + (medida === 'pd' ? '″' : '')],
          ['Taxa de conclusão', UI.pct(d.concluidas, d.total) + '%'],
          ['Aguardando ensaio', String(d.aguardando)],
          ['Reprovadas', String(d.reprovadas)],
          ['Índice de reparo', d.reparo + '%']
        ]
      };
    });

    card.appendChild(barrasSimples(itens, 'var(--good)', { rotuloW: 165, corte: 26, valorW: 104 }));
    card.appendChild(el('div', {
      class: 'hint', style: { marginTop: '8px' },
      text: 'Barra = ' + (medida === 'pd' ? 'polegadas' : 'juntas') +
        ' concluídas · à direita, o total e a taxa de conclusão do próprio soldador.'
    }));
    return card;
  }

  function cLinhas(js) {
    var itens = agrupar(js, function (j) { return j.linha; })
      .map(function (x) {
        return {
          rotulo: x.chave, total: totalMed(x.itens), segs: contarSit(x.itens),
          onClick: toggle('linha', x.chave)
        };
      })
      .sort(function (a, b) { return b.total - a.total; }).slice(0, 14);
    if (!itens.length) return null;

    var card = cardChart('linhas', 'Avanço por linha / isométrico', 'As 14 linhas com mais juntas no recorte');
    card.appendChild(barrasEmpilhadas(itens, SERIE_SIT, { rotuloW: 230, corte: 36 }));
    card.appendChild(legenda(SERIE_SIT, 'situacao'));
    return card;
  }

  function cEvolucao(js) {
    var eventos = {};
    function marcar(data, campo) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data || ''))) return;
      if (!eventos[data]) eventos[data] = { soldadas: 0, liberadas: 0 };
      eventos[data][campo]++;
    }
    js.forEach(function (j) { marcar(j.dataVA, 'soldadas'); marcar(j.dataLib, 'liberadas'); });

    var datas = Object.keys(eventos).sort();
    if (datas.length < 2) return null;

    var accS = 0, accL = 0;
    var pontos = datas.map(function (d) {
      accS += eventos[d].soldadas;
      accL += eventos[d].liberadas;
      return { x: d, vals: { soldadas: accS, liberadas: accL } };
    });
    var series = [
      { key: 'soldadas', label: 'Juntas soldadas (acumulado)', cor: 'var(--series-1)' },
      { key: 'liberadas', label: 'Juntas liberadas (acumulado)', cor: 'var(--series-2)' }
    ];
    var card = cardChart('evolucao', 'Evolução acumulada', 'Data de ajuste de solda (VA) e data de liberação');
    card.appendChild(linhas(pontos, series));
    card.appendChild(legenda(series));
    return card;
  }

  function dimensoes(js) {
    var out = [];
    [
      { campo: 'area', titulo: 'Área', corte: 24, w: 150 },
      { campo: 'empresa', titulo: 'Empresa responsável', corte: 26, w: 175 },
      { campo: 'pc', titulo: 'Pré-fabricação × campo', corte: 24, w: 150, desc: 'PC' },
      { campo: 'tipo', titulo: 'Tipo de junta', corte: 24, w: 150 },
      { campo: 'material', titulo: 'Material', corte: 24, w: 150 },
      { campo: 'diametro', titulo: 'Diâmetro', corte: 20, w: 130 }
    ].forEach(function (dim) {
      var itens = agrupar(js, function (j) { return j[dim.campo]; })
        .map(function (x) {
          var rot = x.chave;
          if (dim.desc) {
            var o = (Store.LEGENDA[dim.desc] || []).filter(function (y) { return y.c === x.chave; })[0];
            if (o) rot = x.chave + ' · ' + o.d;
          }
          return {
            rotulo: rot, total: totalMed(x.itens), segs: contarSit(x.itens),
            onClick: Store.COLMAP[dim.campo] && ROTFILTRO[dim.campo] ? toggle(dim.campo, x.chave) : null
          };
        })
        .sort(function (a, b) { return b.total - a.total; }).slice(0, 12);
      if (itens.length < 1) return;
      var card = cardChart('dim.' + dim.campo, dim.titulo, 'Distribuição das juntas do recorte');
      card._bloco = 'dim.' + dim.campo;
      card.appendChild(barrasEmpilhadas(itens, SERIE_SIT, { rotuloW: dim.w, corte: dim.corte }));
      card.appendChild(legenda(SERIE_SIT, 'situacao'));
      out.push(card);
    });
    return out;
  }

  /* ---------------- tabelas ---------------- */
  function tabelaPendencias(js) {
    var linhasPend = [];
    js.forEach(function (j) {
      var p = Store.pendencias(j);
      if (p.length) linhasPend.push({ j: j, p: p });
    });
    linhasPend.sort(function (a, b) { return b.p.length - a.p.length; });

    var conteudo = el('div', { style: { overflowX: 'auto', maxHeight: '440px', overflowY: 'auto' } });

    if (!linhasPend.length) {
      conteudo.appendChild(el('div', { class: 'hint', text: '✔ Nenhuma pendência no recorte atual.' }));
      return UI.card('dash.pendencias', 'Pendências de ensaio',
        'ensaios exigidos pela classe de inspeção e ainda não concluídos', conteudo);
    }

    var t = el('table', { class: 'plain' });
    t.appendChild(el('thead', null, [el('tr', null,
      ['Linha', 'Spool', 'Junta', 'Classe de inspeção', 'Pendências', 'Situação']
        .map(function (h) { return el('th', { text: h }); })
    )]));
    var tb = el('tbody');
    linhasPend.slice(0, 200).forEach(function (r) {
      var sit = Store.situacao(r.j);
      var tr = el('tr', { class: 'clicavel', title: 'Clique para filtrar o painel por esta linha' }, [
        el('td', { text: r.j.linha || '—', style: { maxWidth: '260px' } }),
        el('td', { text: r.j.spool || '—' }),
        el('td', { text: r.j.junta || '—', style: { fontWeight: '600' } }),
        el('td', { text: r.j.classeInsp || '—', style: { color: 'var(--text-muted)', fontSize: '12px' } }),
        el('td', null, [el('span', {
          class: 'cell-badge b-aguardando',
          text: r.p.map(function (e) { return e.id; }).join(' · ')
        })]),
        el('td', null, [el('span', { class: 'cell-badge b-' + sit, text: Store.situacaoCalculada(r.j) })])
      ]);
      tr.addEventListener('click', function () {
        if (r.j.linha) filtros.linha = r.j.linha;
        if (r.j.spool) filtros.spool = r.j.spool;
        render();
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    conteudo.appendChild(t);
    if (linhasPend.length > 200) {
      conteudo.appendChild(el('div', {
        class: 'hint', style: { marginTop: '8px' },
        text: 'Exibindo as 200 primeiras de ' + linhasPend.length + ' juntas com pendência. Use os filtros para reduzir a lista.'
      }));
    }
    return UI.card('dash.pendencias', 'Pendências de ensaio',
      linhasPend.length + ' juntas com ensaio exigido em aberto', conteudo);
  }

  function tabelaSoldadores(js) {
    var conteudo = el('div', { style: { overflowX: 'auto' } });
    var t = el('table', { class: 'plain' });
    t.appendChild(el('thead', null, [el('tr', null,
      ['Sinete', 'Soldador', 'Juntas', 'Polegadas', 'Concluídas', 'Reprovadas', 'Aguardando', 'Índice de reparo']
        .map(function (h) { return el('th', { text: h }); })
    )]));
    var tb = el('tbody');
    agrupar(js, function (j) { return [j.soldRaiz, j.soldAcab]; })
      .map(function (x) {
        var cc = contarSit(x.itens, 'juntas');
        return {
          sinete: x.chave, n: x.itens.length, pd: Store.somaPolegadas(x.itens),
          c: cc, rep: UI.pct(cc.reprovado, cc.concluido + cc.reprovado)
        };
      })
      .sort(function (a, b) { return b.n - a.n; })
      .forEach(function (r) {
        var ativo = filtros.soldador === r.sinete;
        var tr = el('tr', {
          class: 'clicavel' + (ativo ? ' ativo' : ''),
          title: 'Clique para filtrar o painel por este soldador'
        }, [
          el('td', { text: r.sinete, style: { fontWeight: '600' } }),
          el('td', { text: Store.nomeSoldador(r.sinete) || '—' }),
          el('td', { text: String(r.n) }),
          el('td', { text: Store.formatarPD(r.pd) + '″' }),
          el('td', { text: String(r.c.concluido) }),
          el('td', { text: String(r.c.reprovado), style: { color: r.c.reprovado ? 'var(--critical)' : '' } }),
          el('td', { text: String(r.c.aguardando) }),
          el('td', { text: r.rep + '%', style: { fontWeight: '600', color: r.rep > 5 ? 'var(--critical)' : 'var(--good)' } })
        ]);
        tr.addEventListener('click', toggle('soldador', r.sinete));
        tb.appendChild(tr);
      });
    if (!tb.children.length) {
      tb.appendChild(el('tr', null, [el('td', { colspan: 8, text: 'Nenhum sinete informado no mapa.', style: { color: 'var(--text-muted)' } })]));
    }
    t.appendChild(tb);
    conteudo.appendChild(t);
    return UI.card('dash.tabSoldadores', 'Desempenho por soldador',
      'mesma informação do gráfico, em números — clique numa linha para filtrar', conteudo);
  }

  global.Dashboard = { montar: montar, render: render };
})(window);

</script>
<script>
/* ============================================================
   ui-config.js - Aba de configurações: projeto, ensaios,
   soldadores, numeração, modelos .xlsx e backup.
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el;
  var root;

  function montar(container) {
    root = container;
    render();
  }

  function campo(obj, chave, rotulo, opts) {
    opts = opts || {};
    var inp;
    if (opts.opcoes) {
      inp = el('select');
      opts.opcoes.forEach(function (o) { inp.appendChild(el('option', { value: o[0], text: o[1] })); });
      inp.value = obj[chave] || '';
    } else if (opts.linhas) {
      inp = el('textarea', { rows: opts.linhas });
      inp.value = obj[chave] || '';
    } else {
      inp = el('input', { type: opts.tipo || 'text', value: obj[chave] || '', placeholder: opts.ph || '' });
    }
    /* lista de sugestões que continua aceitando texto livre */
    var dl = null;
    if (opts.lista && opts.lista.length) {
      var idDl = 'dl-cfg-' + chave;
      dl = el('datalist', { id: idDl });
      opts.lista.forEach(function (v) { dl.appendChild(el('option', { value: v })); });
      inp.setAttribute('list', idDl);
    }
    inp.addEventListener('input', function () {
      obj[chave] = (opts.tipo === 'number') ? (parseInt(inp.value, 10) || 0) : inp.value;
      Store.notificar('config');
    });
    return el('div', { class: 'f' + (opts.span2 ? ' span2' : '') }, [
      el('label', { text: rotulo }), inp, dl,
      opts.hint ? el('div', { class: 'hint', text: opts.hint }) : null
    ]);
  }

  function card(id, titulo, tagline, conteudo, fechado) {
    return UI.card('cfg.' + id, titulo, tagline, conteudo, { fechado: fechado });
  }

  function render() {
    UI.clear(root);
    var pg = el('div', { class: 'page' });
    var cfg = Store.config;

    pg.appendChild(el('div', {
      style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px', flexWrap: 'wrap' }
    }, [
      el('div', { class: 'hint', style: { flex: '1', minWidth: '200px' }, text: 'Clique no título de qualquer bloco para abrir ou fechar.' }),
      UI.botoesAbrirFechar(function () { return root; })
    ]));

    /* ---------- Mapas por contrato ---------- */
    pg.appendChild(card('mapas', 'Mapas por contrato',
      'cada contrato tem seu próprio mapa, com juntas e relatórios separados', mapas()));

    /* ---------- Projeto ---------- */
    var p = el('div', { class: 'form-grid' }, [
      campo(cfg.projeto, 'cliente', 'Cliente'),
      campo(cfg.projeto, 'contrato', 'Contrato'),
      campo(cfg.projeto, 'projeto', 'Projeto'),
      campo(cfg.projeto, 'empreendimento', 'Empreendimento'),
      campo(cfg.projeto, 'local', 'Local'),
      campo(cfg.projeto, 'equipamento', 'Equipamento padrão', {
        lista: Store.listaEquipamentos(),
        hint: 'Usado nos relatórios que não escolherem outro. Cadastre a lista no bloco "Equipamentos".'
      }),
      campo(cfg.projeto, 'localEnsaio', 'Local do ensaio')
    ]);
    pg.appendChild(card('projeto', 'Dados do projeto', 'preenchem o cabeçalho do mapa e dos dois relatórios', p));

    /* ---------- Equipamentos ---------- */
    pg.appendChild(card('equip', 'Equipamentos',
      'cadastre uma vez; cada relatório escolhe o seu na aba Relatórios', tabelaEquipamentos()));

    /* ---------- EVS ---------- */
    var e = el('div', { class: 'form-grid' }, [
      campo(cfg.evs, 'procedimento', 'Procedimento'),
      campo(cfg.evs, 'revProcedimento', 'Revisão do procedimento'),
      campo(cfg.evs, 'norma', 'Norma de referência'),
      campo(cfg.evs, 'criterio', 'Critério de aceitação'),
      campo(cfg.evs, 'materialBase', 'Material de base', { hint: 'Em branco: usa o metal de base das juntas do relatório.' }),
      campo(cfg.evs, 'condicaoSuperficial', 'Condição superficial do metal de base'),
      campo(cfg.evs, 'iluminacaoMetodo', 'Iluminação e método'),
      campo(cfg.evs, 'intensidadeLux', 'Intensidade da luz (LUX)')
    ]);
    pg.appendChild(card('evs', 'FOR-266 · Ensaio Visual de Solda', 'campos fixos do formulário', e));

    /* ---------- LP ---------- */
    var l = el('div', { class: 'form-grid' }, [
      campo(cfg.lp, 'normas', 'Normas de referência'),
      campo(cfg.lp, 'criterio', 'Critério de aceitação'),
      campo(cfg.lp, 'procedimento', 'Procedimento'),
      campo(cfg.lp, 'revisao', 'Revisão'),
      campo(cfg.lp, 'material', 'Material', { hint: 'Em branco: usa o metal de base das juntas.' }),
      campo(cfg.lp, 'espessura', 'Espessura', { hint: 'Em branco: usa a espessura das juntas.' }),
      campo(cfg.lp, 'confProjeto', 'Conf. projeto'),
      campo(cfg.lp, 'condSuperficial', 'Condição superficial'),
      campo(cfg.lp, 'tipoIluminacao', 'Tipo de iluminação'),
      campo(cfg.lp, 'equipIluminacao', 'Equipamento de iluminação'),
      campo(cfg.lp, 'intensLuminosa', 'Intensidade luminosa'),
      campo(cfg.lp, 'tipoPenetrante', 'Tipo de penetrante', {
        opcoes: [['I', 'Fluorescente (I)'], ['II', 'Visível (II)']]
      }),
      campo(cfg.lp, 'metodoRemocao', 'Método de remoção', {
        opcoes: [['A', 'Água (A)'], ['C', 'Solvente (C)']]
      })
    ]);

  function enviarAssinatura(d, aoConcluir) {
    UI.escolherArquivo('image/*', function (file) {
      var fr = new FileReader();
      fr.onload = function () {
        reduzirImagem(fr.result, 520, function (dataUrl) {
          Store.config.assinaturas[d.img] = dataUrl;
          Store.notificar('config');
          UI.toast('Assinatura de ' + d.rot.toLowerCase() + ' carregada', 'ok');
          render();
          if (aoConcluir) aoConcluir();
        });
      };
      fr.readAsDataURL(file);
    });
  }

  /** Reduz a imagem se necessário, preservando transparência do PNG. */
  function reduzirImagem(dataUrl, larguraMax, cb) {
    if (dataUrl.length <= LIMITE_ASSINATURA && dataUrl.indexOf('data:image/png') === 0) { cb(dataUrl); return; }
    var img = new Image();
    img.onload = function () {
      var escala = Math.min(1, larguraMax / (img.width || larguraMax));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * escala));
      c.height = Math.max(1, Math.round(img.height * escala));
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      var saida = c.toDataURL('image/png');
      if (saida.length > LIMITE_ASSINATURA) {
        /* segunda passada, mais agressiva */
        var c2 = document.createElement('canvas');
        c2.width = Math.max(1, Math.round(c.width * 0.6));
        c2.height = Math.max(1, Math.round(c.height * 0.6));
        c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height);
        saida = c2.toDataURL('image/png');
      }
      cb(saida);
    };
    img.onerror = function () { UI.toast('Não foi possível ler a imagem.', 'err'); };
    img.src = dataUrl;
  }

      text: st.juntas.length + ' juntas · ' + Store.formatarPD(Store.somaPolegadas(Store.juntasPreenchidas())) +
        '″ · ' + st.soldadores.length + ' soldadores' +
        (st.atualizadoEm ? ' · última gravação ' + new Date(st.atualizadoEm).toLocaleString('pt-BR') : '')
    });
    wrap.appendChild(info);

    DB.espaco().then(function (e) {
      if (!e || !e.cota) return;
      info.textContent += ' · armazenamento ' + (Math.round(e.usado / 1048576 * 10) / 10) +
        ' MB de ' + (Math.round(e.cota / 1048576)) + ' MB disponíveis';
    });

    return wrap;
  }

  global.Config = { montar: montar, render: render };
})(window);

</script>
<script>
/* ============================================================
   app.js - Inicialização, abas e navegação
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el, $ = UI.$;

  var ABAS = [
    { id: 'painel', label: 'Painel', montar: function (c) { Dashboard.montar(c); } },
    { id: 'mapa', label: 'Mapa de Juntas', montar: function (c) { Mapa.montar(c); } },
    { id: 'relatorios', label: 'Relatórios', montar: function (c) { RelatoriosUI.montar(c); } },
    { id: 'config', label: 'Configurações', montar: function (c) { Config.montar(c); } },
    { id: 'legenda', label: 'Legenda', montar: function (c) { legenda(c); } }
  ];

  var atual = ABAS[0].id;
  var sujo = {};

  var compartilhado = false;

  async function boot() {
    /* se a página conseguir falar com o banco do artifact, todos os
       visitantes passam a enxergar o mesmo mapa; senão segue local */
    try { compartilhado = await DB.conectar(); } catch (e) { compartilhado = false; }

    await Store.carregar();
    await Store.carregarTemplates();
    aplicarTema(localStorage.getItem('mapaJuntas.tema') || 'light');

    var app = $('#app');
    UI.clear(app);
    app.appendChild(topo());
    ABAS.forEach(function (a) { app.appendChild(el('div', { class: 'view', id: 'view-' + a.id })); });

    Store.onChange(function (origem) {
      ABAS.forEach(function (a) { if (a.id !== atual) sujo[a.id] = true; });
      if (origem === 'import' || origem === 'reset') sujo[atual] = false;
      atualizarChipTopo();
    });

    abrir(ABAS[0].id);
    atualizarChipTopo();

    if (compartilhado) {
      DB.aoMudarRemoto(aoMudarRemoto);
      var m = Store.mapaAtual();
      if (m) DB.escutar(m.id);
    }

    window.addEventListener('afterprint', function () {
      var r = document.getElementById('print-root');
      if (r) UI.clear(r);
    });

    document.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 's') {
        ev.preventDefault();
        Store.salvar(true);
        UI.toast('Dados salvos neste navegador', 'ok', 1500);
      }
    });
  }

  function topo() {
    var bar = el('div', { class: 'topbar' });
    bar.appendChild(el('div', { class: 'brand' }, [
      el('div', { class: 'mark', text: 'MJ' }),
      el('div', null, [
        el('div', { text: 'Mapa de Juntas' }),
        el('small', { id: 'topProjeto', text: '' })
      ])
    ]));
    bar.appendChild(seletorMapa());

    var tabs = el('div', { class: 'tabs', id: 'tabs' });
    ABAS.forEach(function (a) {
      tabs.appendChild(el('button', {
        class: 'tab', id: 'tab-' + a.id, text: a.label,
        onclick: function () { abrir(a.id); }
      }));
    });
    bar.appendChild(tabs);
    bar.appendChild(el('span', { class: 'spacer' }));
    /* quem edita precisa saber se o colega enxerga o que ele está digitando */
    bar.appendChild(el('span', {
      class: 'status-chip', id: 'chipModo',
      style: compartilhado ? { color: 'var(--good)', fontWeight: '600' } : null,
      title: compartilhado
        ? 'Banco compartilhado: todos os usuários deste link trabalham neste mesmo mapa, ao vivo.'
        : 'Os dados ficam apenas neste navegador. Ninguém mais enxerga o que você lançar aqui.',
      text: compartilhado ? '⇅ compartilhado' : '⌂ só neste navegador'
    }));
    bar.appendChild(el('span', { class: 'status-chip', id: 'chipTopo' }));
    bar.appendChild(el('button', {
      class: 'btn sm', id: 'btnTema', text: '◐', title: 'Alternar tema claro/escuro',
      onclick: function () {
        var novo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        aplicarTema(novo);
        localStorage.setItem('mapaJuntas.tema', novo);
      }
    }));
    return bar;
  }

  function aplicarTema(t) { document.documentElement.setAttribute('data-theme', t); }

  /* ---------------- alterações de outros usuários ----------------
     Recarregar no meio da digitação roubaria o foco do campo e poderia
     descartar o que está sendo digitado. Espera ficar ocioso.
  ------------------------------------------------------------------ */
  var recarregaPendente = false;

  function aoMudarRemoto(id) {
    var m = Store.mapaAtual();
    if (!m || m.id !== id || recarregaPendente) return;
    recarregaPendente = true;
    quandoOcioso(async function () {
      recarregaPendente = false;
      try {
        if (await Store.recarregarDoBanco()) {
          recarregar();
          UI.toast('Mapa atualizado por outro usuário', '', 2600);
        }
      } catch (e) { console.warn('Não foi possível aplicar a alteração remota:', e); }
    });
  }

  function quandoOcioso(fn) {
    function tentar() {
      var a = document.activeElement;
      var editando = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
      if (editando || document.querySelector('.modal-bg')) { setTimeout(tentar, 1500); return; }
      fn();
    }
    setTimeout(tentar, 500);
  }

  /* ---------------- seletor de mapa / contrato ---------------- */
  function seletorMapa() {
    var sel = el('select', {
      class: 'sel-mapa', id: 'selMapa',
      title: 'Mapa de juntas aberto — cada contrato tem o seu',
      onchange: async function () {
        if (this.value === '__novo') { this.value = Store.mapaAtual() ? Store.mapaAtual().id : ''; novoMapa(); return; }
        if (this.value === '__gerenciar') { this.value = Store.mapaAtual() ? Store.mapaAtual().id : ''; App.abrir('config'); return; }
        try {
          await Store.abrirMapa(this.value);
          recarregar();
          UI.toast('Mapa aberto: ' + (Store.mapaAtual() || {}).nome, 'ok', 1800);
        } catch (e) { UI.toast(e.message, 'err'); }
      }
    });
    atualizarSeletor(sel);
    return sel;
  }

  function rotuloMapa(m) {
    var p = [m.nome || 'sem nome'];
    if (m.contrato) p.push('contrato ' + m.contrato);
    if (m.juntas) p.push(m.juntas + ' juntas');
    return p.join(' · ');
  }

  function atualizarSeletor(sel) {
    sel = sel || $('#selMapa');
    if (!sel) return;
    UI.clear(sel);
    Store.listaMapas().forEach(function (m) {
      sel.appendChild(el('option', { value: m.id, text: rotuloMapa(m) }));
    });
    sel.appendChild(el('option', { value: '__novo', text: '＋ Novo mapa / contrato…' }));
    sel.appendChild(el('option', { value: '__gerenciar', text: '⚙ Gerenciar mapas…' }));
    var a = Store.mapaAtual();
    if (a) sel.value = a.id;
  }

  function novoMapa(aoCriar) {
    var body = el('div', { class: 'form-grid' });
    function campo(rot, ph) {
      var i = el('input', { type: 'text', placeholder: ph || '' });
      body.appendChild(el('div', { class: 'f' }, [el('label', { text: rot }), i]));
      return i;
    }
    var iNome = campo('Nome do mapa', 'ex.: FRIGO — Área 2');
    var iContrato = campo('Contrato', 'ex.: CT-2026-118');
    var iCliente = campo('Cliente', 'ex.: UNIPAR');
    var aviso = el('div', {
      class: 'hint', style: { gridColumn: '1/-1' },
      text: 'O novo mapa começa vazio, mas já herda os parâmetros de ensaio, as assinaturas, o logotipo e o cadastro de soldadores do mapa atual. Os modelos Excel são compartilhados entre todos.'
    });
    body.appendChild(aviso);

    UI.modal('Novo mapa de juntas', body, [
      { label: 'Cancelar' },
      {
        label: 'Criar mapa', class: 'primary',
        onClick: async function () {
          var nome = iNome.value.trim() || iContrato.value.trim() || 'Novo mapa';
          await Store.criarMapa(nome, iContrato.value.trim(), iCliente.value.trim());
          recarregar();
          UI.toast('Mapa "' + nome + '" criado', 'ok');
          if (aoCriar) aoCriar();
        }
      }
    ]);
    setTimeout(function () { iNome.focus(); }, 60);
  }

  /** Remonta todas as abas — usado ao trocar de mapa. */
  function recarregar() {
    ABAS.forEach(function (a) {
      var v = $('#view-' + a.id);
      if (v) { UI.clear(v); delete v.dataset.montado; }
      sujo[a.id] = false;
    });
    atualizarSeletor();
    abrir(atual);
    atualizarChipTopo();
  }

  function atualizarChipTopo() {
    var c = $('#chipTopo');
    if (c) {
      var d = Store.resumoGeral();
      c.textContent = d.total + ' juntas · ' + Store.formatarPD(d.pd) + '″';
    }
    var p = $('#topProjeto');
    if (p) {
      var m = Store.mapaAtual();
      p.textContent = m && m.contrato
        ? 'contrato ' + m.contrato
        : (Store.config.projeto.cliente || 'controle de tubulação');
    }
    atualizarSeletor();
  }

  function abrir(id) {
    atual = id;
    ABAS.forEach(function (a) {
      var v = $('#view-' + a.id), t = $('#tab-' + a.id);
      var on = a.id === id;
      v.classList.toggle('active', on);
      t.classList.toggle('active', on);
      if (on && (sujo[a.id] || !v.dataset.montado)) {
        a.montar(v);
        v.dataset.montado = '1';
        sujo[a.id] = false;
      }
    });
    atualizarChipTopo();
  }

  /* ---------------- aba Legenda ---------------- */
  function legenda(container) {
    UI.clear(container);
    var pg = el('div', { class: 'page' });

    pg.appendChild(el('div', {
      class: 'hint', style: { marginBottom: '14px' },
      text: 'Códigos usados no mapa. A classe de inspeção de cada junta é o que determina quais ensaios são exigidos e, por consequência, quais relatórios são gerados.'
    }));

    var wrap = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px,1fr))', gap: '14px' } });

    function tabela(titulo, linhas, larg) {
      var c = el('div', { class: 'card', style: { margin: 0 } });
      c.appendChild(el('h3', { text: titulo }));
      var body = el('div', { class: 'card-body', style: { padding: '4px 14px 12px' } });
      var t = el('table', { class: 'plain' });
      var tb = el('tbody');
      linhas.forEach(function (o) {
        tb.appendChild(el('tr', null, [
          el('td', { text: o[0], style: { fontWeight: '700', width: (larg || 90) + 'px', fontFamily: 'var(--mono)', fontSize: '12px' } }),
          el('td', { text: o[1] })
        ]));
      });
      t.appendChild(tb);
      body.appendChild(t);
      c.appendChild(body);
      return c;
    }

    wrap.appendChild(tabela('Local de execução (P/C)',
      Store.LEGENDA.PC.map(function (o) { return [o.c, o.d]; })));

    wrap.appendChild(tabela('Situação da junta', [
      ['Concluido', 'tem data de liberação preenchida'],
      ['Reprovado', 'status de liberação = Reprovado'],
      ['Cancelado', 'status de liberação = Cancelado'],
      ['Aguardando Ensaio', 'demais casos']
    ], 130));

    wrap.appendChild(tabela('Ensaios controlados',
      Store.ENSAIOS.map(function (e) { return [e.id, e.nome]; }), 60));

    wrap.appendChild(tabela('Classe de inspeção — como é lida', [
      ['VA', 'ajuste de solda'],
      ['VS', 'visual de solda → FOR-266'],
      ['LP-R.', 'líquido penetrante na raiz → FOR-053'],
      ['LP A.', 'líquido penetrante no acabamento → FOR-053'],
      ['US', 'ultrassom'],
      ['RX / RT / DM', 'radiografia / END de pré-fabricação'],
      ['PMI', 'identificação positiva de material'],
      ['TH', 'teste hidrostático'],
      ['N/A', 'ensaio não exigido']
    ], 110));

    wrap.appendChild(tabela('Polegadas diametrais (PD)', [
      ['4"', '4,00'],
      ['1.1/2"', '1,50'],
      ['1 1/2"', '1,50'],
      ['3/4"', '0,75'],
      ['PD total', 'soma do Ø nominal de todas as juntas']
    ], 90));

    wrap.appendChild(tabela('Campos de data', [
      ['↵ Enter', 'preenche o campo vazio com a data de referência'],
      ['Duplo clique', 'mesmo efeito do Enter'],
      ['Ctrl + D', 'copia o valor da linha de cima'],
      ['Texto livre', 'aceito (ex.: "Falta US", "N/A")']
    ], 110));

    pg.appendChild(wrap);
    container.appendChild(pg);
  }

  global.App = { boot: boot, abrir: abrir, recarregar: recarregar, novoMapa: novoMapa };
  /* na versão publicada o conteúdo pode ser injetado depois do
     DOMContentLoaded — aí o evento nunca dispara e a tela fica em "Carregando…" */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
