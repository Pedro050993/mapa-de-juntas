<style>
/* ============================================================
   style.css - Mapa de Juntas Soldadas
   ============================================================ */

:root {
  color-scheme: light;
  --bg:            #f4f5f3;
  --surface-1:     #ffffff;
  --surface-2:     #fbfbfa;
  --surface-3:     #f0efec;
  --border:        #d8d7d2;
  --border-strong: #b6b5ae;
  --text-primary:  #14140f;
  --text-secondary:#52514e;
  --text-muted:    #7c7b74;
  --accent:        #1f3864;
  --accent-soft:   #e4eaf5;
  --accent-text:   #ffffff;

  /* paleta categorica validada (modo claro) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;

  /* status (fixo, nunca tematizado) */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  --grid:     #e6e5e1;
  --shadow:   0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --radius:   8px;
  --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
  --sans: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Arial, sans-serif;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg:            #121211;
  --surface-1:     #1a1a19;
  --surface-2:     #212120;
  --surface-3:     #2a2a28;
  --border:        #3a3a37;
  --border-strong: #55554f;
  --text-primary:  #ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:    #91908a;
  --accent:        #4f7ec0;
  --accent-soft:   #23324a;
  --accent-text:   #ffffff;

  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;

  --grid:   #313130;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------------- Layout ---------------- */
#app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px; height: 54px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; flex-shrink: 0; }
.brand .mark {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; font-size: 13px; font-weight: 800;
}
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--text-muted); letter-spacing: 0;
  max-width: 190px; overflow: hidden; text-overflow: ellipsis; }

.sel-mapa {
  max-width: 300px; border: 1px solid var(--border-strong); background: var(--surface-2);
  border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-weight: 600;
  color: var(--text-primary); flex-shrink: 0;
}
.sel-mapa:hover { background: var(--surface-3); }

.tabs { display: flex; gap: 2px; margin-left: 10px; }
.tab {
  border: 0; background: transparent; cursor: pointer;
  padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 13px;
  color: var(--text-secondary); white-space: nowrap;
}
.tab:hover { background: var(--surface-3); color: var(--text-primary); }
.tab.active { background: var(--accent); color: var(--accent-text); }

.spacer { flex: 1; }

.status-chip {
  font-size: 11.5px; color: var(--text-muted);
  padding: 4px 10px; border-radius: 999px; background: var(--surface-3);
  white-space: nowrap;
}

.view { flex: 1; overflow: auto; display: none; }
.view.active { display: block; }

/* Abas com grade/painel próprio: a rolagem acontece dentro da área de dados,
   não na página — assim a barra horizontal fica sempre presa no rodapé visível. */
.view.view-grid.active { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.view.view-grid > .toolbar { flex-shrink: 0; position: static; }

/* ---------------- Botões ---------------- */
.btn {
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-primary); border-radius: 6px; padding: 6px 12px;
  cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { color: var(--critical); border-color: var(--critical); }
.btn.danger:hover { background: color-mix(in srgb, var(--critical) 12%, transparent); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
.toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

.field-inline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
.field-inline input, .field-inline select {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 5px; padding: 5px 8px; min-width: 0;
}

/* ---------------- Grade do mapa ---------------- */
.grid-wrap {
  flex: 1; min-height: 0;
  overflow: auto; overscroll-behavior: contain;
  padding: 0 0 6px 0;
  scrollbar-width: auto;
  scrollbar-color: var(--border-strong) var(--surface-3);
}

/* barras de rolagem largas e sempre visíveis — a grade tem quase 50 colunas */
.grid-wrap::-webkit-scrollbar { width: 15px; height: 16px; }
.grid-wrap::-webkit-scrollbar-track {
  background: var(--surface-3);
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
}
.grid-wrap::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 9px;
  border: 3px solid var(--surface-3); min-width: 46px; min-height: 46px;
}
.grid-wrap::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
.grid-wrap::-webkit-scrollbar-thumb:active { background: var(--accent); }
.grid-wrap::-webkit-scrollbar-corner { background: var(--surface-3); }

/* atalhos de navegação lateral */
.nav-lateral { display: flex; align-items: center; gap: 2px; }
.nav-lateral .btn { padding: 4px 7px; font-size: 12px; line-height: 1; }

table.grid {
  border-collapse: separate; border-spacing: 0;
  font-size: 12px; background: var(--surface-1);
  width: max-content; min-width: 100%;
}
table.grid th, table.grid td {
  border-right: 1px solid var(--grid);
  border-bottom: 1px solid var(--grid);
  padding: 0; text-align: center; vertical-align: middle;
}
table.grid thead th {
  position: sticky; z-index: 20;
  background: var(--accent); color: var(--accent-text);
  font-size: 11px; font-weight: 700; line-height: 1.2;
  padding: 6px 4px; border-right: 1px solid rgba(255,255,255,.18);
  border-bottom: 1px solid rgba(255,255,255,.18);
  text-transform: uppercase; letter-spacing: .02em;
}
table.grid thead tr:nth-child(1) th { top: 0; }
table.grid thead tr:nth-child(2) th { top: 34px; }
table.grid thead th.extra { background: #4a4a45; }
html[data-theme="dark"] table.grid thead th.extra { background: #45443f; }

table.grid td.rownum, table.grid th.rownum {
  position: sticky; left: 0; z-index: 21;
  background: var(--surface-3); color: var(--text-muted);
  font-size: 11px; font-variant-numeric: tabular-nums; width: 46px; min-width: 46px;
  border-right: 1px solid var(--border-strong);
}
table.grid thead th.rownum { z-index: 25; background: var(--accent); color: var(--accent-text); }

table.grid tbody tr:nth-child(even) td { background: var(--surface-2); }
table.grid tbody tr:hover td { background: var(--accent-soft); }
table.grid tbody tr.sel td { background: color-mix(in srgb, var(--series-1) 14%, transparent); }
table.grid tbody tr.rep td.st { color: var(--critical); font-weight: 700; }
table.grid tbody tr.apr td.st { color: var(--good); font-weight: 700; }

/* altura fixa: a grade é virtualizada e depende disso */
table.grid tbody tr { height: 30px; }
table.grid tbody tr.spacer-row { height: auto; }
table.grid tbody tr.spacer-row td { border: 0; padding: 0; background: transparent !important; }

table.grid td input, table.grid td select {
  width: 100%; height: 28px; border: 0; background: transparent; padding: 4px;
  text-align: center; outline: none; font-size: 12px; min-width: 0;
}
table.grid td input:focus, table.grid td select:focus {
  background: var(--surface-1);
  box-shadow: inset 0 0 0 2px var(--series-1);
  border-radius: 3px;
}
table.grid td.txt input { text-align: left; padding-left: 7px; }
table.grid td.extra { background: color-mix(in srgb, var(--text-muted) 6%, transparent) !important; }

.cell-badge {
  display: inline-block; min-width: 34px; padding: 1px 6px; border-radius: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
}
.b-concluido  { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.b-reprovado  { background: color-mix(in srgb, var(--critical) 18%, transparent); color: var(--critical); }
.b-aguardando { background: color-mix(in srgb, var(--warning) 26%, transparent); color: #8a5d00; }
.b-cancelado  { background: var(--surface-3); color: var(--text-muted); }
html[data-theme="dark"] .b-aguardando { color: var(--warning); }

table.grid tbody tr.sit-reprovado td.rownum { box-shadow: inset 3px 0 0 var(--critical); }
table.grid tbody tr.sit-concluido td.rownum { box-shadow: inset 3px 0 0 var(--good); }
table.grid tbody tr.sit-aguardando td.rownum { box-shadow: inset 3px 0 0 var(--warning); }
table.grid tbody tr.sit-cancelado td.rownum { box-shadow: inset 3px 0 0 var(--text-muted); }

.row-actions { display: flex; gap: 3px; justify-content: center; padding: 2px; }
.icon-btn {
  border: 0; background: transparent; cursor: pointer; color: var(--text-muted);
  padding: 2px 5px; border-radius: 4px; font-size: 13px; line-height: 1;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text-primary); }
.icon-btn.del:hover { color: var(--critical); }

/* ---------------- Painéis / formulários ---------------- */
.page { padding: 18px 20px 80px; max-width: 1400px; margin: 0 auto; }
.page.wide { max-width: none; }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  margin-bottom: 16px; overflow: hidden;
}
.card > h3 {
  margin: 0; padding: 11px 14px; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary);
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  line-height: 1.5;
}
.card > h3 .tagline { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-muted); margin-left: 6px; }
.card-body { padding: 14px; }

/* ---------------- Blocos recolhíveis ---------------- */
.card-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  padding-right: 12px;
}
.card-head {
  flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px;
  border: 0; background: transparent; cursor: pointer; text-align: left;
  padding: 11px 14px; line-height: 1.5; color: var(--text-secondary);
}
.card-head:hover { color: var(--text-primary); }
.card-head:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; border-radius: 4px; }
.card-head .card-titulo {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
}
.card-head .tagline {
  font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-muted);
  font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-head .chev {
  flex-shrink: 0; font-size: 11px; color: var(--text-muted);
  transition: transform .15s ease; transform-origin: 50% 55%; align-self: center;
}
.card.fechado > .card-bar { border-bottom: 0; }
.card.fechado .card-head .chev { transform: rotate(-90deg); }
.card.fechado > .card-body { display: none; }

.chart-card > .card-bar { background: transparent; border-bottom: 0; padding-right: 0; margin: -4px 0 2px; }
.chart-card > .card-bar .card-head { padding: 4px 0; color: var(--text-primary); }
.chart-card > .card-bar .card-head .card-titulo { font-size: 13px; text-transform: none; letter-spacing: -.01em; }
.chart-card.fechado > .card-body { display: none; }
.chart-card.fechado .card-head .chev { transform: rotate(-90deg); }
.chart-card > .card-body { padding: 0; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 14px; }
.form-grid.two { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.f { display: flex; flex-direction: column; gap: 4px; }
.f.span2 { grid-column: span 2; }
.f label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.f input, .f select, .f textarea {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 6px; padding: 7px 9px; width: 100%;
}
.f input:focus, .f select:focus, .f textarea:focus {
  outline: none; border-color: var(--series-1);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--series-1) 18%, transparent);
}
.hint { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }

/* prévia da assinatura */
.sig-previa {
  height: 56px; border: 1px dashed var(--border-strong); border-radius: 6px;
  display: grid; place-items: center; background: var(--surface-2); overflow: hidden;
}
.sig-previa.tem { border-style: solid; background: #fff; }
.sig-previa img { max-height: 48px; max-width: 96%; object-fit: contain; }

.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }

table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
table.plain th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border);
}
table.plain td { padding: 4px 8px; border-bottom: 1px solid var(--grid); }
table.plain input { width: 100%; border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 5px; }
table.plain input:focus { outline: none; border-color: var(--series-1); background: var(--surface-2); }

/* ---------------- Dashboard ---------------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi .k-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 600; }
.kpi .k-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .k-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
.kpi .k-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--series-1); }
.kpi.good .k-bar { background: var(--good); }
.kpi.bad  .k-bar { background: var(--critical); }
.kpi.warn .k-bar { background: var(--warning); }

.kpis { grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; align-items: start; }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px 14px;
}
/* blocos largos ocupam a linha inteira */
.chart-card.largo { grid-column: 1 / -1; }
.chart-card h4 {
  margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: -.01em;
}
.chart-card .sub { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.45; }

.icon-btn.expandir { font-size: 15px; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
.icon-btn.expandir:hover { background: var(--surface-3); color: var(--accent); }

/* janela do gráfico ampliado */
.modal-bg.modal-largo .modal { max-width: min(1280px, 96vw); width: 100%; max-height: 92vh; }
.viz-grande { min-height: 40vh; }
.viz-grande .sub { font-size: 13px; margin-bottom: 16px; }
.viz-grande svg { max-height: 68vh; }
.viz-grande .legend { font-size: 13px; gap: 8px 12px; }
.viz-grande table.plain { font-size: 13.5px; }
.viz-grande .etapas-grade { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

/* ---------------- Cards de avanço por etapa ---------------- */
/* as sete etapas cabem numa linha só, na ordem do processo */
.etapas-grade {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px;
}
.etapa-card {
  text-align: left; font: inherit; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 11px 9px;
  display: flex; flex-direction: column; gap: 5px;
  transition: border-color .12s, transform .12s;
}
.etapa-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.etapa-card.ativo { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.etapa-card:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.et-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; min-height: 26px; }
.et-nome {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
  line-height: 1.2; min-width: 0;
}
.et-sigla {
  font-size: 9px; font-family: var(--mono); color: var(--text-muted);
  background: var(--surface-3); border-radius: 4px; padding: 1px 4px;
  white-space: nowrap; flex-shrink: 0; align-self: flex-start;
}
.et-pct { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.et-pct b { font-size: 23px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.et-un { font-size: 10px; color: var(--text-muted); }

.et-barra { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.et-barra i { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .2s; }
.etapa-card.baixo .et-barra i { background: var(--warning); }
.etapa-card.meio .et-barra i { background: var(--series-3); }

.et-linha {
  display: flex; justify-content: space-between; gap: 6px;
  font-size: 10.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden;
}
.et-linha span { overflow: hidden; text-overflow: ellipsis; }
.et-linha b { color: var(--text-primary); flex-shrink: 0; }
.et-rodape {
  display: flex; justify-content: space-between; align-items: center; gap: 5px;
  margin-top: 2px; padding-top: 6px; border-top: 1px solid var(--grid);
  font-size: 10px; flex-wrap: wrap;
}
.et-falta { color: var(--warning); font-weight: 600; }
.et-feito { color: var(--good); font-weight: 600; }
.et-aviso {
  color: var(--text-muted); background: var(--surface-3);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap; cursor: help;
}
.chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; font-size: 11.5px; color: var(--text-secondary); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.leg-item {
  border: 1px solid transparent; background: transparent; color: inherit;
  font-size: 11.5px; padding: 3px 8px; border-radius: 999px; line-height: 1.2;
}
.leg-item.clicavel { cursor: pointer; }
.leg-item.clicavel:hover { border-color: var(--border-strong); background: var(--surface-2); }

<div id="app">
  <div style="padding:60px;text-align:center;color:#777">Carregando…</div>

<div id="print-root"></div>

  <p style="padding:40px;font-family:sans-serif">
    Este aplicativo precisa de JavaScript habilitado.
  </p>

<script>
/* ============================================================
   db.js - Armazenamento do aplicativo.

   Dois backends, mesma interface (get/put/del/chaves/todos):

   LOCAL (IndexedDB) — sempre disponível. É o modo do arquivo
   .html avulso: cada navegador guarda o seu.

   COMPARTILHADO (capability "db") — quando a página publicada
   consegue falar com o banco do artifact. Todos os visitantes
   enxergam o MESMO mapa e as alterações chegam ao vivo.

   Os modelos .xlsx ficam SEMPRE no IndexedDB: são binários de
   vários MB e um documento do banco aceita 256 KiB.
   ============================================================ */
(function (global) {
  'use strict';

  var NOME = 'mapaJuntas';
  var VERSAO = 1;
  var ST_ESTADO = 'estado';
  var ST_MODELOS = 'modelos';

  var conexao = null;

  function abrir() {
    if (conexao) return Promise.resolve(conexao);
    return new Promise(function (res, rej) {
      if (!global.indexedDB) { rej(new Error('IndexedDB indisponível neste navegador.')); return; }
      var req = indexedDB.open(NOME, VERSAO);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(ST_ESTADO)) db.createObjectStore(ST_ESTADO);
        if (!db.objectStoreNames.contains(ST_MODELOS)) db.createObjectStore(ST_MODELOS);
      };
      req.onsuccess = function () { conexao = req.result; res(conexao); };
      req.onerror = function () { rej(req.error); };
    });
  }

  function transacao(store, modo, fn) {
    return abrir().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, modo);
        var os = tx.objectStore(store);
        var pedido = fn(os);
        tx.oncomplete = function () { res(pedido ? pedido.result : undefined); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error || new Error('transação cancelada')); };
      });
    });
  }

  function localGet(store, chave) {
    return transacao(store, 'readonly', function (os) { return os.get(chave); });
  }
  function localPut(store, chave, valor) {
    return transacao(store, 'readwrite', function (os) { return os.put(valor, chave); });
  }
  function localDel(store, chave) {
    return transacao(store, 'readwrite', function (os) { return os.delete(chave); });
  }
  function localChaves(store) {
    return transacao(store, 'readonly', function (os) { return os.getAllKeys(); });
  }
  function localTodos(store) {
    return transacao(store, 'readonly', function (os) { return os.getAll(); });
  }
  function localLimpar(store) {
    return transacao(store, 'readwrite', function (os) { return os.clear(); });
  }

  /* ============================================================
     BACKEND COMPARTILHADO

     Layout no banco do artifact:
       mapas/{id}                   nome, contrato, cliente, totais
       mapas/{id}/dados/config      configurações, sem as imagens
       mapas/{id}/dados/soldadores  cadastro de soldadores
       mapas/{id}/dados/overrides   ajustes manuais dos relatórios
       mapas/{id}/dados/img_*       logotipo e assinaturas, um doc cada
       mapas/{id}/juntas/c{n}       blocos de juntas

     Um documento aceita 256 KiB — daí os blocos. A gravação é
     last-writer-wins, então antes de regravar um bloco o cliente
     tira uma trava curta, relê o bloco e mescla junta a junta:
     o que EU mudei desde a última leitura vence; o resto fica
     como está no servidor, preservando a edição do colega.
     ============================================================ */
  var COL = 'mapas';
  var POR_BLOCO = 60;            /* ~60 juntas cabem folgadas em 256 KiB */
  var CHAVE_ATUAL = 'mapaJuntas.mapaAtual';

  var remoto = null;             /* namespace do banco, ou null */
  var base = {};                 /* mapaId -> { juntaId: json } da última visão do servidor */
  var ouvintes = [];             /* avisados quando o mapa aberto muda no servidor */
  var assinatura = null;         /* unsubscribe do onSnapshot ativo */
  var mapaOuvido = null;
  var idCliente = 'c' + Math.random().toString(36).slice(2, 10);

  function docMapa(id) { return remoto.doc(COL + '/' + id); }
  function colDados(id) { return docMapa(id).collection('dados'); }
  function colJuntas(id) { return docMapa(id).collection('juntas'); }

  var IMAGENS = [
    { doc: 'img_logo', pega: function (e) { return e.config.logo || ''; },
      pousa: function (e, v) { e.config.logo = v; } },
    { doc: 'img_inspetor', pega: function (e) { return e.config.assinaturas.imgInspetor || ''; },
      pousa: function (e, v) { e.config.assinaturas.imgInspetor = v; } },
    { doc: 'img_supervisor', pega: function (e) { return e.config.assinaturas.imgSupervisor || ''; },
      pousa: function (e, v) { e.config.assinaturas.imgSupervisor = v; } },
    { doc: 'img_cliente', pega: function (e) { return e.config.assinaturas.imgClienteFisc || ''; },
      pousa: function (e, v) { e.config.assinaturas.imgClienteFisc = v; } }
  ];

  /** config sem as imagens — elas vão em documentos próprios. */
  function configLeve(config) {
    var c = JSON.parse(JSON.stringify(config || {}));
    c.logo = '';
    if (c.assinaturas) { c.assinaturas.imgInspetor = ''; c.assinaturas.imgSupervisor = ''; c.assinaturas.imgClienteFisc = ''; }
    return c;
  }

  function blocos(juntas) {
    var out = [];
    for (var i = 0; i < juntas.length; i += POR_BLOCO) out.push(juntas.slice(i, i + POR_BLOCO));
    return out.length ? out : [[]];
  }

  function indexarPorId(juntas) {
    var m = {};
    (juntas || []).forEach(function (j) { if (j && j._id) m[j._id] = JSON.stringify(j); });
    return m;
  }

  /* ---------------- leitura ---------------- */
  async function remotoGetEstado(id) {
    var dados = colDados(id);
    var lidos = await Promise.all([
      dados.doc('config').get(),
      dados.doc('soldadores').get(),
      dados.doc('overrides').get(),
      docMapa(id).get(),
      colJuntas(id).get()
    ]);
    var cfg = lidos[0], sold = lidos[1], ovr = lidos[2], meta = lidos[3], js = lidos[4];
    if (!meta.exists && !cfg.exists && js.empty) return undefined;

    /* blocos vêm ordenados por id; c000, c001… mantêm a ordem original */
    var juntas = [];
    js.docs.slice().sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); })
      .forEach(function (d) {
        var v = d.data() || {};
        (v.lista || []).forEach(function (j) { juntas.push(j); });
      });

    var estado = {
      versao: 2,
      config: (cfg.exists && cfg.data().v) ? cfg.data().v : {},
      soldadores: (sold.exists && sold.data().lista) ? sold.data().lista : [],
      overrides: (ovr.exists && ovr.data().v) ? ovr.data().v : {},
      juntas: juntas,
      atualizadoEm: meta.exists ? (meta.data().em || null) : null
    };

    if (!estado.config.assinaturas) estado.config.assinaturas = {};
    var imgs = await Promise.all(IMAGENS.map(function (im) { return colDados(id).doc(im.doc).get(); }));
    imgs.forEach(function (snap, i) {
      if (snap.exists && snap.data().v) IMAGENS[i].pousa(estado, snap.data().v);
    });

    base[id] = indexarPorId(juntas);
    return estado;
  }

  async function remotoGetIndice() {
    var snap = await remoto.collection(COL).get();
    var lista = snap.docs.map(function (d) {
      var v = d.data() || {};
      return {
        id: d.id, nome: v.nome || 'Mapa sem nome', contrato: v.contrato || '',
        cliente: v.cliente || '', juntas: v.juntas || 0, pd: v.pd || 0,
        em: v.em || '', nomeManual: !!v.nomeManual
      };
    });
    /* qual mapa ESTE usuário tem aberto é escolha dele, não do grupo */
    var atual = null;
    try { atual = localStorage.getItem(CHAVE_ATUAL); } catch (e) { atual = null; }
    if (!lista.some(function (m) { return m.id === atual; })) atual = lista.length ? lista[0].id : null;
    return { atual: atual, lista: lista };
  }

  /* ---------------- gravação ---------------- */
  async function gravarBloco(id, indice, listaLocal) {
    var ref = colJuntas(id).doc(nomeBloco(indice));
    var meu = indexarPorId(listaLocal);
    var anterior = base[id] || {};

    /* trava curta só para coordenar quem também usa acquire() */
    var trava = null;
    try { trava = await ref.acquire({ holder: idCliente, ttlMs: 8000 }); } catch (e) { trava = null; }

    var atual = null;
    try { atual = await ref.get(); } catch (e) { atual = null; }

    var lista = listaLocal;
    if (trava && trava.acquired === false && atual && atual.exists) {
      /* alguém está gravando agora: mescla em vez de sobrescrever */
      var deles = (atual.data().lista || []);
      var saida = [], vistos = {};
      deles.forEach(function (j) {
        var k = j && j._id;
        if (!k) { saida.push(j); return; }
        vistos[k] = true;
        if (!(k in meu)) {
          /* eu apaguei? só se eu conhecia antes; senão é junta nova do colega */
          if (anterior[k]) return;
          saida.push(j);
          return;
        }
        /* eu mexi nesta junta desde a última leitura? então a minha vale */
        saida.push(meu[k] !== anterior[k] ? JSON.parse(meu[k]) : j);
      });
      listaLocal.forEach(function (j) { if (j && j._id && !vistos[j._id]) saida.push(j); });
      lista = saida;
    }

    await ref.set({ i: indice, lista: lista });
    return lista;
  }

  function nomeBloco(n) {
    var s = String(n);
    while (s.length < 4) s = '0' + s;
    return 'c' + s;
  }

  /* Cada tecla digitada agenda uma gravação. Sem este cache o mapa inteiro
     seria reescrito toda vez, estourando o limite de chamadas por visitante
     — então só sobe para o servidor o documento que mudou de fato. */
  var cacheDocs = {};
  /* 'comparar' permite ignorar campos voláteis (o carimbo de hora, que
     muda a cada gravação e sozinho não justifica uma escrita). */
  async function setSeMudou(ref, chave, corpo, comparar) {
    var json = JSON.stringify(comparar === undefined ? corpo : comparar);
    if (cacheDocs[chave] === json) return false;
    await ref.set(corpo);
    cacheDocs[chave] = json;
    return true;
  }

  async function remotoPutEstado(id, estado) {
    var partes = blocos(estado.juntas || []);
    var dados = colDados(id);

    await setSeMudou(dados.doc('config'), id + '/config', { v: configLeve(estado.config) });
    await setSeMudou(dados.doc('soldadores'), id + '/soldadores', { lista: estado.soldadores || [] });
    await setSeMudou(dados.doc('overrides'), id + '/overrides', { v: estado.overrides || {} });

    for (var i = 0; i < IMAGENS.length; i++) {
      var v = '';
      try { v = IMAGENS[i].pega(estado) || ''; } catch (e) { v = ''; }
      await setSeMudou(dados.doc(IMAGENS[i].doc), id + '/' + IMAGENS[i].doc, { v: v });
    }

    var gravadas = [], mexeu = false;
    for (var b = 0; b < partes.length; b++) {
      var chave = id + '/' + nomeBloco(b);
      if (cacheDocs[chave] === JSON.stringify({ i: b, lista: partes[b] })) {
        partes[b].forEach(function (j) { gravadas.push(j); });
        continue;                                        /* bloco intocado */
      }
      var res = await gravarBloco(id, b, partes[b]);
      cacheDocs[chave] = JSON.stringify({ i: b, lista: res });
      res.forEach(function (j) { gravadas.push(j); });
      mexeu = true;
    }

    /* blocos que sobraram de uma versão maior do mapa */
    if (mexeu) {
      var existentes = await colJuntas(id).get();
      for (var k = 0; k < existentes.docs.length; k++) {
        var d = existentes.docs[k];
        if (parseInt(d.id.slice(1), 10) >= partes.length) {
          try { await colJuntas(id).doc(d.id).delete(); } catch (e) { /* ignora */ }
          delete cacheDocs[id + '/' + d.id];
        }
      }
    }

    base[id] = indexarPorId(gravadas);

    var meta = await docMapa(id).get();
    var antes = meta.exists ? meta.data() : {};
    var corpoMeta = {
      nome: antes.nome || '', contrato: (estado.config.projeto || {}).contrato || '',
      cliente: (estado.config.projeto || {}).cliente || '',
      nomeManual: !!antes.nomeManual,
      juntas: (estado.juntas || []).length,
      pd: antes.pd || 0
    };
    await setSeMudou(docMapa(id), id + '/__meta',
      Object.assign({}, corpoMeta, { em: estado.atualizadoEm || new Date().toISOString() }),
      corpoMeta);
  }

  async function remotoPutIndice(v) {
    try { if (v && v.atual) localStorage.setItem(CHAVE_ATUAL, v.atual); } catch (e) { /* ignora */ }
    var lista = (v && v.lista) || [];
    for (var i = 0; i < lista.length; i++) {
      var m = lista[i];
      var corpo = {
        nome: m.nome || '', contrato: m.contrato || '', cliente: m.cliente || '',
        nomeManual: !!m.nomeManual, juntas: m.juntas || 0, pd: m.pd || 0
      };
      try {
        await setSeMudou(docMapa(m.id), m.id + '/__meta',
          Object.assign({}, corpo, { em: m.em || new Date().toISOString() }), corpo);
      } catch (e) { /* um mapa recém-excluído pode não existir mais */ }
    }
  }

  async function remotoDel(id) {
    var js = await colJuntas(id).get();
    for (var i = 0; i < js.docs.length; i++) {
      try { await colJuntas(id).doc(js.docs[i].id).delete(); } catch (e) { /* ignora */ }
    }
    var fixos = ['config', 'soldadores', 'overrides'].concat(IMAGENS.map(function (im) { return im.doc; }));
    for (var k = 0; k < fixos.length; k++) {
      try { await colDados(id).doc(fixos[k]).delete(); } catch (e) { /* ignora */ }
    }
    try { await docMapa(id).delete(); } catch (e) { /* ignora */ }
    delete base[id];
  }

  /* ---------------- alterações vindas de outros ---------------- */
  function escutar(id) {
    if (sb) { if (mapaOuvido !== id) { mapaOuvido = id; sbEscutar(id); } return; }
    if (assinatura && mapaOuvido === id) return;
    if (assinatura) { assinatura(); assinatura = null; }
    mapaOuvido = id;
    if (!remoto || !id) return;
    assinatura = colJuntas(id).onSnapshot(function (snap) {
      if (snap.metadata.hasPendingWrites) return;      /* eco da minha própria gravação */
      var mudou = snap.docChanges().some(function (c) { return c.type !== 'added' || !snap.metadata.fromCache; });
      if (!mudou) return;
      ouvintes.forEach(function (fn) { try { fn(id); } catch (e) { console.error(e); } });
    }, function (e) {
      console.warn('Assinatura do mapa encerrada:', e && e.code);
      assinatura = null;
    });
  }

  /* ---------------- ligação ---------------- */
  /** Versão online: Supabase. Tem prioridade sobre os demais backends. */
  function conectarSupabase() {
    if (!SUP || !SUP.url || !SUP.chave) return false;
    if (!global.supabase || typeof global.supabase.createClient !== 'function') {
      console.warn('Biblioteca do Supabase não carregou; seguindo em modo local.');
      return false;
    }
    try {
      sb = global.supabase.createClient(SUP.url, SUP.chave);
      return true;
    } catch (e) {
      console.warn('Não foi possível conectar ao Supabase:', e);
      sb = null;
      return false;
    }
  }

  async function conectar() {
    if (conectarSupabase()) return true;
    if (!global.claude || typeof global.claude.use !== 'function') return false;
    try {
      /* sem banco, use() só devolve null depois de 10 s — tempo demais
         com a tela parada em "Carregando…". Segue local e desiste antes. */
      var db = await Promise.race([
        global.claude.use('db'),
        new Promise(function (r) { setTimeout(function () { r(null); }, 4000); })
      ]);
      if (!db) return false;
      remoto = db;
      return true;
    } catch (e) {
      console.warn('Banco compartilhado indisponível:', e);
      return false;
    }
  }

  function compartilhado() { return !!(sb || remoto); }

  /* ============================================================
     BACKEND SUPABASE  (versão online, hospedada na Vercel)

     Uma LINHA por junta: dois inspetores lançando ensaios em juntas
     diferentes nunca colidem, e só a junta alterada sobe para o
     servidor. As alterações dos colegas chegam pelo realtime.

       mj_mapas   um registro por mapa/contrato
       mj_dados   config, soldadores, overrides, logotipo, assinaturas
       mj_juntas  uma linha por junta
     ============================================================ */
  var SUP = global.MAPA_JUNTAS_SUPABASE || null;   /* {url, chave} — definido na página online */
  var sb = null;
  var canal = null;
  var baseSb = {};                                 /* mapaId -> { juntaId: json } última visão do servidor */

  function linhaJunta(j, ord) { return JSON.stringify({ ord: ord, dados: j }); }

  async function sbGetIndice() {
    var r = await sb.from('mj_mapas').select('*').order('em', { ascending: false });
    if (r.error) throw new Error(r.error.message);
    var lista = (r.data || []).map(function (m) {
      return {
        id: m.id, nome: m.nome || 'Mapa sem nome', contrato: m.contrato || '',
        cliente: m.cliente || '', juntas: m.total_juntas || 0, pd: Number(m.pd) || 0,
        em: m.em || '', nomeManual: !!m.nome_manual
      };
    });
    var atual = null;
    try { atual = localStorage.getItem(CHAVE_ATUAL); } catch (e) { atual = null; }
    if (!lista.some(function (m) { return m.id === atual; })) atual = lista.length ? lista[0].id : null;
    return { atual: atual, lista: lista };
  }

  async function sbGetEstado(id) {
    var res = await Promise.all([
      sb.from('mj_mapas').select('em').eq('id', id).maybeSingle(),
      sb.from('mj_dados').select('chave,valor').eq('mapa_id', id),
      sb.from('mj_juntas').select('id,ord,dados').eq('mapa_id', id).order('ord')
    ]);
    for (var i = 0; i < res.length; i++) if (res[i].error) throw new Error(res[i].error.message);
    if (!res[0].data && !(res[1].data || []).length && !(res[2].data || []).length) return undefined;

    var d = {};
    (res[1].data || []).forEach(function (r) { d[r.chave] = r.valor; });

    var juntas = (res[2].data || []).map(function (r) { return r.dados; });

    var estado = {
      versao: 2,
      config: d.config || {},
      soldadores: (d.soldadores && d.soldadores.lista) || [],
      overrides: d.overrides || {},
      juntas: juntas,
      atualizadoEm: res[0].data ? res[0].data.em : null
    };
    if (!estado.config.assinaturas) estado.config.assinaturas = {};
    IMAGENS.forEach(function (im) {
      var v = d[im.doc];
      if (v && v.v) im.pousa(estado, v.v);
    });

    var mapa = {};
    (res[2].data || []).forEach(function (r) { mapa[r.id] = linhaJunta(r.dados, r.ord); });
    baseSb[id] = mapa;
    return estado;
  }

  async function sbPutEstado(id, estado) {
    /* garante o registro do mapa antes das chaves estrangeiras */
    var e1 = await sb.from('mj_mapas').upsert({
      id: id,
      contrato: (estado.config.projeto || {}).contrato || '',
      cliente: (estado.config.projeto || {}).cliente || '',
      total_juntas: (estado.juntas || []).length,
      em: estado.atualizadoEm || new Date().toISOString()
    }, { onConflict: 'id' });
    if (e1.error) throw new Error(e1.error.message);

    /* --- config e afins, só o que mudou --- */
    var pares = [
      ['config', configLeve(estado.config)],
      ['soldadores', { lista: estado.soldadores || [] }],
      ['overrides', estado.overrides || {}]
    ];
    IMAGENS.forEach(function (im) {
      var v = '';
      try { v = im.pega(estado) || ''; } catch (e) { v = ''; }
      pares.push([im.doc, { v: v }]);
    });

    var mudados = [];
    pares.forEach(function (p) {
      var ck = id + '/' + p[0], json = JSON.stringify(p[1]);
      if (cacheDocs[ck] === json) return;
      cacheDocs[ck] = json;
      mudados.push({ mapa_id: id, chave: p[0], valor: p[1] });
    });
    if (mudados.length) {
      var e2 = await sb.from('mj_dados').upsert(mudados, { onConflict: 'mapa_id,chave' });
      if (e2.error) throw new Error(e2.error.message);
    }

    /* --- juntas: sobe só o que mudou, apaga o que sumiu --- */
    var anterior = baseSb[id] || {};
    var agora = {}, subir = [];
    (estado.juntas || []).forEach(function (j, ord) {
      if (!j._id) return;
      var json = linhaJunta(j, ord);
      agora[j._id] = json;
      if (anterior[j._id] !== json) {
        subir.push({ mapa_id: id, id: j._id, ord: ord, dados: j, atualizado_em: new Date().toISOString() });
      }
    });

    /* lotes: uma importação de Excel traz milhares de linhas de uma vez */
    for (var i = 0; i < subir.length; i += 500) {
      var e3 = await sb.from('mj_juntas').upsert(subir.slice(i, i + 500), { onConflict: 'mapa_id,id' });
      if (e3.error) throw new Error(e3.error.message);
    }

    var sumiram = Object.keys(anterior).filter(function (k) { return !(k in agora); });
    for (var k = 0; k < sumiram.length; k += 500) {
      var e4 = await sb.from('mj_juntas').delete().eq('mapa_id', id).in('id', sumiram.slice(k, k + 500));
      if (e4.error) throw new Error(e4.error.message);
    }

    baseSb[id] = agora;
  }

  async function sbPutIndice(v) {
    try { if (v && v.atual) localStorage.setItem(CHAVE_ATUAL, v.atual); } catch (e) { /* ignora */ }
    var lista = (v && v.lista) || [];
    var subir = [];
    lista.forEach(function (m) {
      var corpo = {
        nome: m.nome || '', contrato: m.contrato || '', cliente: m.cliente || '',
        nome_manual: !!m.nomeManual, total_juntas: m.juntas || 0, pd: m.pd || 0
      };
      var ck = m.id + '/__meta', json = JSON.stringify(corpo);
      if (cacheDocs[ck] === json) return;              /* só o carimbo de hora mudou */
      cacheDocs[ck] = json;
      subir.push(Object.assign({ id: m.id, em: m.em || new Date().toISOString() }, corpo));
    });
    if (!subir.length) return;
    var r = await sb.from('mj_mapas').upsert(subir, { onConflict: 'id' });
    if (r.error) throw new Error(r.error.message);
  }

  async function sbDel(id) {
    var r = await sb.from('mj_mapas').delete().eq('id', id);   /* cascata apaga dados e juntas */
    if (r.error) throw new Error(r.error.message);
    delete baseSb[id];
  }

  function sbEscutar(id) {
    if (canal) { try { sb.removeChannel(canal); } catch (e) { /* ignora */ } canal = null; }
    if (!sb || !id) return;
    canal = sb.channel('mj-' + id)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'mj_juntas', filter: 'mapa_id=eq.' + id },
        function () {
          ouvintes.forEach(function (fn) { try { fn(id); } catch (e) { console.error(e); } });
        })
      .subscribe();
  }

  /* ---------------- interface única ---------------- */
  function get(store, chave) {
    if (sb && store === ST_ESTADO) {
      return chave === '__indice' ? sbGetIndice() : sbGetEstado(chave);
    }
    if (remoto && store === ST_ESTADO) {
      return chave === '__indice' ? remotoGetIndice() : remotoGetEstado(chave);
    }
    return localGet(store, chave);
  }
  function put(store, chave, valor) {
    if (sb && store === ST_ESTADO) {
      return chave === '__indice' ? sbPutIndice(valor) : sbPutEstado(chave, valor);
    }
    if (remoto && store === ST_ESTADO) {
      return chave === '__indice' ? remotoPutIndice(valor) : remotoPutEstado(chave, valor);
    }
    return localPut(store, chave, valor);
  }
  function del(store, chave) {
    if (sb && store === ST_ESTADO) {
      return chave === '__indice' ? Promise.resolve() : sbDel(chave);
    }
    if (remoto && store === ST_ESTADO) {
      return chave === '__indice' ? Promise.resolve() : remotoDel(chave);
    }
    return localDel(store, chave);
  }
  function chaves(store) { return localChaves(store); }
  function todos(store) { return localTodos(store); }
  function limpar(store) {
    if (sb && store === ST_ESTADO) {
      return sb.from('mj_mapas').select('id').then(function (r) {
        return Promise.all((r.data || []).map(function (m) { return sbDel(m.id); }));
      });
    }
    if (remoto && store === ST_ESTADO) {
      return remoto.collection(COL).get().then(function (snap) {
        return Promise.all(snap.docs.map(function (d) { return remotoDel(d.id); }));
      });
    }
    return localLimpar(store);
  }

  /** Espaço aproximado usado/disponível, quando o navegador informa. */
  async function espaco() {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    try {
      var e = await navigator.storage.estimate();
      return { usado: e.usado || e.usage || 0, cota: e.quota || 0 };
    } catch (err) { return null; }
  }

  global.DB = {
    ST_ESTADO: ST_ESTADO, ST_MODELOS: ST_MODELOS,
    abrir: abrir, get: get, put: put, del: del,
    chaves: chaves, todos: todos, limpar: limpar, espaco: espaco,
    conectar: conectar, compartilhado: compartilhado,
    escutar: escutar,
    aoMudarRemoto: function (fn) { ouvintes.push(fn); }
  };
})(window);

<script>
/* ============================================================
   lib-zip.js — Leitor/gravador ZIP mínimo (sem dependências)
   Usa CompressionStream/DecompressionStream nativos do browser.
   Suficiente para ler e escrever arquivos .xlsx (OOXML).
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- CRC32 ---------- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* ---------- helpers ---------- */
  var TE = new TextEncoder();
  var TD = new TextDecoder('utf-8');

  function strToU8(s) { return TE.encode(s); }
  function u8ToStr(u) { return TD.decode(u); }

  function concat(chunks) {
    var total = 0, i;
    for (i = 0; i < chunks.length; i++) total += chunks[i].length;
    var out = new Uint8Array(total), off = 0;
    for (i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
    return out;
  }

  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('Seu navegador não suporta DecompressionStream. Use Chrome, Edge ou Firefox atualizados.');
    }
    var ds = new DecompressionStream('deflate-raw');
    var stream = new Blob([u8]).stream().pipeThrough(ds);
    var buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  async function deflateRaw(u8) {
    if (typeof CompressionStream === 'undefined') return null;
    var cs = new CompressionStream('deflate-raw');
    var stream = new Blob([u8]).stream().pipeThrough(cs);
    var buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  /* ---------- LEITURA ---------- */
  /**
   * Lê um ZIP e devolve { nome: Uint8Array }
   */
  async function unzip(arrayBuffer) {
    var u8 = new Uint8Array(arrayBuffer);
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    // localizar End Of Central Directory
    var eocd = -1;
    var minPos = Math.max(0, u8.length - 66000);
    for (var i = u8.length - 22; i >= minPos; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo não é um ZIP/XLSX válido.');

    var count = dv.getUint16(eocd + 10, true);
    var cdOffset = dv.getUint32(eocd + 16, true);

    var out = {};
    var p = cdOffset;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var compSize = dv.getUint32(p + 20, true);
      var uncompSize = dv.getUint32(p + 24, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var localOff = dv.getUint32(p + 42, true);
      var name = u8ToStr(u8.subarray(p + 46, p + 46 + nameLen));

      // header local para descobrir o início real dos dados
      var lNameLen = dv.getUint16(localOff + 26, true);
      var lExtraLen = dv.getUint16(localOff + 28, true);
      var dataStart = localOff + 30 + lNameLen + lExtraLen;
      var raw = u8.subarray(dataStart, dataStart + compSize);

      if (method === 0) {
        out[name] = raw.slice();
      } else if (method === 8) {
        out[name] = await inflateRaw(raw);
      } else {
        throw new Error('Método de compressão não suportado (' + method + ') em ' + name);
      }
      if (uncompSize && out[name].length !== uncompSize) {
        // tolerado — alguns geradores usam data descriptor
      }
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }

  /* ---------- ESCRITA ---------- */
  /**
   * Grava um ZIP a partir de { nome: Uint8Array | string }
   */
  async function zip(files) {
    var names = Object.keys(files);
    var locals = [], centrals = [];
    var offset = 0;

    // data/hora DOS fixas (evita divergência de fuso)
    var dosTime = 0, dosDate = ((2020 - 1980) << 9) | (1 << 5) | 1;

    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var data = files[name];
      if (typeof data === 'string') data = strToU8(data);

      var crc = crc32(data);
      var comp = await deflateRaw(data);
      var method = 8;
      if (!comp || comp.length >= data.length) { comp = data; method = 0; }

      var nameU8 = strToU8(name);

      var lh = new Uint8Array(30 + nameU8.length);
      var ldv = new DataView(lh.buffer);
      ldv.setUint32(0, 0x04034b50, true);
      ldv.setUint16(4, 20, true);
      ldv.setUint16(6, 0x0800, true);            // UTF-8 filename
      ldv.setUint16(8, method, true);
      ldv.setUint16(10, dosTime, true);
      ldv.setUint16(12, dosDate, true);
      ldv.setUint32(14, crc, true);
      ldv.setUint32(18, comp.length, true);
      ldv.setUint32(22, data.length, true);
      ldv.setUint16(26, nameU8.length, true);
      ldv.setUint16(28, 0, true);
      lh.set(nameU8, 30);

      locals.push(lh, comp);

      var ch = new Uint8Array(46 + nameU8.length);
      var cdv = new DataView(ch.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true);
      cdv.setUint16(10, method, true);
      cdv.setUint16(12, dosTime, true);
      cdv.setUint16(14, dosDate, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, comp.length, true);
      cdv.setUint32(24, data.length, true);
      cdv.setUint16(28, nameU8.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      ch.set(nameU8, 46);
      centrals.push(ch);

      offset += lh.length + comp.length;
    }

    var cdStart = offset;
    var cdSize = 0;
    for (var j = 0; j < centrals.length; j++) cdSize += centrals[j].length;

    var eocd = new Uint8Array(22);
    var edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, names.length, true);
    edv.setUint16(10, names.length, true);
    edv.setUint32(12, cdSize, true);
    edv.setUint32(16, cdStart, true);
    edv.setUint16(20, 0, true);

    return new Blob([concat(locals.concat(centrals).concat([eocd]))],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

<script>

   * read()      : abre qualquer .xlsx e devolve as planilhas

  var RELNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  /* ---------------- referencias de celula ---------------- */
  function colToNum(col) {
    var n = 0;

    return n;
  }
  function numToCol(n) {
    var s = '';
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }

  /* ---------------- XML ---------------- */

  function siText(si) {

    for (var i = 0; i < ts.length; i++) {

  /* ---------------- LEITURA ---------------- */
  async function read(arrayBuffer) {
    var files = await MZip.unzip(arrayBuffer);
    function txt(p) { return files[p] ? MZip.u8ToStr(files[p]) : null; }

    var shared = [];
    var ssTxt = txt('xl/sharedStrings.xml');
    if (ssTxt) {
      var sdoc = parseXml(ssTxt);
      var sis = sdoc.documentElement.getElementsByTagNameNS(XMLNS, 'si');
      for (var i = 0; i < sis.length; i++) shared.push(siText(sis[i]));
    }

    var wbTxt = txt('xl/workbook.xml');
    if (!wbTxt) throw new Error('Arquivo nao parece ser um Excel (.xlsx) valido.');
    var wbDoc = parseXml(wbTxt);
    var relDoc = parseXml(txt('xl/_rels/workbook.xml.rels'));
    var relMap = {};
    var rels = relDoc.documentElement.getElementsByTagName('*');
    for (var r = 0; r < rels.length; r++) {
      var id = rels[r].getAttribute('Id');
      if (id) relMap[id] = (rels[r].getAttribute('Target') || '').replace(/^\/?xl\//, '').replace(/^\//, '');

    var sheets = [];
    var sh = wbDoc.getElementsByTagNameNS(XMLNS, 'sheet');
    for (var k = 0; k < sh.length; k++) {
      var rid = sh[k].getAttributeNS(RELNS, 'id') || sh[k].getAttribute('r:id');
      var target = relMap[rid];
      if (!target) continue;
      var path = 'xl/' + target;
      var wsTxt = txt(path);
      if (!wsTxt) continue;
      var wdoc = parseXml(wsTxt);

      var cs = wdoc.getElementsByTagNameNS(XMLNS, 'c');

  /* ---------------- TEMPLATE WRITER ---------------- */
  function Template(files) {

  Template.prototype.sheetPathByName = function (name) {
    var wb = this._doc('xl/workbook.xml');
    var relDoc = this._doc('xl/_rels/workbook.xml.rels');
    var relMap = {}, rels = relDoc.documentElement.getElementsByTagName('*');
    for (var r = 0; r < rels.length; r++) {
      var id = rels[r].getAttribute('Id');
      if (id) relMap[id] = (rels[r].getAttribute('Target') || '').replace(/^\/?xl\//, '').replace(/^\//, '');
    }
    var sh = wb.getElementsByTagNameNS(XMLNS, 'sheet');
    for (var k = 0; k < sh.length; k++) {
      if (!name || sh[k].getAttribute('name') === name) {
        var rid = sh[k].getAttributeNS(RELNS, 'id') || sh[k].getAttribute('r:id');
        if (relMap[rid]) return 'xl/' + relMap[rid];

    return null;
  };
  Template.prototype.firstSheetPath = function () { return this.sheetPathByName(null); };
  Template.prototype.sheetNames = function () {
    var wb = this._doc('xl/workbook.xml');
    var sh = wb.getElementsByTagNameNS(XMLNS, 'sheet'), out = [];
    for (var k = 0; k < sh.length; k++) out.push(sh[k].getAttribute('name'));
    return out;
  };

  function getSheetData(doc) {
    var sd = doc.getElementsByTagNameNS(XMLNS, 'sheetData')[0];
    if (!sd) { sd = doc.createElementNS(XMLNS, 'sheetData'); doc.documentElement.appendChild(sd); }
    return sd;
  }

  function findOrCreateRow(doc, sd, rowNum) {
    var rows = sd.getElementsByTagNameNS(XMLNS, 'row');
    var before = null;
    for (var i = 0; i < rows.length; i++) {
      var rn = parseInt(rows[i].getAttribute('r'), 10);
      if (rn === rowNum) return rows[i];
      if (rn > rowNum) { before = rows[i]; break; }
    }
    var row = doc.createElementNS(XMLNS, 'row');
    row.setAttribute('r', String(rowNum));
    sd.insertBefore(row, before);
    return row;
  }

  function findOrCreateCell(doc, row, cref) {
    var target = parseRef(cref);
    var cs = row.getElementsByTagNameNS(XMLNS, 'c');
    var before = null;
    for (var i = 0; i < cs.length; i++) {
      var cr = cs[i].getAttribute('r');
      if (cr === cref) return cs[i];
      var p = parseRef(cr);
      if (p && target && p.col > target.col) { before = cs[i]; break; }
    }
    var c = doc.createElementNS(XMLNS, 'c');
    c.setAttribute('r', cref);
    row.insertBefore(c, before);
    return c;

  function writeValue(doc, cell, value) {
    while (cell.firstChild) cell.removeChild(cell.firstChild);
    cell.removeAttribute('t');
    if (value === null || value === undefined || value === '') return;
    if (typeof value === 'number' && isFinite(value)) {
      var v = doc.createElementNS(XMLNS, 'v');
      v.textContent = String(value);
      cell.appendChild(v);
      return;
    }
    cell.setAttribute('t', 'inlineStr');
    var is = doc.createElementNS(XMLNS, 'is');
    var t = doc.createElementNS(XMLNS, 't');
    t.setAttribute('xml:space', 'preserve');
    t.textContent = String(value);
    is.appendChild(t);
    cell.appendChild(is);
  }

  Template.prototype.set = function (sheetPath, cref, value, styleIdx) {
    var pr = parseRef(cref);
    if (!pr) return;
    var doc = this._doc(sheetPath);
    var sd = getSheetData(doc);
    var row = findOrCreateRow(doc, sd, pr.row);
    var cell = findOrCreateCell(doc, row, cref);
    if (styleIdx !== undefined && styleIdx !== null) cell.setAttribute('s', String(styleIdx));

  Template.prototype.setMany = function (sheetPath, map) {
    for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) this.set(sheetPath, k, map[k]);
  };

    var rows = sd.getElementsByTagNameNS(XMLNS, 'row');
    for (var i = 0; i < rows.length; i++) {

      for (var j = 0; j < cs.length; j++) {

    for (var i = 0; i < rows.length; i++) {
      if (parseInt(rows[i].getAttribute('r'), 10) >= startRow) sd.removeChild(rows[i]);

    for (var i = 0; i < dns.length; i++) {

  /** Remove definedNames de visualizacoes pessoais que travam a area de impressao. */

    var wb = this._doc('xl/workbook.xml');
    var dns = Array.prototype.slice.call(wb.getElementsByTagNameNS(XMLNS, 'definedName'));
    for (var i = 0; i < dns.length; i++) {
      var nm = dns[i].getAttribute('name') || '';

  /**

   * Devolve o indice em cellXfs.

  Template.prototype.dataStyle = function () {
    if (this._dataStyle !== null) return this._dataStyle;
    var doc = this._doc('xl/styles.xml');
    var root = doc.documentElement;
    function section(tag) { return root.getElementsByTagNameNS(XMLNS, tag)[0]; }

    var fonts = section('fonts');
    var font = doc.createElementNS(XMLNS, 'font');
    var sz = doc.createElementNS(XMLNS, 'sz'); sz.setAttribute('val', '9'); font.appendChild(sz);
    var nm = doc.createElementNS(XMLNS, 'name'); nm.setAttribute('val', 'Calibri'); font.appendChild(nm);
    fonts.appendChild(font);
    var fontId = fonts.getElementsByTagNameNS(XMLNS, 'font').length - 1;
    fonts.setAttribute('count', String(fontId + 1));

    var borders = section('borders');
    var border = doc.createElementNS(XMLNS, 'border');

      border.appendChild(e);

    borders.setAttribute('count', String(borderId + 1));

    var xf = doc.createElementNS(XMLNS, 'xf');
    xf.setAttribute('numFmtId', '0');

    xf.setAttribute('fillId', '0');
    xf.setAttribute('borderId', String(borderId));
    xf.setAttribute('xfId', '0');
    xf.setAttribute('applyFont', '1');
    xf.setAttribute('applyBorder', '1');
    xf.setAttribute('applyAlignment', '1');
    var al = doc.createElementNS(XMLNS, 'alignment');
    al.setAttribute('horizontal', 'center');
    al.setAttribute('vertical', 'center');

       cabecalho     : function(docFragmento) — edita as linhas do cabeçalho

  Template.prototype.bulkSheet = function (path, opts) {
    if (!this.files[path]) throw new Error('Planilha não encontrada: ' + path);
    if (this._docs[path]) delete this._docs[path];      // evita reserialização pelo build()

    var txt = MZip.u8ToStr(this.files[path]);

    var abre = txt.indexOf('<sheetData>');
    var vazio = txt.indexOf('<sheetData/>');
    var prologo, miolo, epilogo;

    if (abre >= 0) {
      var fecha = txt.indexOf('</sheetData>', abre);
      prologo = txt.slice(0, abre + '<sheetData>'.length);
      miolo = txt.slice(abre + '<sheetData>'.length, fecha);
      epilogo = txt.slice(fecha);
    } else if (vazio >= 0) {
      prologo = txt.slice(0, vazio) + '<sheetData>';
      miolo = '';
      epilogo = '</sheetData>' + txt.slice(vazio + '<sheetData/>'.length);
    } else {
      throw new Error('Estrutura de planilha inesperada em ' + path);
    }

    /* mantém apenas as linhas anteriores à área de dados */
    var corte = miolo.search(new RegExp('<row[^>]*\\sr="' + opts.primeiraLinha + '"'));
    var cabecalhoXml = corte >= 0 ? miolo.slice(0, corte) : miolo;

    if (opts.cabecalho) {
      /* o fragmento precisa herdar os prefixos declarados em <worksheet> */
      var raiz = /<worksheet[^>]*>/.exec(prologo);
      var decls = raiz ? (raiz[0].match(/xmlns(:[\w.-]+)?="[^"]*"/g) || []) : [];
      if (!decls.some(function (d) { return d.indexOf('xmlns=') === 0; })) decls.push('xmlns="' + XMLNS + '"');
      var frag = parseXml('<sheetData ' + decls.join(' ') + '>' + cabecalhoXml + '</sheetData>');
      opts.cabecalho({
        doc: frag,
        set: function (cref, valor, estilo) {
          var pr = parseRef(cref);
          if (!pr) return;
          var linha = findOrCreateRow(frag, frag.documentElement, pr.row);
          var cel = findOrCreateCell(frag, linha, cref);
          if (estilo !== undefined && estilo !== null) cel.setAttribute('s', String(estilo));
          writeValue(frag, cel, valor);
        },
        estiloDe: function (cref) {
          var cs = frag.getElementsByTagNameNS(XMLNS, 'c');
          for (var i = 0; i < cs.length; i++) if (cs[i].getAttribute('r') === cref) return cs[i].getAttribute('s');
          return null;
        }
      });
      var serial = new XMLSerializer().serializeToString(frag.documentElement);
      cabecalhoXml = serial.replace(/^<sheetData[^>]*>/, '').replace(/<\/sheetData>$/, '');
