  /** Monta o XML de uma célula. */
  function celulaXml(cref, valor, estilo) {
    var s = (estilo === undefined || estilo === null) ? '' : ' s="' + estilo + '"';
    if (valor === null || valor === undefined || valor === '') return '<c r="' + cref + '"' + s + '/>';
    if (typeof valor === 'number' && isFinite(valor)) return '<c r="' + cref + '"' + s + '><v>' + valor + '</v></c>';
    return '<c r="' + cref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + esc(valor) + '</t></is></c>';
  }

  /** Estilo de data (dd/mm/aaaa) centralizado com borda fina. */
  Template.prototype.dateStyle = function () {
    if (this._dateStyle !== undefined && this._dateStyle !== null) return this._dateStyle;
    var base = this.dataStyle();
    var doc = this._doc('xl/styles.xml');
    var root = doc.documentElement;
    var xfs = root.getElementsByTagNameNS(XMLNS, 'cellXfs')[0];
    var lista = xfs.getElementsByTagNameNS(XMLNS, 'xf');
    var modelo = lista[base];
    var xf = modelo.cloneNode(true);
    xf.setAttribute('numFmtId', '14');            // dd/mm/yyyy (formato interno)
    xf.setAttribute('applyNumberFormat', '1');
    xfs.appendChild(xf);
    var id = xfs.getElementsByTagNameNS(XMLNS, 'xf').length - 1;
    xfs.setAttribute('count', String(id + 1));
    this._dateStyle = id;
    return id;
  };

  /** Remove uma parte do pacote e as referências a ela. */
  Template.prototype.removePart = function (path) {
    if (!this.files[path]) return;
    delete this.files[path];
    delete this._docs[path];
    try {
      var ct = this._doc('[Content_Types].xml');
      var ovs = Array.prototype.slice.call(ct.documentElement.getElementsByTagName('Override'));
      ovs.forEach(function (o) {
        if (o.getAttribute('PartName') === '/' + path) o.parentNode.removeChild(o);
      });
    } catch (e) { /* ignora */ }
    var alvo = path.replace(/^xl\//, '');
    try {
      var rels = this._doc('xl/_rels/workbook.xml.rels');
      var rs = Array.prototype.slice.call(rels.documentElement.getElementsByTagName('*'));
      rs.forEach(function (r) {
        if ((r.getAttribute('Target') || '').replace(/^\/?xl\//, '') === alvo) r.parentNode.removeChild(r);
      });
    } catch (e) { /* ignora */ }
  };

  /**
   * Remove vínculos com outras pastas de trabalho.
   * O mapa de origem referencia um arquivo no SharePoint; como o aplicativo
   * grava valores no lugar das fórmulas, manter o vínculo só faria o Excel
   * pedir "atualizar links" a cada abertura.
   */
  Template.prototype.removerVinculosExternos = function () {
    var self = this;
    var partes = Object.keys(this.files).filter(function (p) { return /^xl\/externalLinks\//.test(p); });
    if (!partes.length) return;

    /* ids das relações a excluir */
    var ids = [];
    try {
      var rels = this._doc('xl/_rels/workbook.xml.rels');
      var rs = Array.prototype.slice.call(rels.documentElement.getElementsByTagName('*'));
      rs.forEach(function (r) {
        if (/externalLink/i.test(r.getAttribute('Type') || '')) {
          ids.push(r.getAttribute('Id'));
          r.parentNode.removeChild(r);
        }
      });
    } catch (e) { /* ignora */ }

    try {
      var wb = this._doc('xl/workbook.xml');
      var ext = wb.getElementsByTagNameNS(XMLNS, 'externalReferences')[0];
      if (ext) ext.parentNode.removeChild(ext);
    } catch (e) { /* ignora */ }

    try {
      var ct = this._doc('[Content_Types].xml');
      var ovs = Array.prototype.slice.call(ct.documentElement.getElementsByTagName('Override'));
      ovs.forEach(function (o) {
        var pn = (o.getAttribute('PartName') || '').replace(/^\//, '');
        if (/^xl\/externalLinks\//.test(pn)) o.parentNode.removeChild(o);
      });
    } catch (e) { /* ignora */ }

    partes.forEach(function (p) { delete self.files[p]; delete self._docs[p]; });
    void ids;
  };

  /* ============================================================
     Inserção de imagem flutuante (assinaturas)
     ============================================================ */
  function dataUrlParaBytes(dataUrl) {
    var m = /^data:([^;]+);base64,(.*)$/.exec(String(dataUrl || ''));
    if (!m) return null;
    var bin = atob(m[2]), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var ext = /png/i.test(m[1]) ? 'png' : (/gif/i.test(m[1]) ? 'gif' : 'jpeg');
    return { bytes: u8, ext: ext, mime: m[1] };
  }

  function proximoId(mapa, prefixo, sufixo) {
    var n = 1;
    while (mapa[prefixo + n + sufixo]) n++;
    return n;
  }

  Template.prototype._garantirDefaultCT = function (ext, mime) {
    var ct = this._doc('[Content_Types].xml');
    var defs = ct.documentElement.getElementsByTagName('Default');
    for (var i = 0; i < defs.length; i++) {
      if ((defs[i].getAttribute('Extension') || '').toLowerCase() === ext) return;
    }
    var d = ct.createElementNS(ct.documentElement.namespaceURI, 'Default');
    d.setAttribute('Extension', ext);
    d.setAttribute('ContentType', mime);
    ct.documentElement.insertBefore(d, ct.documentElement.firstChild);
  };

  /** Devolve (criando se preciso) o caminho do desenho ligado à planilha. */
  Template.prototype._desenhoDaPlanilha = function (sheetPath) {
    var relPath = sheetPath.replace(/worksheets\/([^/]+)$/, 'worksheets/_rels/$1.rels');

    if (this.files[relPath]) {
      var rels = this._doc(relPath);
      var rs = rels.documentElement.getElementsByTagName('*');
      for (var i = 0; i < rs.length; i++) {
        if (/\/drawing$/.test(rs[i].getAttribute('Type') || '')) {
          var alvo = (rs[i].getAttribute('Target') || '').replace(/^\.\.\//, '');
          return 'xl/' + alvo.replace(/^\/?xl\//, '');
        }
      }
    }

    /* nenhum desenho: cria um e liga à planilha */
    var n = proximoId(this.files, 'xl/drawings/drawing', '.xml');
    var dPath = 'xl/drawings/drawing' + n + '.xml';
    this.files[dPath] = MZip.strToU8(DECL +
      '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"></xdr:wsDr>');

    var relXml = this.files[relPath]
      ? MZip.u8ToStr(this.files[relPath])
      : DECL + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    var novoId = 'rIdImg' + n;
    relXml = relXml.replace('</Relationships>',
      '<Relationship Id="' + novoId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing"' +
      ' Target="../drawings/drawing' + n + '.xml"/></Relationships>');
    this.files[relPath] = MZip.strToU8(relXml);
    delete this._docs[relPath];

    /* referência <drawing/> no fim da planilha */
    var txt = MZip.u8ToStr(this.files[sheetPath]);
    if (txt.indexOf('<drawing ') < 0) {
      txt = txt.replace(/<\/worksheet>\s*$/,
        '<drawing xmlns:r="' + RELNS + '" r:id="' + novoId + '"/></worksheet>');
      this.files[sheetPath] = MZip.strToU8(txt);
      delete this._docs[sheetPath];
    }

    var ctd = this._doc('[Content_Types].xml');
    var ov = ctd.createElementNS(ctd.documentElement.namespaceURI, 'Override');
    ov.setAttribute('PartName', '/' + dPath);
    ov.setAttribute('ContentType', 'application/vnd.openxmlformats-officedocument.drawing+xml');
    ctd.documentElement.appendChild(ov);

    return dPath;
  };

  /**
   * Insere uma imagem ancorada a um intervalo de células.
   * ancora = { col, linha, colFim, linhaFim }  — índices base 1, como no Excel.
   */
  Template.prototype.inserirImagem = function (sheetPath, dataUrl, ancora, nome) {
    var img = dataUrlParaBytes(dataUrl);
    if (!img) return false;

    this._garantirDefaultCT(img.ext, 'image/' + (img.ext === 'jpeg' ? 'jpeg' : img.ext));

    var n = proximoId(this.files, 'xl/media/assinatura', '.' + img.ext);
    var media = 'xl/media/assinatura' + n + '.' + img.ext;
    this.files[media] = img.bytes;

    var dPath = this._desenhoDaPlanilha(sheetPath);
    var dRelPath = dPath.replace(/drawings\/([^/]+)$/, 'drawings/_rels/$1.rels');

    var relXml = this.files[dRelPath]
      ? MZip.u8ToStr(this.files[dRelPath])
      : DECL + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    var rid = 'rIdAss' + n;
    relXml = relXml.replace('</Relationships>',
      '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image"' +
      ' Target="../media/' + media.split('/').pop() + '"/></Relationships>');
    this.files[dRelPath] = MZip.strToU8(relXml);
    delete this._docs[dRelPath];

    var id = 5000 + n;
    var anchor =
      '<xdr:twoCellAnchor editAs="oneCell">' +
      '<xdr:from><xdr:col>' + (ancora.col - 1) + '</xdr:col><xdr:colOff>19050</xdr:colOff>' +
      '<xdr:row>' + (ancora.linha - 1) + '</xdr:row><xdr:rowOff>9525</xdr:rowOff></xdr:from>' +
      /* offsets do canto final ficam em zero: o Excel rejeita valores negativos aqui */
      '<xdr:to><xdr:col>' + ancora.colFim + '</xdr:col><xdr:colOff>0</xdr:colOff>' +
      '<xdr:row>' + ancora.linhaFim + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>' +
      '<xdr:pic>' +
      '<xdr:nvPicPr><xdr:cNvPr id="' + id + '" name="' + esc(nome || ('Assinatura ' + n)) + '"/>' +
      '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
      '<xdr:blipFill><a:blip xmlns:r="' + RELNS + '" r:embed="' + rid + '"/>' +
      '<a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
      '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>' +
      '</xdr:pic><xdr:clientData/></xdr:twoCellAnchor>';

    var dTxt = MZip.u8ToStr(this.files[dPath]);
    dTxt = dTxt.replace(/<\/xdr:wsDr>\s*$/, anchor + '</xdr:wsDr>');
    this.files[dPath] = MZip.strToU8(dTxt);
    delete this._docs[dPath];
    return true;
  };

  /** Converte 'aaaa-mm-dd' no número de série do Excel (sistema 1900). */
  function serialData(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if (!m) return null;
    var ms = Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30);
    var n = Math.round(ms / 86400000);
    return (n > 0 && n < 200000) ? n : null;
  }

  Template.prototype.build = async function () {
    for (var p in this._docs) {
      if (Object.prototype.hasOwnProperty.call(this._docs, p)) {
        this.files[p] = MZip.strToU8(serialize(this._docs[p]));
      }
    }
    return MZip.zip(this.files);
  };

  /* ---------------- GERADOR SIMPLES (sem modelo) ---------------- */
  var STY = { plain: 0, title: 1, head: 2, cell: 3, label: 4, sub: 5, tint: 6 };

  function buildSimple(sheetName, grid, opts) {
    opts = opts || {};
    var colWidths = opts.colWidths || [];
    var merges = opts.merges || [];
    var freeze = opts.freeze || 0;
    var landscape = opts.landscape !== false;

    var rowsXml = '';
    for (var r = 0; r < grid.length; r++) {
      var row = grid[r] || [];
      var cellsXml = '';
      for (var c = 0; c < row.length; c++) {
        var cell = row[c];
        if (cell === null || cell === undefined) continue;
        var v = (typeof cell === 'object') ? cell.v : cell;
        var s = (typeof cell === 'object' && cell.s) ? STY[cell.s] : STY.cell;
        var cr = numToCol(c + 1) + (r + 1);
        if (v === null || v === undefined || v === '') {
          cellsXml += '<c r="' + cr + '" s="' + s + '"/>';
        } else if (typeof v === 'number' && isFinite(v)) {
          cellsXml += '<c r="' + cr + '" s="' + s + '"><v>' + v + '</v></c>';
        } else {
          cellsXml += '<c r="' + cr + '" s="' + s + '" t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
        }
      }
      rowsXml += '<row r="' + (r + 1) + '">' + cellsXml + '</row>';
    }

    var colsXml = '';
    if (colWidths.length) {
      colsXml = '<cols>';
      for (var i = 0; i < colWidths.length; i++) {
        colsXml += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + colWidths[i] + '" customWidth="1"/>';
      }
      colsXml += '</cols>';
    }

    var mergeXml = merges.length
      ? '<mergeCells count="' + merges.length + '">' + merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join('') + '</mergeCells>'
      : '';

    var paneXml = freeze
      ? '<sheetView workbookViewId="0"><pane ySplit="' + freeze + '" topLeftCell="A' + (freeze + 1) + '" activePane="bottomLeft" state="frozen"/></sheetView>'
      : '<sheetView workbookViewId="0"/>';

    var sheetXml = DECL +
      '<worksheet xmlns="' + XMLNS + '"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews>' + paneXml + '</sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' + colsXml +
      '<sheetData>' + rowsXml + '</sheetData>' + mergeXml +
      '<pageMargins left="0.25" right="0.25" top="0.4" bottom="0.4" header="0.2" footer="0.2"/>' +
      '<pageSetup orientation="' + (landscape ? 'landscape' : 'portrait') + '" paperSize="9" fitToWidth="1" fitToHeight="0"/>' +
      '</worksheet>';

    function bd() {
      return '<border><left style="thin"><color indexed="64"/></left><right style="thin"><color indexed="64"/></right>' +
        '<top style="thin"><color indexed="64"/></top><bottom style="thin"><color indexed="64"/></bottom><diagonal/></border>';
    }

    var stylesXml = DECL +
      '<styleSheet xmlns="' + XMLNS + '">' +
      '<fonts count="5">' +
      '<font><sz val="10"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="14"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="9"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
      '<font><sz val="9"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="10"/><name val="Calibri"/></font>' +
      '</fonts>' +
      '<fills count="5">' +
      '<fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFD9E2F3"/><bgColor indexed="64"/></patternFill></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/><bgColor indexed="64"/></patternFill></fill>' +
      '</fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' + bd() + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="7">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="4" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="3" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';

    var files = {
      '[Content_Types].xml': DECL +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>',
      '_rels/.rels': DECL +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>',
      'xl/workbook.xml': DECL +
        '<workbook xmlns="' + XMLNS + '" xmlns:r="' + RELNS + '">' +
        '<sheets><sheet name="' + esc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>',
      'xl/_rels/workbook.xml.rels': DECL +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>',
      'xl/worksheets/sheet1.xml': sheetXml,
      'xl/styles.xml': stylesXml
    };
    return MZip.zip(files);
  }

  global.XL = {
    read: read, Template: Template, buildSimple: buildSimple,
    colToNum: colToNum, numToCol: numToCol, parseRef: parseRef, ref: makeRef,
    serialData: serialData, celulaXml: celulaXml, esc: esc
  };
})(window);

    { id: 'US', nome: 'Ultrassom', data: 'dataUS', rel: 'relUS' },
    { id: 'DM', nome: 'DM / END pré-fabricação', data: 'dataDM', rel: null },
    { id: 'PMI', nome: 'PMI', data: 'dataPMI', rel: 'relPMI' },
    { id: 'TH', nome: 'Teste hidrostático', data: 'dataTH', rel: 'relTH' },
    { id: 'JAT', nome: 'Jateamento', data: 'dataJato', rel: null },
    { id: 'FUN', nome: 'Fundo (pintura)', data: 'dataFundo', rel: null }
  ];
  var ENSAIOMAP = {};
  ENSAIOS.forEach(function (e) { ENSAIOMAP[e.id] = e; });

  function normalizar(s) {
    return String(s === null || s === undefined ? '' : s)
      .normalize('NFD').replace(new RegExp('[̀-ͯ]', 'g'), '')
      .toUpperCase().replace(/\s+/g, ' ').trim();
  }

  var cacheClasse = {};
  function classeInspecao(txt) {
    var chave = String(txt || '');
    if (cacheClasse[chave]) return cacheClasse[chave];

    var req = {};
    normalizar(chave).split(/[\/;,+]/).forEach(function (bruto) {
      var t = bruto.trim();
      if (!t || t === 'N/A' || t === 'NA') return;
      if (/^VA\b/.test(t)) req.VA = true;
      else if (/^VS\b/.test(t) || /VISUAL/.test(t)) req.VS = true;
      else if (/^LP/.test(t) || /PENETRANTE/.test(t)) {
        if (/\bR\b|RAIZ|-R|\.R/.test(t)) req.LPR = true;
        else if (/\bA\b|ACAB|-A|\.A/.test(t)) req.LPA = true;
        else { req.LPR = true; req.LPA = true; }
      }
      else if (/^US\b|ULTRA/.test(t)) req.US = true;
      else if (/^RX\b|^RT\b|RADIOG/.test(t)) req.DM = true;
      else if (/^DM\b/.test(t)) req.DM = true;
      else if (/^PMI\b/.test(t)) req.PMI = true;
      else if (/^TH\b|HIDROST/.test(t)) req.TH = true;
      else if (/^JAT|JATE/.test(t)) req.JAT = true;
      else if (/^FUN/.test(t)) req.FUN = true;
    });
    cacheClasse[chave] = req;
    return req;
  }

  function exigeEnsaio(j, id) { return !!classeInspecao(j.classeInsp)[id]; }

  /* "N/A" e "FALTA" são ASCII: comparação direta evita normalizar()
     centenas de milhares de vezes ao varrer o mapa inteiro. */
  function ehNA(v) {
    if (!v) return false;
    var s = String(v).trim().toUpperCase();
    return s === 'N/A' || s === 'NA' || s === 'N.A.';
  }
  function ehFalta(v) {
    if (!v) return false;
    var s = String(v).trim().toUpperCase();
    return s.indexOf('FALTA') >= 0 || s.indexOf('PENDENTE') >= 0 || s === '-';
  }

  /* Campo de data só vale como executado se contiver uma data real.
     O mapa de origem traz "0", "N/A" e texto livre nessas colunas. */
  var RE_DATA = /^\d{4}-\d{2}-\d{2}$/;
  function ehData(v) {
    return !!v && RE_DATA.test(String(v).trim());
  }

  /**
   * '' | 'na' | 'falta' | 'ok' — situação de um ensaio na junta.
   * Só é 'ok' com a DATA lançada e, quando o ensaio gera relatório,
   * o NÚMERO do relatório também preenchido. Data com "FALTA" no
   * relatório continua pendente.
   */
  function estadoEnsaio(j, id) {
    var e = ENSAIOMAP[id];
    if (!e) return '';
    if (!exigeEnsaio(j, id)) return 'na';

    var data = j[e.data];
    var rel = e.rel ? j[e.rel] : '';

    if (ehNA(data) || (e.rel && ehNA(rel))) return 'na';
    if (!ehData(data)) return 'falta';          // vazio, "0" ou texto livre
    if (e.rel) {
      if (!rel || !String(rel).trim()) return 'falta';
      if (ehFalta(rel)) return 'falta';
    }
    return 'ok';
  }

  /**
   * Etapa executada, independente da classe de inspeção: precisa de
   * data válida e, quando a etapa gera relatório, do número dele.
   * Usada nos cards de avanço por etapa (pintura e TH, por exemplo,
   * não aparecem na classe de inspeção).
   */
  function executado(j, id) {
    var e = ENSAIOMAP[id];
    if (!e) return false;
    if (!ehData(j[e.data])) return false;
    if (e.rel) {
      var r = j[e.rel];
      if (!r || !String(r).trim() || ehFalta(r)) return false;
    }
    return true;
  }

  /** Ensaios exigidos pela classe de inspeção e ainda não concluídos. */
  function pendencias(j) {
    var out = [];
    for (var i = 0; i < ENSAIOS.length; i++) {
      var e = ENSAIOS[i];
      if (!exigeEnsaio(j, e.id)) continue;
      if (estadoEnsaio(j, e.id) === 'falta') out.push(e);
    }
    return out;
  }

  /** Ensaios que a classe de inspeção da junta exige. */
  function ensaiosExigidos(j) {
    var out = [];
    for (var i = 0; i < ENSAIOS.length; i++) {
      if (exigeEnsaio(j, ENSAIOS[i].id)) out.push(ENSAIOS[i]);
    }
    return out;
  }

  /**
   * Junta realmente concluída: liberada pela qualidade OU com todos
   * os ensaios exigidos executados (data + relatório).
   * Sem classe de inspeção informada não há como afirmar conclusão.
   */
  function concluida(j) {
    if (ehData(j.dataLib)) return true;
    var exigidos = ensaiosExigidos(j);
    if (!exigidos.length) return false;
    for (var i = 0; i < exigidos.length; i++) {
      if (estadoEnsaio(j, exigidos[i].id) !== 'ok') return false;
    }
    return true;
  }

  /* ============================================================
     SITUAÇÃO (mesma regra do arquivo original)
     ============================================================ */
  /**
   * Regra da planilha de origem (data de liberação manda), acrescida
   * do fechamento por ensaios: se tudo que a classe de inspeção exige
   * já foi executado, a junta conta como concluída mesmo sem a data
   * de liberação lançada.
   */
  function situacaoCalculada(j) {
    if (ehData(j.dataLib)) return 'Concluido';
    var st = j.statusLib;
    if (st) {
      st = String(st).trim().toUpperCase();
      if (st === 'REPROVADO') return 'Reprovado';
      if (st === 'CANCELADO') return 'Cancelado';
    }
    if (concluida(j)) return 'Concluido';
    return 'Aguardando Ensaio';
  }

  /** chave curta para gráficos e filtros */
  function situacao(j) {
    var s = normalizar(situacaoCalculada(j));
    if (s === 'CONCLUIDO') return 'concluido';
    if (s === 'REPROVADO') return 'reprovado';
    if (s === 'CANCELADO') return 'cancelado';
    return 'aguardando';
  }

  var SITUACOES = [
    { k: 'concluido', label: 'Concluída', icone: '✔' },
    { k: 'aguardando', label: 'Aguardando ensaio', icone: '◷' },
    { k: 'reprovado', label: 'Reprovada', icone: '✖' },
    { k: 'cancelado', label: 'Cancelada', icone: '⊘' }
  ];

  /* chaves consultadas por juntaVazia, calculadas uma única vez */
  var CHAVES_CONTEUDO = COLS.filter(function (c) { return !c.calc; }).map(function (c) { return c.k; });

  function juntaVazia(j) {
    for (var i = 0; i < CHAVES_CONTEUDO.length; i++) {
      var v = j[CHAVES_CONTEUDO[i]];
      if (v !== '' && v !== null && v !== undefined && String(v).trim() !== '') return false;
    }
    return true;
  }

  /* ------------------------------------------------------------
     Derivados do mapa inteiro (milhares de linhas) calculados numa
     passada só e guardados até a próxima alteração — sem isso cada
     tecla digitada varria todas as juntas várias vezes.
     ------------------------------------------------------------ */
  var cacheDerivado = null;

  function derivados() {
    if (cacheDerivado) return cacheDerivado;
    var lista = [], pd = 0;
    var cont = { concluido: 0, aguardando: 0, reprovado: 0, cancelado: 0 };
    var pdSit = { concluido: 0, aguardando: 0, reprovado: 0, cancelado: 0 };
    var porLiberacao = 0, porEnsaio = 0, semClasse = 0, comPendencia = 0, totalPend = 0;

    for (var i = 0; i < S.juntas.length; i++) {
      var j = S.juntas[i];
      if (juntaVazia(j)) continue;
      lista.push(j);
      var p = polegadas(j);
      pd += p;
      var sit = situacao(j);
      cont[sit]++;
      pdSit[sit] += p;

      if (sit === 'concluido') {
        if (ehData(j.dataLib)) porLiberacao++; else porEnsaio++;
      }
      if (!ensaiosExigidos(j).length) semClasse++;
      var np = pendencias(j).length;
      if (np) { comPendencia++; totalPend += np; }
    }

    for (var k in pdSit) pdSit[k] = Math.round(pdSit[k] * 100) / 100;

    cacheDerivado = {
      lista: lista,
      total: lista.length,
      pd: Math.round(pd * 100) / 100,
      contagem: cont,
      pdPorSituacao: pdSit,
      concluidasPorLiberacao: porLiberacao,
      concluidasPorEnsaio: porEnsaio,
      semClasseInspecao: semClasse,
      juntasComPendencia: comPendencia,
      totalPendencias: totalPend
    };
    return cacheDerivado;
  }

  function juntasPreenchidas() { return derivados().lista; }
  function resumoGeral() { return derivados(); }

  /* ============================================================
     POLEGADAS DIAMETRAIS
     Aceita 4" · 1.1/2" · 1 1/2" · 3/4" · 10 " · 2,5"
     ============================================================ */
  var cachePol = {};
  function polegadasDe(txt) {
    var bruto = String(txt === null || txt === undefined ? '' : txt);
    if (cachePol[bruto] !== undefined) return cachePol[bruto];

    var s = bruto.replace(/["”″'']/g, ' ')
      .replace(/pol(egadas?)?|inch(es)?|\bin\b/gi, ' ')
      .replace(/\s+/g, ' ').trim();
    var v = 0, m;

    if ((m = /^(\d+)[\s.](\d+)\s*\/\s*(\d+)$/.exec(s)) && +m[3]) v = +m[1] + (+m[2] / +m[3]);
    else if ((m = /^(\d+)\s*\/\s*(\d+)$/.exec(s)) && +m[2]) v = +m[1] / +m[2];
    else if ((m = /^(\d+(?:[.,]\d+)?)$/.exec(s))) v = parseFloat(m[1].replace(',', '.'));

    if (!isFinite(v) || v < 0) v = 0;
    cachePol[bruto] = v;
    return v;
  }

  function polegadas(j) { return polegadasDe(j.diametro); }

  function somaPolegadas(js) {
    var t = 0;
    js.forEach(function (j) { t += polegadas(j); });
    return Math.round(t * 100) / 100;
  }

  /** Soma na unidade escolhida: 'juntas' (contagem) ou 'pd' (polegadas diametrais). */
  function medir(js, medida) {
    return medida === 'pd' ? somaPolegadas(js) : js.length;
  }

  function formatarPD(n) {
    if (!isFinite(n)) return '0';
    return (Math.round(n * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  }

  /** Identificação legível da junta. */
  function rotuloJunta(j) {
    var p = [];
    if (j.linha) p.push(j.linha);
    if (j.spool) p.push('SP ' + j.spool);
    if (j.junta) p.push('J ' + j.junta);
    return p.join(' · ') || '(junta sem identificação)';
  }

  /* ============================================================
     ESTADO
     ============================================================ */
  function configPadrao() {
    return {
      projeto: {
        cliente: '', contrato: '', projeto: '', empreendimento: '',
        local: '', equipamento: '', localEnsaio: ''
      },
      /* cadastro de equipamentos; cada relatório escolhe o seu.
         projeto.equipamento continua valendo como padrão. */
      equipamentos: [],
      evs: {
        procedimento: 'MG-EV-001-26', revProcedimento: '0',
        norma: 'ASME B31.3', criterio: 'ASME B31.3',
        materialBase: '', condicaoSuperficial: 'ESCOVADA / ISENTA DE RESPINGOS',
        iluminacaoMetodo: 'NATURAL / DIRETO', intensidadeLux: '1000'
      },
      lp: {
        normas: 'ASME V Art. 6 / ASME B31.3', criterio: 'ASME B31.3',
        procedimento: 'MG-LP-001-26', revisao: '0',
        material: '', espessura: '', confProjeto: 'CONF. PROJETO',
        condSuperficial: 'ESCOVADA', tipoIluminacao: 'NATURAL',
        equipIluminacao: 'LUZ NATURAL', intensLuminosa: '1000',
        tipoPenetrante: 'II', metodoRemocao: 'C',
        solvMarca: '', solvLote: '', penMarca: '', penLote: '',
        remMarca: '', remLote: '', revMarca: '', revLote: '',
        luximetro: '', luximetroCert: '', termometro: '', termometroCert: ''
      },
      assinaturas: {
        inspetor: '', supervisor: '', clienteFisc: '',
        cargoInspetor: '', cargoSupervisor: '', cargoClienteFisc: '',
        imgInspetor: '', imgSupervisor: '', imgClienteFisc: ''
      },
      logo: '',
      numeracao: {
        evsPrefixo: '', evsSeq: 1, evsSufixo: '/26',
        lpPrefixo: '', lpSeq: 1, lpSufixo: '/26',
        digitos: 3
      },
      relatorios: {
        agruparPorNumero: true,     // usa o n° de relatório já lançado no mapa
        maxLinhasEVS: 16, maxLinhasLP: 14
      }
    };
  }

  function estadoPadrao() {
    return {
      versao: 2,
      config: configPadrao(),
      soldadores: [],
      juntas: [],
      overrides: {},
      atualizadoEm: null
    };
  }

  var S = estadoPadrao();
  var listeners = [];

  function mergeDeep(alvo, origem) {
    for (var k in origem) {
      if (!Object.prototype.hasOwnProperty.call(origem, k)) continue;
      if (origem[k] && typeof origem[k] === 'object' && !Array.isArray(origem[k]) && alvo[k]) mergeDeep(alvo[k], origem[k]);
      else alvo[k] = origem[k];
    }
    return alvo;
  }

  /* ============================================================
     MAPAS POR CONTRATO
     Cada mapa é um registro próprio no banco; o índice guarda a
     lista e qual está aberto. Os modelos .xlsx são compartilhados.
     ============================================================ */
  var CHAVE_INDICE = '__indice';
  var indice = { atual: null, lista: [] };
  var idAtual = null;

  function novoId() {
    return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function metaDoEstado(id, estado, nomeSugerido) {
    var d = estado === S ? derivados() : null;
    return {
      id: id,
      nome: nomeSugerido || estado.config.projeto.projeto || estado.config.projeto.contrato || 'Mapa sem nome',
      contrato: estado.config.projeto.contrato || '',
      cliente: estado.config.projeto.cliente || '',
      juntas: d ? d.total : (estado.juntas || []).length,
      pd: d ? d.pd : 0,
      em: estado.atualizadoEm || new Date().toISOString()
    };
  }

  function entradaIndice(id) {
    for (var i = 0; i < indice.lista.length; i++) if (indice.lista[i].id === id) return indice.lista[i];
    return null;
  }

  function gravarIndice() { return DB.put(DB.ST_ESTADO, CHAVE_INDICE, indice); }

  function sincronizarIndice() {
    var e = entradaIndice(idAtual);
    if (!e) return;
    var m = metaDoEstado(idAtual, S, e.nome);
    e.contrato = m.contrato; e.cliente = m.cliente;
    e.juntas = m.juntas; e.pd = m.pd; e.em = m.em;
    /* o nome segue o projeto enquanto o usuário não renomear à mão */
    if (!e.nomeManual) e.nome = S.config.projeto.projeto || S.config.projeto.contrato || e.nome;
  }

  function listaMapas() { return indice.lista.slice(); }
  function mapaAtual() { return entradaIndice(idAtual); }

  async function criarMapa(nome, contrato, cliente) {
    await descarregarAsync();
    var id = novoId();
    var novo = estadoPadrao();
    novo.config.projeto.projeto = nome || '';
    novo.config.projeto.contrato = contrato || '';
    novo.config.projeto.cliente = cliente || '';
    /* herda os parâmetros de ensaio e as assinaturas do mapa atual */
    if (S && S.config) {
      novo.config.evs = JSON.parse(JSON.stringify(S.config.evs));
      novo.config.lp = JSON.parse(JSON.stringify(S.config.lp));
      novo.config.assinaturas = JSON.parse(JSON.stringify(S.config.assinaturas));
      novo.config.logo = S.config.logo;
      novo.soldadores = JSON.parse(JSON.stringify(S.soldadores));
    }
    await DB.put(DB.ST_ESTADO, id, novo);
    indice.lista.push(metaDoEstado(id, novo, nome));
    indice.atual = id;
    await gravarIndice();
    S = novo; idAtual = id;
    invalidarCaches();
    if (DB.escutar) DB.escutar(id);
    return id;
  }

  /** Cria um mapa novo a partir de um backup .json e o deixa aberto.
      É o caminho para levar um mapa do arquivo local para o compartilhado. */
  async function restaurarBackup(obj, nome) {
    var cfgP = (obj.config && obj.config.projeto) || {};
    await criarMapa(nome || cfgP.projeto || 'Backup restaurado', cfgP.contrato || '', cfgP.cliente || '');
    var lido = hidratar(obj);
    S.config = lido.config;
    S.soldadores = lido.soldadores;
    S.overrides = lido.overrides;
    S.juntas.length = 0;
    lido.juntas.forEach(function (j) { S.juntas.push(j); });
    invalidarCaches();
    await salvar(true);
    return idAtual;
  }

  async function abrirMapa(id) {
    if (id === idAtual) return;
    await descarregarAsync();
    var obj = await DB.get(DB.ST_ESTADO, id);
    if (!obj) throw new Error('Mapa não encontrado.');
    S = hidratar(obj);
    idAtual = id;
    indice.atual = id;
    await gravarIndice();
    invalidarCaches();
    if (DB.escutar) DB.escutar(id);
  }

  /** Relê o mapa aberto depois que outro usuário gravou nele. */
  async function recarregarDoBanco() {
    if (!idAtual) return false;
    await descarregarAsync();               /* empurra o que é meu antes de puxar */
    var obj = await DB.get(DB.ST_ESTADO, idAtual);
    if (!obj) return false;
    S = hidratar(obj);
    invalidarCaches();
    return true;
  }

  async function renomearMapa(id, nome) {
    var e = entradaIndice(id);
    if (!e) return;
    e.nome = nome; e.nomeManual = true;
    await gravarIndice();
  }

  async function duplicarMapa(id, nome) {
    if (id === idAtual) await descarregarAsync();
    var obj = await DB.get(DB.ST_ESTADO, id);
    if (!obj) throw new Error('Mapa não encontrado.');
    var copia = JSON.parse(JSON.stringify(obj));
    var novo = novoId();
    await DB.put(DB.ST_ESTADO, novo, copia);
    var meta = metaDoEstado(novo, copia, nome);
    meta.nomeManual = true;
    indice.lista.push(meta);
    await gravarIndice();
    return novo;
  }

  async function excluirMapa(id) {
    indice.lista = indice.lista.filter(function (m) { return m.id !== id; });
    await DB.del(DB.ST_ESTADO, id);
    if (idAtual === id) {
      if (indice.lista.length) {
        indice.atual = indice.lista[0].id;
        await gravarIndice();
        idAtual = null;
        await abrirMapa(indice.lista[0].id);
      } else {
        indice.atual = null;
        await gravarIndice();
        idAtual = null;
        await criarMapa('Novo mapa', '', '');
      }
    } else {
      await gravarIndice();
    }
  }

  function hidratar(obj) {
    var base = estadoPadrao();
    mergeDeep(base.config, obj.config || {});
    base.soldadores = obj.soldadores || [];
    base.juntas = (obj.juntas || []).map(function (j) {
      var nova = novaJunta();
      for (var k in j) if (Object.prototype.hasOwnProperty.call(j, k)) nova[k] = j[k];
      if (!nova._id) nova._id = novaJunta()._id;
      return nova;
    });
    base.overrides = obj.overrides || {};
    base.atualizadoEm = obj.atualizadoEm || null;
    return base;
  }

  async function carregar() {
    try {
      var idx = await DB.get(DB.ST_ESTADO, CHAVE_INDICE);

      if (!idx) {
        /* migração: o registro único vira o primeiro mapa da lista */
        var antigo = await DB.get(DB.ST_ESTADO, 'atual');
        if (!antigo) {
          var raw = localStorage.getItem(KEY) || localStorage.getItem('mapaJuntas.v1');
          if (raw) {
            antigo = JSON.parse(raw);
            localStorage.removeItem(KEY);
            localStorage.removeItem('mapaJuntas.v1');
          }
        }
        idx = { atual: null, lista: [] };
        if (antigo) {
          var idMig = novoId();
          var estMig = hidratar(antigo);
          await DB.put(DB.ST_ESTADO, idMig, estMig);
          await DB.del(DB.ST_ESTADO, 'atual');
          idx.lista.push(metaDoEstado(idMig, estMig));
          idx.atual = idMig;
        }
        indice = idx;
        await gravarIndice();
      } else {
        indice = idx;
        if (!indice.lista) indice.lista = [];
      }

      var id = (indice.atual && entradaIndice(indice.atual)) ? indice.atual
        : (indice.lista[0] ? indice.lista[0].id : null);

      if (!id) { await criarMapa('Mapa 1', '', ''); return; }

      var obj = await DB.get(DB.ST_ESTADO, id);
      S = obj ? hidratar(obj) : estadoPadrao();
      idAtual = id;
      indice.atual = id;
      invalidarCaches();
    } catch (e) {
      console.warn('Falha ao carregar dados salvos:', e);
    }
  }

  /* ------------------------------------------------------------
     Gravação: o estado do mapa passa de 4 MB. Clonar e gravar isso
     a cada tecla congelava a tela — a gravação é adiada e roda em
     tempo ocioso, com descarga garantida ao sair da página.
     ------------------------------------------------------------ */
  var saveTimer = null, salvando = false, novamente = false, sujoDisco = false;
  var listenersErro = [];

  function gravar() {
    if (salvando) { novamente = true; return Promise.resolve(); }
    if (!idAtual) return Promise.resolve();
    salvando = true;
    sujoDisco = false;
    S.atualizadoEm = new Date().toISOString();
    sincronizarIndice();
    gravarIndice();
    return DB.put(DB.ST_ESTADO, idAtual, S)
      .catch(function (e) {
        console.warn('Não foi possível salvar:', e);
        sujoDisco = true;
        listenersErro.forEach(function (fn) { fn(e); });
      })
      .then(function () {
        salvando = false;
        if (novamente) { novamente = false; return gravar(); }
      });
  }

  function agendarGravacao() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (typeof requestIdleCallback === 'function') requestIdleCallback(gravar, { timeout: 4000 });
      else gravar();
    }, 1800);
  }

  function salvar(imediato) {
    sujoDisco = true;
    if (imediato) { clearTimeout(saveTimer); return gravar(); }
    agendarGravacao();
    return Promise.resolve();
  }

  function descarregar() { if (sujoDisco) { clearTimeout(saveTimer); gravar(); } }
  function descarregarAsync() {
    clearTimeout(saveTimer);
    return sujoDisco ? gravar() : Promise.resolve();
  }
  window.addEventListener('visibilitychange', function () { if (document.hidden) descarregar(); });
  window.addEventListener('pagehide', descarregar);
  window.addEventListener('beforeunload', descarregar);

  function invalidarCaches() {
    cacheClasse = {};
    cacheSug = null;
    cacheDerivado = null;
  }

  /* Avisar a interface a cada tecla era caro demais; os avisos são
     agrupados numa janela curta. `imediato` força o disparo. */
  var avisoTimer = null, origemPendente = null;

  function disparar() {
    avisoTimer = null;
    var o = origemPendente; origemPendente = null;
    listeners.forEach(function (fn) { try { fn(o); } catch (e) { console.error(e); } });
  }

  function notificar(origem, imediato) {
    invalidarCaches();
    salvar();
    origemPendente = origem;
    if (imediato) { clearTimeout(avisoTimer); disparar(); return; }
    if (avisoTimer) return;
    avisoTimer = setTimeout(disparar, 250);
  }

  /* ---------------- modelos .xlsx (IndexedDB) ----------------
     Índice em memória para a interface; o conteúdo (Uint8Array)
     fica no banco e só é lido na hora de exportar.
  ------------------------------------------------------------ */
  var indiceModelos = {};

  async function carregarTemplates() {
    try {
      var ks = await DB.chaves(DB.ST_MODELOS);
      var todos = await DB.todos(DB.ST_MODELOS);
      indiceModelos = {};
      (ks || []).forEach(function (k, i) {
        var v = todos[i] || {};
        indiceModelos[k] = { nome: v.nome || '', em: v.em || '', partes: v.files ? Object.keys(v.files).length : 0 };
      });
    } catch (e) {
      console.warn('Falha ao ler modelos:', e);
      indiceModelos = {};
    }
  }

  async function setTemplate(id, nome, files) {
    var registro = { nome: nome, em: new Date().toISOString(), files: files };
    try {
      await DB.put(DB.ST_MODELOS, id, registro);
      indiceModelos[id] = { nome: nome, em: registro.em, partes: Object.keys(files).length };
      return true;
    } catch (e) {
      console.warn('Não foi possível gravar o modelo:', e);
      return false;
    }
  }

  async function getTemplateFiles(id) {
    try {
      var reg = await DB.get(DB.ST_MODELOS, id);
      return reg ? reg.files : null;
    } catch (e) { return null; }
  }

  function temTemplate(id) { return !!indiceModelos[id]; }
  function infoTemplate(id) { return indiceModelos[id] || null; }
  async function removerTemplate(id) {
    delete indiceModelos[id];
    try { await DB.del(DB.ST_MODELOS, id); } catch (e) { /* ignora */ }
  }

  /* ---------------- sugestões / listas ---------------- */
  var cacheSug = null;
  function sugestoes(chave) {
    if (!cacheSug) {
      cacheSug = {};
      COLS.forEach(function (c) { if (c.sug) cacheSug[c.k] = {}; });
      S.juntas.forEach(function (j) {
        for (var k in cacheSug) {
          var v = String(j[k] || '').trim();
          if (v) cacheSug[k][v] = true;
        }
      });
      for (var k2 in SUGESTOES) {
        if (!cacheSug[k2]) cacheSug[k2] = {};
        SUGESTOES[k2].forEach(function (v) { cacheSug[k2][v] = true; });
      }
      S.soldadores.forEach(function (s) {
        if (!s.sinete) return;
        if (cacheSug.soldRaiz) cacheSug.soldRaiz[s.sinete] = true;
        if (cacheSug.soldAcab) cacheSug.soldAcab[s.sinete] = true;
      });
    }
    return Object.keys(cacheSug[chave] || {}).sort();
  }

  function sinetes() {
    var set = {};
    S.soldadores.forEach(function (s) { if (s.sinete) set[s.sinete] = true; });
    S.juntas.forEach(function (j) {
      if (j.soldRaiz) set[j.soldRaiz] = true;
      if (j.soldAcab) set[j.soldAcab] = true;
    });
    return Object.keys(set).sort();
  }
  function nomeSoldador(sinete) {
    var s = S.soldadores.filter(function (x) { return x.sinete === sinete; })[0];
    return s ? s.nome : '';
  }

  function opcoes(lista) { return LEGENDA[lista] || []; }

  /* ---------------- equipamentos ---------------- */
  function equipamentos() {
    if (!S.config.equipamentos) S.config.equipamentos = [];
    return S.config.equipamentos;
  }

  /** Texto que vai para o campo EQUIPAMENTO do formulário. */
  function rotuloEquipamento(e) {
    if (!e) return '';
    var t = String(e.tag || '').trim();
    var d = String(e.descricao || '').trim();
    return (t && d) ? t + ' — ' + d : (t || d);
  }

  function listaEquipamentos() {
    var out = [], visto = {};
    equipamentos().forEach(function (e) {
      var r = rotuloEquipamento(e);
      if (r && !visto[r]) { visto[r] = true; out.push(r); }
    });
    /* o que já estava digitado no projeto continua disponível */
    var atual = String(S.config.projeto.equipamento || '').trim();
    if (atual && !visto[atual]) out.push(atual);
    return out;
  }

  /** Numeração automática quando o mapa não traz o número do relatório. */
  function numeroRelatorio(tipo, indice) {
    var n = S.config.numeracao;
    var seq = (tipo === 'EVS' ? (n.evsSeq || 1) : (n.lpSeq || 1)) + indice;
    var d = Math.max(1, parseInt(n.digitos, 10) || 3);
    var s = String(seq);
    while (s.length < d) s = '0' + s;
    return (tipo === 'EVS' ? (n.evsPrefixo || '') : (n.lpPrefixo || '')) + s +
      (tipo === 'EVS' ? (n.evsSufixo || '') : (n.lpSufixo || ''));
  }

  global.Store = {
    KEY: KEY, KEY_TPL: KEY_TPL,
    COLS: COLS, COLMAP: COLMAP, GRUPOS: GRUPOS, LEGENDA: LEGENDA,
    ENSAIOS: ENSAIOS, ENSAIOMAP: ENSAIOMAP, SITUACOES: SITUACOES,
    LINHA_CABECALHO: LINHA_CABECALHO, PRIMEIRA_LINHA_DADOS: PRIMEIRA_LINHA_DADOS,

    get estado() { return S; },
    get juntas() { return S.juntas; },
    get config() { return S.config; },
    get soldadores() { return S.soldadores; },

    novaJunta: novaJunta,
    configPadrao: configPadrao,
    estadoPadrao: estadoPadrao,
    carregar: carregar,
    salvar: salvar,
    notificar: notificar,
    onChange: function (fn) { listeners.push(fn); },

    carregarTemplates: carregarTemplates,
    setTemplate: setTemplate,
    getTemplateFiles: getTemplateFiles,
    temTemplate: temTemplate,
    infoTemplate: infoTemplate,
    removerTemplate: removerTemplate,

    normalizar: normalizar,
    classeInspecao: classeInspecao,
    exigeEnsaio: exigeEnsaio,
    estadoEnsaio: estadoEnsaio,
    pendencias: pendencias,
    ensaiosExigidos: ensaiosExigidos,
    concluida: concluida,
    executado: executado,
    ehData: ehData,
    situacao: situacao,
    situacaoCalculada: situacaoCalculada,
    juntaVazia: juntaVazia,
    juntasPreenchidas: juntasPreenchidas,
    resumoGeral: resumoGeral,
    /* mapas por contrato */
    listaMapas: listaMapas, mapaAtual: mapaAtual,
    criarMapa: criarMapa, abrirMapa: abrirMapa, renomearMapa: renomearMapa,
    duplicarMapa: duplicarMapa, excluirMapa: excluirMapa,
    recarregarDoBanco: recarregarDoBanco, restaurarBackup: restaurarBackup,
    rotuloJunta: rotuloJunta,
    polegadasDe: polegadasDe,
    polegadas: polegadas,
    somaPolegadas: somaPolegadas,
    medir: medir,
    formatarPD: formatarPD,
    sugestoes: sugestoes,
    sinetes: sinetes,
    nomeSoldador: nomeSoldador,
    opcoes: opcoes,
    equipamentos: equipamentos,
    rotuloEquipamento: rotuloEquipamento,
    listaEquipamentos: listaEquipamentos,
    numeroRelatorio: numeroRelatorio
  };
})(window);

<script>
/* ============================================================
   ui-common.js - Utilitários de interface
   ============================================================ */
(function (global) {
  'use strict';

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') { for (var s in v) e.style[s] = v[s]; }
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    if (kids) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
    }
    return e;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ---------------- Blocos recolhíveis ----------------
     Todo painel do aplicativo abre e fecha; o estado de cada um
     fica guardado por chave, então a tela reabre como foi deixada.
  ------------------------------------------------------ */
  var KEY_CARDS = 'mapaJuntas.blocos';
  var estadoCards = null;

  function lerEstadoCards() {
    if (estadoCards) return estadoCards;
    try { estadoCards = JSON.parse(localStorage.getItem(KEY_CARDS) || '{}'); }
    catch (e) { estadoCards = {}; }
    return estadoCards;
  }
  function gravarEstadoCards() {
    try { localStorage.setItem(KEY_CARDS, JSON.stringify(lerEstadoCards())); } catch (e) { }
  }

  function cardFechado(id, padraoFechado) {
    var st = lerEstadoCards();
    return (st[id] === undefined) ? !!padraoFechado : st[id] === 'fechado';
  }

  /**
   * card(id, titulo, tagline, conteudo, opts)
   * opts: { fechado, classe, acoes:[nós no cabeçalho] }
   */
  function card(id, titulo, tagline, conteudo, opts) {
    opts = opts || {};
    var fechado = cardFechado(id, opts.fechado);
    var c = el('div', { class: 'card' + (opts.classe ? ' ' + opts.classe : '') + (fechado ? ' fechado' : '') });

    var cabecalho = el('button', {
      class: 'card-head', type: 'button',
      'aria-expanded': fechado ? 'false' : 'true',
      onclick: function () { alternarCard(c, id, cabecalho); }
    }, [
      el('span', { class: 'chev', html: '&#9662;' }),
      el('span', { class: 'card-titulo', text: titulo }),
      tagline ? el('span', { class: 'tagline', text: '— ' + tagline }) : null
    ]);

    var barra = el('div', { class: 'card-bar' }, [cabecalho]);
    if (opts.acoes) opts.acoes.forEach(function (n) { barra.appendChild(n); });
    c.appendChild(barra);

    var body = el('div', { class: 'card-body' });
    if (conteudo) body.appendChild(conteudo);
    c.appendChild(body);
    c._id = id;
    return c;
  }

  function alternarCard(c, id, cabecalho) {
    var fechar = !c.classList.contains('fechado');
    c.classList.toggle('fechado', fechar);
    if (cabecalho) cabecalho.setAttribute('aria-expanded', fechar ? 'false' : 'true');
    lerEstadoCards()[id] = fechar ? 'fechado' : 'aberto';
    gravarEstadoCards();
  }

  /** Abre ou fecha todos os blocos dentro de um contêiner. */
  function alternarTodos(raiz, fechar) {
    $$('.card, .chart-card', raiz).forEach(function (c) {
      if (!c._id) return;
      c.classList.toggle('fechado', fechar);
      var h = c.querySelector('.card-head');
      if (h) h.setAttribute('aria-expanded', fechar ? 'false' : 'true');
      lerEstadoCards()[c._id] = fechar ? 'fechado' : 'aberto';
    });
    gravarEstadoCards();
  }

  function botoesAbrirFechar(getRaiz) {
    return el('div', { style: { display: 'flex', gap: '6px' } }, [
      el('button', {
        class: 'btn sm', text: 'Expandir tudo',
        onclick: function () { alternarTodos(getRaiz(), false); }
      }),
      el('button', {
        class: 'btn sm', text: 'Recolher tudo',
        onclick: function () { alternarTodos(getRaiz(), true); }
      })
    ]);
  }

  /* ---------------- Toast ---------------- */
  function toast(msg, tipo, ms) {
    var wrap = $('#toasts');
    if (!wrap) { wrap = el('div', { class: 'toast-wrap', id: 'toasts' }); document.body.appendChild(wrap); }
    var t = el('div', { class: 'toast ' + (tipo || ''), text: msg });
    wrap.appendChild(t);
    var fim = setTimeout(function () {
      t.style.transition = 'opacity .2s'; t.style.opacity = '0';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 220);
    }, ms || (tipo === 'err' ? 6000 : 3200));
    t.remove = function () { clearTimeout(fim); if (t.parentNode) t.parentNode.removeChild(t); };
    return t;
  }

  /* ---------------- Modal ---------------- */
  function modal(titulo, conteudo, botoes) {
    var bg = el('div', { class: 'modal-bg' });
    var box = el('div', { class: 'modal' });
    box.appendChild(el('header', { text: titulo }));
    var body = el('div', { class: 'body' });
    if (typeof conteudo === 'string') body.innerHTML = conteudo; else body.appendChild(conteudo);
    box.appendChild(body);
    var ft = el('footer');
    (botoes || [{ label: 'Fechar' }]).forEach(function (b) {
      ft.appendChild(el('button', {
        class: 'btn ' + (b.class || ''),
        text: b.label,
        onclick: function () {
          var manter = b.onClick && b.onClick(body) === false;
          if (!manter) fechar();
        }
      }));
    });
    box.appendChild(ft);
    bg.appendChild(box);
    bg.addEventListener('mousedown', function (ev) { if (ev.target === bg) fechar(); });
    document.body.appendChild(bg);
    function fechar() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
    return { fechar: fechar, body: body };
  }

  function confirmar(titulo, msg, onSim) {
    modal(titulo, el('p', { text: msg, style: { margin: 0, lineHeight: '1.55' } }), [
      { label: 'Cancelar' },
      { label: 'Confirmar', class: 'primary', onClick: onSim }
    ]);
  }

  /* ---------------- Arquivos ----------------
     Aberto direto no computador, o download é o do próprio navegador.
     Publicado por link a página roda embutida e esse caminho é bloqueado —
     ali quem entrega o arquivo é a capability "downloads" do host, que
     mostra uma confirmação ao usuário antes de salvar.
  ------------------------------------------------------ */
  function embutido() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }

  /* extensões que o host não aceita salvar */
  var EXT_BLOQUEADA = { zip: true };

  var promDownloads = null;
  function obterDownloads() {
    if (!embutido()) return Promise.resolve(null);
    if (!promDownloads) {
      promDownloads = (window.claude && typeof window.claude.use === 'function')
        ? window.claude.use('downloads').catch(function () { return null; })
        : Promise.resolve(null);
    }
    return promDownloads;
  }
  obterDownloads();   /* aquece: o host pode demorar a responder */

  function avisoSemDownload(nome, ext) {
    modal('Não dá para salvar este arquivo aqui', el('div', null, [
      el('p', {
        style: { margin: '0 0 10px', lineHeight: '1.55' },
        text: EXT_BLOQUEADA[ext]
          ? 'O arquivo "' + nome + '" foi gerado, mas esta versão publicada não aceita salvar .zip.'
          : 'O arquivo "' + nome + '" foi gerado, mas esta versão não conseguiu acessar o serviço de download.'
      }),
      el('p', {
        style: { margin: 0, lineHeight: '1.55' },
        text: EXT_BLOQUEADA[ext]
          ? 'Exporte os relatórios um a um (botão "Excel (selecionado)"), que saem em .xlsx normalmente — ou use o arquivo "Mapa de Juntas (portatil).html" no computador para pegar tudo de uma vez.'
          : 'Abra o arquivo "Mapa de Juntas (portatil).html" direto no computador para exportar.'
      })
    ]), [{ label: 'Entendi', class: 'primary' }]);
  }

  function baixar(blob, nome) {
    if (!embutido()) {
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: nome });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
      return;
    }

    var ext = String(nome.split('.').pop() || '').toLowerCase();
    obterDownloads().then(function (dl) {
      if (!dl || EXT_BLOQUEADA[ext]) { avisoSemDownload(nome, ext); return; }
      return dl.save({ filename: nome, data: blob }).then(function () {
        toast('Arquivo salvo: ' + nome, 'ok');
      }, function (e) {
        var cod = e && e.code;
        if (cod === 'declined') return;                       /* o usuário recusou */
        if (cod === 'rate_limited') { toast('Já existe um download aguardando confirmação.', 'err'); return; }
        toast('Não foi possível salvar: ' + ((e && e.message) || 'erro desconhecido'), 'err');
      });
    });
  }

  function escolherArquivo(accept, cb) {
    var inp = el('input', { type: 'file', accept: accept, style: { display: 'none' } });
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      if (inp.files && inp.files[0]) cb(inp.files[0]);
      inp.remove();
    });
    inp.click();
  }

  function lerArrayBuffer(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsArrayBuffer(file);
    });
  }

  /* ---------------- Formatação ---------------- */
  function hoje() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dataBR(iso) {
    if (!iso) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : iso;
  }
  function pct(n, d) { return d ? Math.round((n / d) * 1000) / 10 : 0; }
  var RE_DIACRITICOS = new RegExp('[̀-ͯ]', 'g');
  function slug(s) {
    return String(s || '').normalize('NFD').replace(RE_DIACRITICOS, '')
      .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'arquivo';
  }
  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  global.UI = {
    $: $, $$: $$, el: el, clear: clear,
    card: card, alternarCard: alternarCard, alternarTodos: alternarTodos,
    botoesAbrirFechar: botoesAbrirFechar, cardFechado: cardFechado,
    toast: toast, modal: modal, confirmar: confirmar,
    baixar: baixar, escolherArquivo: escolherArquivo, lerArrayBuffer: lerArrayBuffer,
    hoje: hoje, dataBR: dataBR, pct: pct, slug: slug, escapeHtml: escapeHtml
  };
})(window);

</script>
<script>

(function (global) {
  'use strict';

  var RE_DIACRITICOS = new RegExp('[̀-ͯ]', 'g');

  function norm(s) {
    return String(s === null || s === undefined ? '' : s)
      .normalize('NFD').replace(RE_DIACRITICOS, '')

      .replace(/[^a-z0-9]+/g, ' ')

  /* Rótulo normalizado -> chave(s) internas, na ordem de ocorrência. */
  var DIC = {
