    'rel visual de solda vs': ['relVS'],
    'data liquido penetrante lp raiz': ['dataLPR'],
    'rel liquido penetrante lp raiz': ['relLPR'],
    'data liquido penetrante lp acabamento': ['dataLPA'],
    'rel liquido penetrante lp acabamento': ['relLPA'],
    'data ultrassom us': ['dataUS'],
    'rel ultrassom us': ['relUS'],
    'data dm pre fabricacao': ['dataDM'],
    'tipo de end': ['tipoEND'],
    'data jateamento': ['dataJato'],
    'data fundo': ['dataFundo'],
    'data pmi': ['dataPMI'],
    'relatorio pmi': ['relPMI'],
    'data th': ['dataTH'],
    'relatorio th': ['relTH'],
    'data liberacao': ['dataLib'],
    'status liberacao': ['statusLib'],
    'status': ['statusLib'],
    'situacao': ['__situacao'],
    'observacoes': ['obs'], 'observacao': ['obs'], 'obs': ['obs'],

    /* --- compatibilidade com o antigo FOR-435 --- */
    'desenho': ['linha'],
    'n da junta': ['junta'], 'no da junta': ['junta'], 'numero da junta': ['junta'],
    'tipo da junta': ['tipo'],
    'metal de base': ['material'], 'material de base': ['material'],
    'espessura do material': ['sch'], 'espessura': ['sch'],
    'metal de adicao': ['consumiveis'],
    'soldador sinete raiz': ['soldRaiz'],
    'soldador sinete ench acab': ['soldAcab'],
    'local': ['pc'],
    'status da junta aprovada': ['__apr'],
    'status da junta reprovada': ['__rep']
  };

  /* ---------------- leitura ---------------- */
  function expandirMerges(sheet) {
    var out = {};
    for (var k in sheet.cells) out[k] = sheet.cells[k];
    (sheet.merges || []).forEach(function (m) {
      var p = m.split(':');
      var a = XL.parseRef(p[0]), b = XL.parseRef(p[1]);
      if (!a || !b) return;
      var v = sheet.cells[p[0]];
      if (v === undefined) return;
      for (var c = a.col; c <= b.col; c++) {
        for (var r = a.row; r <= b.row; r++) out[XL.ref(c, r)] = v;
      }
    });
    return out;
  }

  function detectarColunas(sheet) {
    var cells = expandirMerges(sheet);
    var melhor = null;
    var limite = Math.max(sheet.maxCol, 50);

    for (var r = 1; r <= Math.min(30, sheet.maxRow); r++) {
      var mapa = {}, usados = {}, acertos = 0, duasLinhas = false;

      for (var c = 1; c <= limite; c++) {
        var top = norm(cells[XL.ref(c, r)] || '');
        var sub = norm(cells[XL.ref(c, r + 1)] || '');
        var cand = [];
        if (top && sub && top !== sub) cand.push(top + ' ' + sub);
        if (top) cand.push(top);
        if (sub) cand.push(sub);

        for (var i = 0; i < cand.length; i++) {
          var lista = DIC[cand[i]];
          if (!lista) continue;
          var escolhida = null;
          for (var q = 0; q < lista.length; q++) {
            if (!usados[lista[q]]) { escolhida = lista[q]; break; }
          }
          if (!escolhida) continue;
          usados[escolhida] = true;
          mapa[c] = escolhida;
          acertos++;
          if (i === 0 && sub) duasLinhas = true;
          break;
        }
      }
      if (!melhor || acertos > melhor.acertos) {
        melhor = { linha: r, mapa: mapa, acertos: acertos, duasLinhas: duasLinhas };
      }
    }

    if (!melhor || melhor.acertos < 4) return null;
    melhor.primeiraLinha = melhor.linha + (melhor.duasLinhas ? 2 : 1);
    melhor.cells = cells;
    return melhor;
  }

  function isoDeData(v) {
    if (v === null || v === undefined) return '';
    var s = String(v).trim();
    if (!s) return '';
    var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
    if (m) {
      var y = m[3].length === 2 ? '20' + m[3] : m[3];
      return y + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    }
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    if (/^\d+(\.\d+)?$/.test(s)) {
      var n = Math.floor(parseFloat(s));
      if (n > 20000 && n < 80000) {
        return new Date(Date.UTC(1899, 11, 30) + n * 86400000).toISOString().slice(0, 10);
      }
    }
    return s;   // texto livre ("Falta US", "N/A"…) é preservado
  }

  function limparCodigo(v, lista) {
    var s = String(v || '').trim();
    if (!s || !lista) return s;
    var ops = Store.LEGENDA[lista] || [];
    for (var i = 0; i < ops.length; i++) {
      if (norm(ops[i].c) === norm(s)) return ops[i].c;
      if (norm(ops[i].d) === norm(s)) return ops[i].c;
    }
    if (lista === 'PC') {
      var n = norm(s);
      if (n === 'ps' || n === 'pipe shop' || n === 'p') return 'P';
      if (n === 'cp' || n === 'campo' || n === 'c') return 'C';
    }
    return s;
  }

  async function importarMapa(file) {
    var buf = await UI.lerArrayBuffer(file);
    var wb = await XL.read(buf);

    /* escolhe a planilha com mais colunas reconhecidas */
    var melhorSheet = null, melhorDet = null;
    wb.sheets.forEach(function (sh) {
      if (!sh.maxRow) return;
      var det = detectarColunas(sh);
      if (det && (!melhorDet || det.acertos > melhorDet.acertos)) { melhorSheet = sh; melhorDet = det; }
    });

    if (!melhorDet) {
      throw new Error('Não foi possível reconhecer o cabeçalho do mapa. ' +
        'A planilha deve ter uma linha de títulos como "Linha", "Junta", "Soldador Raiz"…');
    }

    var sheet = melhorSheet, det = melhorDet, cells = det.cells;
    var juntas = [], vazias = 0;

    for (var r = det.primeiraLinha; r <= sheet.maxRow + 1; r++) {
      var j = Store.novaJunta();
      var preenchida = false, apr = '', rep = '', sitLida = '';

      for (var c in det.mapa) {
        var key = det.mapa[c];
        var v = cells[XL.ref(parseInt(c, 10), r)];
        if (v === undefined || v === null || String(v).trim() === '') continue;
        v = String(v).trim();
        if (key === '__situacao') { sitLida = v; continue; }
        if (key === '__apr') { apr = v; preenchida = true; continue; }
        if (key === '__rep') { rep = v; preenchida = true; continue; }
        var col = Store.COLMAP[key];
        if (!col) continue;
        if (col.type === 'date') v = isoDeData(v);
        else if (col.list) v = limparCodigo(v, col.list);
        j[key] = v;
        preenchida = true;
      }

      if (apr || rep) {
        var a = norm(apr), b = norm(rep);
        if (b && b !== 'na' && b !== '0') j.statusLib = 'Reprovado';
        else if (a && a !== 'na' && a !== '0') j.statusLib = 'Aprovado';
      }

      /* A coluna "Situação" é calculada na planilha de origem. Quando ela
         acusa reprovação ou cancelamento, essa informação só existe ali —
         é recuperada para o campo "Status Liberação" do aplicativo. */
      if (sitLida && !j.statusLib) {
        var ns = norm(sitLida);
        if (ns.indexOf('reprov') === 0) j.statusLib = 'Reprovado';
        else if (ns.indexOf('cancel') === 0) j.statusLib = 'Cancelado';
      }

      if (!preenchida) { vazias++; if (vazias > 15) break; continue; }
      vazias = 0;
      juntas.push(j);
    }

    /* dados de cabeçalho soltos na planilha */
    var cfg = {};
    Object.keys(cells).forEach(function (k) {
      var t = String(cells[k]);
      var mc = /^\s*cliente\s*:\s*(.+)$/i.exec(t);
      var mp = /^\s*projeto\s*:\s*(.+)$/i.exec(t);
      if (mc && mc[1].trim()) cfg.cliente = mc[1].trim();
      if (mp && mp[1].trim()) cfg.projeto = mp[1].trim();
    });
    if (!cfg.projeto && juntas.length && juntas[0].projeto) cfg.projeto = juntas[0].projeto;

    /* cadastro de soldadores, se houver aba própria */
    var soldadores = [];
    var sSin = wb.sheets.filter(function (s) { return /sinete|soldador/i.test(s.name); })[0];
    if (sSin) {
      for (var rr = 2; rr <= sSin.maxRow; rr++) {
        var nome = sSin.cells['A' + rr], sin = sSin.cells['B' + rr];
        if (!nome && !sin) continue;
        if (norm(nome) === 'soldador') continue;
        soldadores.push({ nome: String(nome || '').trim(), sinete: String(sin || '').trim(), processo: '', qualif: '' });
      }
    }

    return {
      juntas: juntas, planilha: sheet.name, cfg: cfg, soldadores: soldadores,
      colunas: Object.keys(det.mapa).length,
      linhaCabecalho: det.linha, primeiraLinha: det.primeiraLinha
    };
  }

  /* ---------------- exportação do mapa ---------------- */

  /** Escolhe a planilha do mapa dentro do modelo (a maior, que é a de dados). */
  function acharSheetMapa(tpl) {
    var nomes = tpl.sheetNames(), melhor = null;
    nomes.forEach(function (nome) {
      var p = tpl.sheetPathByName(nome);
      if (!p || !tpl.files[p]) return;
      var tam = tpl.files[p].length;
      if (!melhor || tam > melhor.tam) melhor = { path: p, nome: nome, tam: tam };
    });
    return melhor || { path: tpl.firstSheetPath(), nome: nomes[0] };
  }

  async function exportarMapa() {
    var juntas = Store.juntasPreenchidas();
    var cfg = Store.config;
    var files = await Store.getTemplateFiles('mapa');

    if (files) {
      var tpl = new XL.Template(files);
      var alvo = acharSheetMapa(tpl);
      var path = alvo.path;
      var st = tpl.dataStyle(), sd = tpl.dateStyle();
      var LH = Store.LINHA_CABECALHO, L0 = Store.PRIMEIRA_LINHA_DADOS;

      tpl.stripCustomViews();
      tpl.removePart('xl/calcChain.xml');
      tpl.removerVinculosExternos();

      /* área de dados gerada como texto (milhares de linhas) */
      var partes = [];
      juntas.forEach(function (j, i) {
        var r = L0 + i;
        partes.push('<row r="' + r + '">');
        Store.COLS.forEach(function (col) {
          var v = col.calc ? Store.situacaoCalculada(j) : j[col.k];
          if (col.type === 'date') {
            var serie = XL.serialData(v);
            if (serie !== null) { partes.push(XL.celulaXml(col.col + r, serie, sd)); return; }
          }
          partes.push(XL.celulaXml(col.col + r, (v === null || v === undefined) ? '' : String(v), st));
        });
        partes.push('</row>');
      });

      tpl.bulkSheet(path, {
        primeiraLinha: L0,
        linhas: partes.join(''),
        ultimaLinha: L0 + Math.max(juntas.length, 1) - 1,
        cabecalho: function (h) {
          h.set('D6', juntas.length);                       // total de juntas
          var stHdr = h.estiloDe('A' + LH);
          Store.COLS.forEach(function (col) {
            if (col.k === 'statusLib') h.set(col.col + LH, 'Status Liberação', stHdr);
            if (col.k === 'obs') h.set(col.col + LH, 'Observações', stHdr);
          });
        }
      });

      return { blob: await tpl.build(), viaModelo: true, planilha: alvo.nome };
    }

    /* ---- sem modelo: gera do zero ---- */
    var grid = [];
    grid[0] = [{ v: 'CONTROLE DE TUBULAÇÃO', s: 'title' }];
    grid[2] = [{ v: 'SITUAÇÃO GERAL DE JUNTAS', s: 'title' }];
    grid[4] = [{ v: 'Cliente: ' + (cfg.projeto.cliente || ''), s: 'label' }];
    grid[5] = [{ v: 'Total de Juntas:', s: 'label' }, { v: juntas.length, s: 'label' }];

    var cab = Store.COLS.map(function (c) {
      return { v: (c.grp && c.h.length < 12 ? c.grp + ' — ' + c.h : c.h), s: 'head' };
    });
    grid[6] = cab;

    juntas.forEach(function (j, i) {
      grid[7 + i] = Store.COLS.map(function (c) {
        return { v: c.calc ? Store.situacaoCalculada(j) : (j[c.k] || ''), s: 'cell' };
      });
    });

    var widths = Store.COLS.map(function (c) { return Math.max(9, Math.round(c.w / 7)); });
    var blob = await XL.buildSimple('Situação Geral de Juntas', grid, {
      colWidths: widths, freeze: 7, landscape: true
    });
    return { blob: blob, viaModelo: false };
  }

  /* ---------------- relatórios ---------------- */
  function limpar(v) { return (v === null || v === undefined) ? '' : String(v); }

  /**
   * Assinaturas: nome/cargo em texto e a imagem ancorada sobre o quadro.
   * ancoras = [{col, linha, colFim, linhaFim}] na ordem inspetor, supervisor, cliente.
   */
  function aplicarAssinaturas(tpl, path, celulasNome, ancoras) {
    var a = Store.config.assinaturas;
    var itens = [
      { nome: a.inspetor, cargo: a.cargoInspetor, img: a.imgInspetor, rot: 'Inspetor' },
      { nome: a.supervisor, cargo: a.cargoSupervisor, img: a.imgSupervisor, rot: 'Supervisor CQ' },
      { nome: a.clienteFisc, cargo: a.cargoClienteFisc, img: a.imgClienteFisc, rot: 'Cliente' }
    ];
    itens.forEach(function (it, i) {
      var txt = it.nome || '';
      if (it.cargo) txt = txt ? txt + ' — ' + it.cargo : it.cargo;
      tpl.set(path, celulasNome[i], txt);
      if (it.img && ancoras[i]) {
        try { tpl.inserirImagem(path, it.img, ancoras[i], 'Assinatura ' + it.rot); }
        catch (e) { console.warn('Assinatura não inserida no Excel:', e); }
      }
    });
  }

  function marcarLaudo(tpl, path, cels, laudoFinal) {
    tpl.set(path, cels[0], laudoFinal === 'APR' ? 'x' : '');
    tpl.set(path, cels[1], laudoFinal === 'REP' ? 'x' : '');
    tpl.set(path, cels[2], laudoFinal === 'COMP' ? 'x' : '');
  }

  async function blobRelatorioEVS(rel) {
    var files = await Store.getTemplateFiles('for266');
    if (!files) throw new Error('Importe primeiro o modelo FOR-266 na aba Configurações.');
    var cfg = Store.config;
    var tpl = new XL.Template(files);
    var p = tpl.firstSheetPath();

    tpl.setMany(p, {
      'AE1': rel.numero, 'AE3': rel.folha, 'AE5': UI.dataBR(rel.data),
      'F8': cfg.projeto.cliente, 'R8': cfg.projeto.contrato, 'AA8': cfg.projeto.local,
      'G10': rel.equipamento, 'X10': cfg.projeto.localEnsaio,
      'E12': cfg.projeto.projeto, 'U12': rel.docRef, 'AG12': rel.revDoc,
      'G14': cfg.evs.procedimento, 'Q14': cfg.evs.revProcedimento, 'AA14': cfg.evs.norma,
      'H16': cfg.evs.materialBase || rel.materialResumo, 'AB16': cfg.evs.criterio,
      'H18': cfg.evs.condicaoSuperficial, 'U18': cfg.evs.iluminacaoMetodo,
      'AE18': cfg.evs.intensidadeLux
    });

    for (var i = 0; i < 16; i++) {
      var r = 24 + i, j = rel.juntas[i], m = {};
      m['A' + r] = j ? limpar(j.linha) : '';
      m['J' + r] = j ? limpar(j.junta) : '';
      m['M' + r] = j ? limpar(j.diametro) : '';
      m['O' + r] = j ? limpar(j.sch) : '';
      m['Q' + r] = j ? limpar(j.tipo) : '';
      m['S' + r] = j ? limpar(j.material) : '';
      m['V' + r] = j ? (limpar(j.ieis) && limpar(j.ieis) !== 'N/A' ? j.ieis : limpar(j.eps)) : '';
      m['Z' + r] = j ? limpar(j.soldRaiz) : '';
      m['AC' + r] = j ? limpar(j.soldAcab) : '';
      m['AF' + r] = j ? rel.laudoPorJunta(j) : '';
      tpl.setMany(p, m);
    }

    tpl.setMany(p, {
      'I41': rel.desc.numero, 'N41': rel.desc.tipo, 'T41': rel.desc.cota, 'AC41': rel.desc.comprimento,
      'F51': rel.obs,
      'C57': UI.dataBR(rel.data), 'N57': UI.dataBR(rel.data), 'AA57': UI.dataBR(rel.data)
    });
    /* nome na linha 56 e imagem sobre as linhas 54-55 (colunas A:K, L:W, X:AH) */
    aplicarAssinaturas(tpl, p, ['A56', 'L56', 'X56'], [
      { col: 1, linha: 54, colFim: 11, linhaFim: 55 },
      { col: 12, linha: 54, colFim: 23, linhaFim: 55 },
      { col: 24, linha: 54, colFim: 34, linhaFim: 55 }
    ]);
    marcarLaudo(tpl, p, ['G42', 'O42', 'W42'], rel.laudoFinal);
    return tpl.build();
  }

  async function blobRelatorioLP(rel) {
    var files = await Store.getTemplateFiles('for053');
    if (!files) throw new Error('Importe primeiro o modelo FOR-053 na aba Configurações.');
    var cfg = Store.config, lp = cfg.lp;
    var tpl = new XL.Template(files);
    var p = tpl.firstSheetPath();

    tpl.setMany(p, {
      'AJ1': rel.numero, 'AJ2': rel.folha, 'AJ3': UI.dataBR(rel.data),
      'E5': cfg.projeto.cliente, 'AF5': cfg.projeto.contrato,
      'H6': cfg.projeto.empreendimento || cfg.projeto.projeto,
      'G7': rel.equipamento, 'AB7': cfg.projeto.projeto, 'AJ7': cfg.projeto.local,
      'J8': lp.normas, 'AE8': lp.procedimento, 'AI8': lp.revisao,
      'J9': lp.criterio, 'AD9': cfg.projeto.localEnsaio,
      'E11': lp.material || rel.materialResumo, 'R11': lp.confProjeto, 'AH11': lp.condSuperficial,
      'H12': lp.tipoIluminacao, 'V12': lp.equipIluminacao, 'AI12': lp.intensLuminosa,
      'D15': lp.tipoPenetrante === 'I' ? 'X' : '',
      'N15': lp.tipoPenetrante === 'II' ? 'X' : '',
      'AA15': lp.metodoRemocao === 'A' ? 'X' : '',
      'AG15': lp.metodoRemocao === 'C' ? '(X' : '(',
      'A18': lp.solvMarca, 'E18': lp.solvLote,
      'J18': lp.penMarca, 'O18': lp.penLote,
      'S18': lp.remMarca, 'AA18': lp.remLote,
      'AG18': lp.revMarca, 'AK18': lp.revLote,
      'J22': lp.luximetro, 'P22': lp.luximetroCert,
      'AE22': lp.termometro, 'AL22': lp.termometroCert
    });

    for (var i = 0; i < 14; i++) {
      var r = 27 + i, j = rel.juntas[i], m = {};
      m['D' + r] = j ? limpar(j.linha) : '';
      m['O' + r] = j ? limpar(j.junta) : '';
      m['Q' + r] = j ? limpar(j.tipo) : '';
      m['S' + r] = j ? limpar(j.material) : '';
      m['Y' + r] = j ? limpar(j.diametro) : '';
      m['AC' + r] = j && rel.marcaRaiz(j) ? 'X' : '';
      m['AE' + r] = j && rel.marcaAcab(j) ? 'X' : '';
      m['AG' + r] = j ? rel.laudoPorJunta(j) : '';
      m['AI' + r] = j ? limpar(j.obs) : '';
      tpl.setMany(p, m);
    }

    tpl.setMany(p, {
      'L42': rel.desc.numero, 'Q42': rel.desc.tipo, 'Y42': rel.desc.cota, 'AI42': rel.desc.comprimento,
      'G52': rel.obs,
      'A58': 'Data: ' + UI.dataBR(rel.data),
      'N58': 'Data: ' + UI.dataBR(rel.data),
      'AB58': 'Data: ' + UI.dataBR(rel.data)
    });
    /* A55:M57, N55:AA57 e AB55:AL57 são blocos mesclados; a imagem cobre a parte de cima */
    aplicarAssinaturas(tpl, p, ['A55', 'N55', 'AB55'], [
      { col: 1, linha: 55, colFim: 13, linhaFim: 56 },
      { col: 14, linha: 55, colFim: 27, linhaFim: 56 },
      { col: 28, linha: 55, colFim: 38, linhaFim: 56 }
    ]);
    marcarLaudo(tpl, p, ['G43', 'O43', 'W43'], rel.laudoFinal);
    return tpl.build();
  }

  async function blobRelatorio(rel) {
    return rel.tipo === 'EVS' ? blobRelatorioEVS(rel) : blobRelatorioLP(rel);
  }

  async function zipRelatorios(rels) {
    var files = {};
    for (var i = 0; i < rels.length; i++) {
      var rel = rels[i];
      var blob = await blobRelatorio(rel);
      var buf = await blob.arrayBuffer();
      var nome = (rel.tipo === 'EVS' ? 'FOR-266_' : 'FOR-053_') + UI.slug(rel.numero) + '.xlsx';
      var n = 2;
      while (files[nome]) { nome = nome.replace(/(\.xlsx)$/, '_' + (n++) + '$1'); }
      files[nome] = new Uint8Array(buf);
    }
    return MZip.zip(files);
  }

  /* ---------------- modelos ---------------- */
  function extrairLogo(files) {
    var nomes = Object.keys(files).filter(function (p) { return /^xl\/media\/.+\.(jpe?g|png)$/i.test(p); });
    if (!nomes.length) return '';
    nomes.sort();
    var p = nomes[0], u8 = files[p];
    if (u8.length > 400000) return '';
    var mime = /\.png$/i.test(p) ? 'image/png' : 'image/jpeg';
    var CH = 0x8000, bin = '';
    for (var i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return 'data:' + mime + ';base64,' + btoa(bin);
  }

  async function importarModelo(id, file) {
    var buf = await UI.lerArrayBuffer(file);
    var wb = await XL.read(buf);
    var ok = await Store.setTemplate(id, file.name, wb.files);
    if (!Store.config.logo) {
      try {
        var logo = extrairLogo(wb.files);
        if (logo) { Store.config.logo = logo; Store.notificar('modelo'); }
      } catch (e) { /* logo é opcional */ }
    }
    return { ok: ok, planilhas: wb.sheets.map(function (s) { return s.name; }) };
  }

  global.Excel = {
    importarMapa: importarMapa,
    exportarMapa: exportarMapa,
    blobRelatorio: blobRelatorio,
    zipRelatorios: zipRelatorios,
    importarModelo: importarModelo,
    isoDeData: isoDeData,
    norm: norm
  };
})(window);

</script>
<script>
/* ============================================================
   relatorios.js - Geração e renderização dos relatórios
   FOR-266 (Ensaio Visual de Solda) e FOR-053 (Líquido Penetrante)
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el;

  /* ---------------- grade do formulário ---------------- */
  function b(span, cls, txt, rowSpan) {
    var d = el('div', { class: cls || '' });
    d.style.gridColumn = 'span ' + span;
    if (rowSpan) d.style.gridRow = 'span ' + rowSpan;
    if (txt !== undefined && txt !== null && txt !== '') d.textContent = String(txt);
    return d;
  }
  function bhtml(span, cls, html, rowSpan) {
    var d = b(span, cls, '', rowSpan);
    d.innerHTML = html;
    return d;
  }
  function add(frm, arr) { arr.forEach(function (x) { if (x) frm.appendChild(x); }); }
  function marca(on) { return on ? '<b>( X )</b>' : '(&nbsp;&nbsp;&nbsp;)'; }

  function cabecalho(titulo, formulario, rel, colunas) {
    var wrap = el('div', { class: 'frm c' + colunas });
    var logo = b(colunas === 34 ? 9 : 10, 'logo', '', 4);
    var lg = Store.config.logo;
    if (lg) logo.appendChild(el('img', { src: lg, alt: '' }));
    else { logo.appendChild(el('div', { text: 'LOGO' })); logo.appendChild(el('small', { text: 'EXECUTANTE' })); }
    var wv = colunas === 34 ? 4 : 3;
    add(wrap, [
      logo,
      b(colunas === 34 ? 18 : 22, 'title', titulo, 4),
      b(3, 'lbl', 'REL. N°'), b(wv, 'val ctr', rel.numero),
      b(3, 'lbl', 'FOLHA:'), b(wv, 'val ctr', rel.folha),
      b(3, 'lbl', 'DATA:'), b(wv, 'val ctr', UI.dataBR(rel.data)),
      b(colunas === 34 ? 7 : 6, 'hd2', formulario)
    ]);
    return wrap;
  }

  /** Quadro de assinatura: imagem (se houver) sobre o nome e o cargo. */
  function quadroAssinatura(span, nome, cargo, imagem) {
    var d = b(span, 'val box-sig');
    var bloco = el('div', { class: 'sig' });
    if (imagem) bloco.appendChild(el('img', { class: 'sig-img', src: imagem, alt: '' }));
    bloco.appendChild(el('div', { class: 'sig-linha' }));
    if (nome) bloco.appendChild(el('div', { class: 'sig-nome', text: nome }));
    if (cargo) bloco.appendChild(el('div', { class: 'sig-cargo', text: cargo }));
    d.appendChild(bloco);
    return d;
  }

  function rodape(larguras, rel) {
    var a = Store.config.assinaturas;
    return [
      b(larguras[0], 'hd', 'INSPETOR'),
      b(larguras[1], 'hd', 'SUP. CONTROLE DE QUALIDADE'),
      b(larguras[2], 'hd', 'CLIENTE / FISCALIZAÇÃO'),
      quadroAssinatura(larguras[0], a.inspetor, a.cargoInspetor, a.imgInspetor),
      quadroAssinatura(larguras[1], a.supervisor, a.cargoSupervisor, a.imgSupervisor),
      quadroAssinatura(larguras[2], a.clienteFisc, a.cargoClienteFisc, a.imgClienteFisc),
      b(larguras[0], 'val', 'Data: ' + UI.dataBR(rel.data)),
      b(larguras[1], 'val', 'Data: ' + UI.dataBR(rel.data)),
      b(larguras[2], 'val', 'Data: ' + UI.dataBR(rel.data))
    ];
  }

  function laudoFinalRow(colunas, rel) {
    var lf = rel.laudoFinal;
    var w = colunas === 34 ? [5, 8, 8, 13] : [6, 9, 9, 14];
    return [
      b(w[0], 'lbl', 'LAUDO FINAL:'),
      bhtml(w[1], 'val ctr', marca(lf === 'APR') + ' <b>APROVADO</b>'),
      bhtml(w[2], 'val ctr', marca(lf === 'REP') + ' <b>REPROVADO</b>'),
      bhtml(w[3], 'val ctr', marca(lf === 'COMP') + ' RECOMENDAÇÃO DE EXAME COMPLEMENTAR')
    ];
  }

  /* ============================================================
     FOR-266
     ============================================================ */
  function htmlEVS(rel) {

    var f = el('div', { class: 'frm c34' });
    add(f, [
      b(5, 'lbl', 'CLIENTE:'), b(8, 'val', cfg.projeto.cliente),
      b(4, 'lbl', 'CONTRATO:'), b(5, 'val', cfg.projeto.contrato),
      b(4, 'lbl', 'LOCAL:'), b(8, 'val', cfg.projeto.local),

      b(6, 'lbl', 'EQUIPAMENTO:'), b(11, 'val', rel.equipamento),
      b(6, 'lbl', 'LOCAL DO ENSAIO:'), b(11, 'val', cfg.projeto.localEnsaio),

      b(4, 'lbl', 'PROJETO:'), b(10, 'val', cfg.projeto.projeto),

      b(2, 'lbl', 'REV.'), b(2, 'val ctr', rel.revDoc),

      b(6, 'lbl', 'PROCEDIMENTO:'), b(7, 'val', cfg.evs.procedimento),

      b(7, 'lbl', 'MATERIAL DE BASE:'), b(11, 'val', cfg.evs.materialBase || rel.materialResumo),

      b(5, 'lbl', 'ILUMINAÇÃO E MÉTODO:'), b(6, 'val', cfg.evs.iluminacaoMetodo),
      b(4, 'lbl', 'INTENSIDADE DA LUZ (LUX)'), b(4, 'val ctr', cfg.evs.intensidadeLux),

      b(34, 'lbl', 'REGISTRO DOS RESULTADOS:'),

      b(9, 'hd', 'ISOMÉTRICO / LINHA', 2),
      b(3, 'hd', 'JUNTA N°', 2),
      b(2, 'hd', 'Ø (in)', 2),
      b(2, 'hd', 'SCH', 2),

    ]);

    for (var i = 0; i < 16; i++) {
      var j = rel.juntas[i];
      add(f, [
        b(9, 'val data-cel', j ? j.linha : ''),
        b(3, 'val ctr data-cel', j ? j.junta : ''),
        b(2, 'val ctr data-cel', j ? j.diametro : ''),
        b(2, 'val ctr data-cel', j ? j.sch : ''),
        b(2, 'val ctr data-cel', j ? j.tipo : ''),
        b(3, 'val ctr data-cel', j ? j.material : ''),
        b(4, 'val ctr data-cel', j ? (j.ieis && j.ieis !== 'N/A' ? j.ieis : j.eps) : ''),
        b(3, 'val ctr data-cel', j ? j.soldRaiz : ''),
        b(3, 'val ctr data-cel', j ? j.soldAcab : ''),
        b(3, 'val ctr data-cel', j ? rel.laudoPorJunta(j) : '')
      ]);
    }

    add(f, [
      b(6, 'lbl', 'DESCONTINUIDADES:'),
      b(2, 'lbl', 'N°:'), b(3, 'val ctr', rel.desc.numero),
      b(2, 'lbl', 'TIPO:'), b(4, 'val ctr', rel.desc.tipo),
      b(2, 'lbl', 'COTA:'), b(4, 'val ctr', rel.desc.cota),
      b(5, 'lbl', 'COMPRIMENTO:'), b(6, 'val ctr', rel.desc.comprimento)
    ]);
    add(f, laudoFinalRow(34, rel));
    add(f, [
      b(3, 'lbl', 'CROQUI:'), b(31, 'val', ''),
      b(34, 'val box-big', rel.croqui || ''),
      b(5, 'lbl', 'OBSERVAÇÕES:'), b(29, 'val box-obs', rel.obs)
    ]);
    add(f, rodape([11, 12, 11], rel));

    sheet.appendChild(f);
    return sheet;
  }

  /* ============================================================
     FOR-053
     ============================================================ */
  function htmlLP(rel) {
    var cfg = Store.config, lp = cfg.lp;
    var sheet = el('div', { class: 'sheet' });
    sheet.appendChild(cabecalho('Relatório de Ensaio Não Destrutivo — LÍQUIDO PENETRANTE', 'FOR-053 Rev.D', rel, 38));

    var f = el('div', { class: 'frm c38' });
    add(f, [
      b(4, 'lbl', 'CLIENTE:'), b(21, 'val', cfg.projeto.cliente),
      b(6, 'lbl', 'CONTRATO:'), b(7, 'val', cfg.projeto.contrato),

      b(7, 'lbl', 'EMPREENDIMENTO:'), b(31, 'val', cfg.projeto.empreendimento || cfg.projeto.projeto),

      b(6, 'lbl', 'EQUIPAMENTO:'), b(15, 'val', rel.equipamento),
      b(6, 'lbl', 'PROJETO:'), b(5, 'val', cfg.projeto.projeto),
      b(3, 'lbl', 'LOCAL:'), b(3, 'val', cfg.projeto.local),

      b(9, 'lbl', 'NORMAS DE REFERÊNCIA:'), b(10, 'val', lp.normas),
      b(7, 'lbl', 'PROCEDIMENTO:'), b(5, 'val', lp.procedimento),
      b(4, 'lbl', 'REVISÃO:'), b(3, 'val ctr', lp.revisao),

      b(9, 'lbl', 'CRITÉRIO DE ACEITAÇÃO:'), b(12, 'val', lp.criterio),
      b(8, 'lbl', 'LOCAL DO ENSAIO:'), b(9, 'val', cfg.projeto.localEnsaio),

      b(4, 'lbl', 'MATERIAL:'), b(8, 'val', lp.material || rel.materialResumo),
      b(5, 'lbl', 'ESPESSURA:'), b(7, 'val', lp.espessura || rel.espessuraResumo),
      b(9, 'lbl', 'COND. SUPERFICIAL:'), b(5, 'val', lp.condSuperficial),

      b(7, 'lbl', 'TIPO DE ILUMINAÇÃO:'), b(6, 'val', lp.tipoIluminacao),
      b(8, 'lbl', 'EQUIP. DE ILUMINAÇÃO:'), b(6, 'val', lp.equipIluminacao),
      b(7, 'lbl', 'INTENS. LUMINOSA:'), b(4, 'val ctr', lp.intensLuminosa),

      b(38, 'hd', 'MATERIAIS PENETRANTES'),
      bhtml(19, 'val', '<b>TIPO:</b>&nbsp; ' + marca(lp.tipoPenetrante === 'I') + ' FLUORESCENTE (I) &nbsp;&nbsp; ' +
        marca(lp.tipoPenetrante === 'II') + ' VISÍVEL (II)'),
      bhtml(19, 'val', '<b>MÉT. REMOÇÃO:</b>&nbsp; ' + marca(lp.metodoRemocao === 'A') + ' ÁGUA (A) &nbsp;&nbsp; ' +
        marca(lp.metodoRemocao === 'C') + ' SOLVENTE (C)'),

      b(9, 'hd', 'SOLVENTE'), b(9, 'hd', 'PENETRANTE'), b(14, 'hd', 'REMOVEDOR'), b(6, 'hd', 'REVELADOR'),
      b(4, 'hd2', 'MARCA'), b(5, 'hd2', 'LOTE'),
      b(5, 'hd2', 'MARCA'), b(4, 'hd2', 'LOTE'),
      b(8, 'hd2', 'MARCA'), b(6, 'hd2', 'LOTE'),
      b(4, 'hd2', 'MARCA'), b(2, 'hd2', 'LOTE'),
      b(4, 'val ctr', lp.solvMarca), b(5, 'val ctr', lp.solvLote),
      b(5, 'val ctr', lp.penMarca), b(4, 'val ctr', lp.penLote),
      b(8, 'val ctr', lp.remMarca), b(6, 'val ctr', lp.remLote),
      b(4, 'val ctr', lp.revMarca), b(2, 'val ctr', lp.revLote),

      b(38, 'hd', 'INSTRUMENTOS / EQUIPAMENTOS UTILIZADOS'),
      bhtml(9, 'val', marca(!!lp.luximetro) + ' <b>LUXÍMETRO N°</b>'), b(3, 'val ctr', lp.luximetro),
      b(3, 'lbl', 'CERT. N°'), b(5, 'val ctr', lp.luximetroCert),
      bhtml(10, 'val', marca(!!lp.termometro) + ' <b>TERMÔMETRO N°</b>'), b(3, 'val ctr', lp.termometro),
      b(3, 'lbl', 'CERT. N°'), b(2, 'val ctr', lp.termometroCert),

      b(38, 'hd', 'REGISTRO DE RESULTADOS'),

      b(3, 'hd', 'ITEM', 2),
      b(11, 'hd', 'DESENHO / ISOMÉTRICO', 2),
      b(14, 'hd', 'IDENTIFICAÇÃO DA JUNTA'),
      b(4, 'hd', 'LOCAL ENSAIO'),
      b(2, 'hd', 'LAUDO', 2),
      b(4, 'hd', 'OBSERVAÇÕES / DESCONTINUIDADES', 2),
      b(2, 'hd2', 'JUNTA'), b(2, 'hd2', 'TIPO'), b(6, 'hd2', 'MATERIAL'), b(4, 'hd2', 'Ø (in)'),
      b(2, 'hd2', 'RAIZ'), b(2, 'hd2', 'E/A')
    ]);

    for (var i = 0; i < 14; i++) {
      var j = rel.juntas[i];
      add(f, [
        b(3, 'val ctr data-cel', ('0' + (i + 1)).slice(-2)),
        b(11, 'val data-cel', j ? j.linha : ''),
        b(2, 'val ctr data-cel', j ? j.junta : ''),
        b(2, 'val ctr data-cel', j ? j.tipo : ''),
        b(6, 'val ctr data-cel', j ? j.material : ''),
        b(4, 'val ctr data-cel', j ? j.diametro : ''),
        b(2, 'val ctr data-cel', j && rel.marcaRaiz(j) ? 'X' : ''),
        b(2, 'val ctr data-cel', j && rel.marcaAcab(j) ? 'X' : ''),
        b(2, 'val ctr data-cel', j ? rel.laudoPorJunta(j) : ''),
        b(4, 'val data-cel', j ? j.obs : '')
      ]);
    }

    add(f, [
      b(9, 'lbl', 'DESCONTINUIDADES:'),
      b(2, 'lbl', 'N°:'), b(3, 'val ctr', rel.desc.numero),
      b(2, 'lbl', 'TIPO:'), b(3, 'val ctr', rel.desc.tipo),
      b(5, 'lbl', 'COTA:'), b(5, 'val ctr', rel.desc.cota),
      b(5, 'lbl', 'COMPRIMENTO:'), b(4, 'val ctr', rel.desc.comprimento)
    ]);
    add(f, laudoFinalRow(38, rel));
    add(f, [
      b(4, 'lbl', 'CROQUI:'), b(34, 'val', ''),
      b(38, 'val box-big', rel.croqui || ''),
      b(6, 'lbl', 'OBSERVAÇÕES:'), b(32, 'val box-obs', rel.obs)
    ]);
    add(f, rodape([13, 14, 11], rel));

    sheet.appendChild(f);
    return sheet;
  }

  /* ============================================================
     GERAÇÃO
     ============================================================ */
  function unicos(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { v = String(v || '').trim(); if (v && v !== 'N/A' && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  function dataValida(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')); }
  function numeroValido(v) {
    var s = String(v || '').trim();
    if (!s) return false;
    var n = Store.normalizar(s);
    return n !== 'N/A' && n !== 'NA' && !/FALTA|PENDENTE/.test(n);
  }

  function montar(tipo, grupo, indice, ctx) {
    var juntas = grupo.juntas;
    var ov = (Store.estado.overrides || {})[grupo.chave] || {};

    var datas = juntas.map(function (j) {
      return ctx.camposData.map(function (k) { return j[k]; }).filter(dataValida)[0];
    }).filter(Boolean).sort();

    var reprovada = juntas.some(function (j) { return Store.situacao(j) === 'reprovado'; });

    var rel = {
      tipo: tipo,
      passe: grupo.passe || null,
      chave: grupo.chave,
      indice: indice,
      juntas: juntas,
      numero: ov.numero || (numeroValido(grupo.numero) ? grupo.numero : Store.numeroRelatorio(tipo, indice)),
      folha: '1/1',
      data: ov.data || datas[0] || UI.hoje(),
      docRef: ov.docRef || unicos(juntas.map(function (j) { return j.linha; })).join(' / '),
      revDoc: ov.revDoc || (juntas[0].revLinha || ''),
      /* '' escolhido à mão é diferente de "nunca escolhido" */
      equipamento: ov.equipamento !== undefined ? ov.equipamento : (Store.config.projeto.equipamento || ''),
      materialResumo: unicos(juntas.map(function (j) { return j.material; })).join(' / '),
      espessuraResumo: unicos(juntas.map(function (j) { return j.sch; })).join(' / '),
      laudoFinal: ov.laudoFinal || (reprovada ? 'REP' : 'APR'),
      desc: ov.desc || { numero: '', tipo: '', cota: '', comprimento: '' },
      obs: ov.obs !== undefined ? ov.obs : unicos(juntas.map(function (j) { return j.obs; })).join(' | '),
      croqui: ov.croqui || '',
      _passes: grupo.passes || null
    };

    rel.laudoPorJunta = function (j) {
      if (Store.situacao(j) === 'reprovado') return 'REP';
      if (Store.situacao(j) === 'cancelado') return 'CANC';
      var algum = ctx.ensaios.some(function (id) { return Store.estadoEnsaio(j, id) === 'ok'; });
      return algum ? 'APR' : '';
    };
    rel.marcaRaiz = function (j) {
      if (!rel._passes) return true;
      var p = rel._passes[j._id];
      return !!(p && p.R);
    };
    rel.marcaAcab = function (j) {
      if (!rel._passes) return false;
      var p = rel._passes[j._id];
      return !!(p && p.A);
    };
    return rel;
  }

  /** Agrupa por número de relatório já lançado no mapa; sem número, uma junta por relatório. */
  function agrupar(entradas, agruparPorNumero, max) {
    var mapa = {}, ordem = [];
    entradas.forEach(function (e, idx) {
      var num = numeroValido(e.numero) ? String(e.numero).trim() : '';
      var chave = (agruparPorNumero && num) ? 'n:' + num : 'j:' + e.junta._id + ':' + idx;
      if (!mapa[chave]) {
        mapa[chave] = { chave: chave, numero: num, juntas: [], passes: {}, ids: {} };
        ordem.push(chave);
      }
      var g = mapa[chave];
      if (!g.ids[e.junta._id]) { g.ids[e.junta._id] = true; g.juntas.push(e.junta); }
      if (e.passe) {
        if (!g.passes[e.junta._id]) g.passes[e.junta._id] = {};
        if (e.passe === 'LPR') g.passes[e.junta._id].R = true;
        if (e.passe === 'LPA') g.passes[e.junta._id].A = true;
      }
    });

    /* quebra grupos maiores que o formulário comporta */
    var out = [];
    ordem.forEach(function (k) {
      var g = mapa[k];
      for (var i = 0; i < g.juntas.length; i += max) {
        var fatia = g.juntas.slice(i, i + max);
        out.push({
          chave: g.chave + (i ? '#' + (i / max + 1) : ''),
          numero: g.numero, juntas: fatia, passes: g.passes
        });
      }
    });
    return out;
  }

  function gerar(tipo) {
    var cfg = Store.config;
    var agr = cfg.relatorios.agruparPorNumero;
    var juntas = Store.juntasPreenchidas();
    var entradas = [], ctx;

    if (tipo === 'EVS') {
      ctx = { ensaios: ['VS'], camposData: ['dataVS'] };
      juntas.forEach(function (j) {
        if (!Store.exigeEnsaio(j, 'VS')) return;
        entradas.push({ junta: j, numero: j.relVS, passe: null });
      });
      return agrupar(entradas, agr, cfg.relatorios.maxLinhasEVS)
        .map(function (g, i) { return montar('EVS', g, i, ctx); });
    }

    ctx = { ensaios: ['LPR', 'LPA'], camposData: ['dataLPR', 'dataLPA'] };
    juntas.forEach(function (j) {
      if (Store.exigeEnsaio(j, 'LPR')) entradas.push({ junta: j, numero: j.relLPR, passe: 'LPR' });
      if (Store.exigeEnsaio(j, 'LPA')) entradas.push({ junta: j, numero: j.relLPA, passe: 'LPA' });
    });
    return agrupar(entradas, agr, cfg.relatorios.maxLinhasLP)
      .map(function (g, i) { return montar('LP', g, i, ctx); });
  }

  function salvarOverride(rel, campos) {
    if (!Store.estado.overrides) Store.estado.overrides = {};
    var ov = Store.estado.overrides[rel.chave] || {};
    for (var k in campos) ov[k] = campos[k];
    Store.estado.overrides[rel.chave] = ov;
    Store.notificar('relatorio');
  }

  function html(rel) { return rel.tipo === 'EVS' ? htmlEVS(rel) : htmlLP(rel); }

  global.Relatorios = {
    gerar: gerar, html: html, htmlEVS: htmlEVS, htmlLP: htmlLP,
    salvarOverride: salvarOverride, numeroValido: numeroValido
  };
})(window);

</script>
<script>
/* ============================================================
   print.js - Geração das folhas para impressão / PDF
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el;

  function raiz() {
    var r = document.getElementById('print-root');
    if (!r) { r = el('div', { id: 'print-root' }); document.body.appendChild(r); }
    UI.clear(r);
    return r;
  }

  function orientacao(modo) {
    var s = document.getElementById('pageOrient');
    if (!s) { s = el('style', { id: 'pageOrient' }); document.head.appendChild(s); }
    s.textContent = '@media print { @page { size: A4 ' + modo + '; margin: 6mm; } }';
  }

  function disparar() {
    setTimeout(function () {
      window.print();
    }, 120);
  }

  /* ---------------- Mapa de juntas ---------------- */
  function mapa(juntas, opcoes) {
    opcoes = opcoes || {};
    var porPagina = opcoes.porPagina || 24;
    var cfg = Store.config;
    var r = raiz();
    orientacao('landscape');

    var cols = (opcoes.colunas && opcoes.colunas.length) ? opcoes.colunas : Store.COLS;
    var paginas = Math.max(1, Math.ceil(juntas.length / porPagina));

    for (var p = 0; p < paginas; p++) {
      var fatia = juntas.slice(p * porPagina, (p + 1) * porPagina);
      var sheet = el('div', { class: 'sheet landscape map-sheet' });

      var tab = el('table', { class: 'map-print' });
      var thead = el('thead');
      var meio = Math.max(1, cols.length - 4);

      thead.appendChild(el('tr', null, [
        el('th', {
          colspan: 3, rowspan: 3, style: { width: '12%' }
        }, [cfg.logo
          ? el('img', { src: cfg.logo, style: { maxHeight: '32px', maxWidth: '100%' } })
          : el('span', { text: 'MAPA DE JUNTAS' })]),
        el('th', { colspan: meio, class: 'hdr-title', text: 'CONTROLE DE TUBULAÇÃO — SITUAÇÃO GERAL DE JUNTAS' }),
        el('th', { text: 'Folha ' + (p + 1) + '/' + paginas })
      ]));
      thead.appendChild(el('tr', null, [
        el('th', { colspan: meio, class: 'lft', text: 'Cliente: ' + (cfg.projeto.cliente || '—') + '   ·   Contrato: ' + (cfg.projeto.contrato || '—') }),
        el('th', { text: 'Juntas: ' + juntas.length })
      ]));
      thead.appendChild(el('tr', null, [
        el('th', { colspan: meio, class: 'lft', text: 'Projeto: ' + (cfg.projeto.projeto || '—') + '   ·   Emissão: ' + UI.dataBR(UI.hoje()) }),
        el('th', { text: 'PD: ' + Store.formatarPD(Store.somaPolegadas(juntas)) + '"' })
      ]));

      var l1 = el('tr'), l2 = el('tr');
      var i = 0;
      while (i < cols.length) {
        var c = cols[i];
        if (c.grp) {
          var n = 0;
          while (i + n < cols.length && cols[i + n].grp === c.grp) n++;
          l1.appendChild(el('th', { colspan: n, text: c.grp }));
          for (var k = 0; k < n; k++) l2.appendChild(el('th', { text: cols[i + k].h }));
          i += n;
        } else {
          l1.appendChild(el('th', { rowspan: 2, text: c.h }));
          i++;
        }
      }
      thead.appendChild(l1);
      thead.appendChild(l2);
      tab.appendChild(thead);

      var tb = el('tbody');
      fatia.forEach(function (j) {
        var tr = el('tr');
        cols.forEach(function (c) {
          var v = c.calc ? Store.situacaoCalculada(j) : (j[c.k] || '');
          if (c.type === 'date') v = UI.dataBR(v);
          tr.appendChild(el('td', {
            class: (c.k === 'linha' || c.k === 'obs' || c.k === 'classeInsp' || c.k === 'empresa') ? 'lft' : '',
            text: v
          }));
        });
        tb.appendChild(tr);
      });
      tab.appendChild(tb);
      sheet.appendChild(tab);
      r.appendChild(sheet);
    }
    disparar();
  }

  /* ---------------- Relatórios ---------------- */
  function relatorios(rels) {
    var r = raiz();
    orientacao('portrait');
    rels.forEach(function (rel) { r.appendChild(Relatorios.html(rel)); });
    disparar();
  }

  /* ---------------- Dashboard ---------------- */
  function dashboard(node) {
    var r = raiz();
    orientacao('portrait');
    var sheet = el('div', { class: 'sheet' });
    var clone = node.cloneNode(true);
    clone.style.background = '#fff';
    sheet.appendChild(el('h2', {
      text: 'PAINEL DE CONTROLE — ' + (Store.config.projeto.projeto || 'Mapa de Juntas'),
      style: { fontSize: '13pt', margin: '0 0 4mm' }
    }));
    sheet.appendChild(clone);
    r.appendChild(sheet);
    disparar();
  }

  global.Print = { mapa: mapa, relatorios: relatorios, dashboard: dashboard, raiz: raiz };
})(window);

</script>
<script>
/* ============================================================
   ui-mapa.js - Grade interativa do mapa de juntas
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el, $ = UI.$;
  var root, tbody, thead, dlWrap;
  var busca = '', filtroSituacao = '', filtroPendencia = false;
  var filtroExterno = null, filtroExternoRotulo = '';
  var visiveis = [];
  var gruposOcultos = {};
  var dataRef = UI.hoje();

  var KEY_GRUPOS = 'mapaJuntas.gruposOcultos';
  var KEY_DATAREF = 'mapaJuntas.dataRef';

  var PRESETS = {
    completo: [],
    campo: ['Identificação', 'Linha', 'Inspeção', 'Procedimentos', 'Pintura', 'PMI', 'Teste hidrostático'],
    ensaios: ['Identificação', 'Linha', 'Inspeção', 'Procedimentos', 'Pintura']
  };

  /* ---------------- montagem ---------------- */
  function montar(container) {
    root = container;
    UI.clear(root);
    root.classList.add('view-grid');   /* a rolagem fica dentro da grade */

    try {
      gruposOcultos = JSON.parse(localStorage.getItem(KEY_GRUPOS) || '{}');
      dataRef = localStorage.getItem(KEY_DATAREF) || UI.hoje();
    } catch (e) { gruposOcultos = {}; }

    root.appendChild(barra());

    dlWrap = el('div', { style: { display: 'none' } });
    root.appendChild(dlWrap);

    var wrap = el('div', { class: 'grid-wrap', id: 'gridWrap' });
    var tb = el('table', { class: 'grid', id: 'gridTable' });
    thead = el('thead');
    tbody = el('tbody');
    tb.appendChild(thead); tb.appendChild(tbody);
    wrap.appendChild(tb);
    root.appendChild(wrap);

    montarDatalists(true);
    montarCabecalho();
    render();
  }

  function barra() {
    var b = el('div', { class: 'toolbar' });

    b.appendChild(el('button', { class: 'btn primary', text: '+ Junta', onclick: function () { adicionar(1); } }));
    b.appendChild(el('button', { class: 'btn', text: '+ 10', onclick: function () { adicionar(10); } }));
    b.appendChild(el('span', { class: 'sep' }));

    b.appendChild(el('button', { class: 'btn', text: 'Importar Excel', onclick: importar }));
    b.appendChild(el('button', { class: 'btn', text: 'Exportar Excel', onclick: exportar }));
    b.appendChild(el('button', { class: 'btn', text: 'Imprimir / PDF', onclick: imprimir }));
    b.appendChild(el('span', { class: 'sep' }));
    b.appendChild(el('button', { class: 'btn', text: 'Colunas…', onclick: escolherColunas }));
    b.appendChild(el('span', { class: 'sep' }));

    var dr = el('input', {
      type: 'date', value: dataRef, title: 'Data usada ao preencher automaticamente os campos de data',
      onchange: function () { dataRef = this.value; localStorage.setItem(KEY_DATAREF, dataRef); }
    });
    b.appendChild(el('label', { class: 'field-inline' }, [el('span', { text: 'Data de referência' }), dr]));
    b.appendChild(el('span', {
      class: 'status-chip',
      title: 'Em qualquer campo de data vazio: Enter ou duplo clique preenche com a data de referência. Ctrl+D copia o valor da linha de cima.',
      text: '↵ preenche a data'
    }));

    b.appendChild(el('span', { class: 'sep' }));
    b.appendChild(el('label', { class: 'field-inline' }, [
      el('input', {
        type: 'search', placeholder: 'Buscar linha, spool, junta, sinete…', style: { width: '230px' },
        oninput: function () { busca = this.value.trim().toLowerCase(); render(); }
      })
    ]));

    var sel = el('select', { onchange: function () { filtroSituacao = this.value; render(); } }, [
      el('option', { value: '', text: 'Todas as situações' })
    ]);
    Store.SITUACOES.forEach(function (s) {
      sel.appendChild(el('option', { value: s.k, text: s.icone + ' ' + s.label }));
    });
    b.appendChild(sel);

    b.appendChild(el('label', { class: 'chk' }, [
      el('input', { type: 'checkbox', onchange: function () { filtroPendencia = this.checked; render(); } }),
      el('span', { text: 'Só com pendência' })
    ]));

    var chip = chipRecorte();
    if (chip) { b.appendChild(el('span', { class: 'sep' })); b.appendChild(chip); }

    b.appendChild(el('span', { class: 'spacer' }));
    b.appendChild(el('span', { class: 'status-chip', id: 'mapaResumo' }));
    b.appendChild(el('button', { class: 'btn danger sm', text: 'Limpar', onclick: limparTudo }));
    return b;
  }

  /* ---------------- colunas visíveis ---------------- */
  function colunasVisiveis() {
    return Store.COLS.filter(function (c) { return !c.grp || !gruposOcultos[c.grp]; });
  }

  function escolherColunas() {
    var box = el('div');
    box.appendChild(el('div', { class: 'hint', style: { marginBottom: '10px' }, text: 'Escolha os grupos de colunas exibidos na grade. A exportação para Excel sempre inclui todas.' }));

    var presets = el('div', { style: { display: 'flex', gap: '6px', marginBottom: '12px', flexWrap: 'wrap' } });
    [['completo', 'Tudo'], ['ensaios', 'Foco em ensaios'], ['campo', 'Foco em campo']].forEach(function (p) {
      presets.appendChild(el('button', {
        class: 'btn sm', text: p[1],
        onclick: function () {
          gruposOcultos = {};
          PRESETS[p[0]].forEach(function (g) { gruposOcultos[g] = true; });
          salvarGrupos();
          UI.clear(box.parentNode); box.parentNode.appendChild(escolherColunasCorpo());
          montarCabecalho(); render();
        }
      }));
    });
    box.appendChild(presets);
    box.appendChild(lista());

    function lista() {
      var l = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '6px' } });
      Store.GRUPOS.forEach(function (g) {
        l.appendChild(el('label', { class: 'chk' }, [
          el('input', {
            type: 'checkbox', checked: !gruposOcultos[g] ? true : null,
            onchange: function () {
              if (this.checked) delete gruposOcultos[g]; else gruposOcultos[g] = true;
              salvarGrupos(); montarCabecalho(); render();
            }
          }),
          el('span', { text: g })
        ]));
      });
      return l;
    }
    function escolherColunasCorpo() { return box; }

    UI.modal('Colunas exibidas', box, [{ label: 'Fechar', class: 'primary' }]);
  }

  function salvarGrupos() {
    try { localStorage.setItem(KEY_GRUPOS, JSON.stringify(gruposOcultos)); } catch (e) { }
  }

  /* As sugestões varrem o mapa inteiro; a reconstrução só acontece em
     tempo ocioso e no máximo a cada 3 s, senão trava ao digitar. */
  var dlTimer = null;
  function montarDatalists(agora) {
    if (!dlWrap) return;
    if (!agora) {
      clearTimeout(dlTimer);
      dlTimer = setTimeout(function () {
        if (typeof requestIdleCallback === 'function') requestIdleCallback(function () { montarDatalists(true); }, { timeout: 5000 });
        else montarDatalists(true);
      }, 3000);
      return;
    }
    clearTimeout(dlTimer);
    UI.clear(dlWrap);
    Store.COLS.forEach(function (c) {
      if (!c.sug) return;
      var dl = el('datalist', { id: 'dl-' + c.k });
      Store.sugestoes(c.k).slice(0, 250).forEach(function (v) { dl.appendChild(el('option', { value: v })); });
      dlWrap.appendChild(dl);
    });
  }

  function montarCabecalho() {
    UI.clear(thead);
    var cols = colunasVisiveis();
    var l1 = el('tr'), l2 = el('tr');

    l1.appendChild(el('th', { class: 'rownum', rowspan: 2, text: '#' }));
    l1.appendChild(el('th', { rowspan: 2, text: '!', title: 'Pendências de ensaio', style: { minWidth: '40px' } }));

    var i = 0;
    while (i < cols.length) {
      var c = cols[i];
      if (c.grp) {
        var n = 0;
        while (i + n < cols.length && cols[i + n].grp === c.grp) n++;
        l1.appendChild(el('th', { colspan: n, text: c.grp }));
        for (var k = 0; k < n; k++) l2.appendChild(el('th', { text: cols[i + k].h, style: { minWidth: cols[i + k].w + 'px' } }));
        i += n;
      } else {
        l1.appendChild(el('th', { rowspan: 2, text: c.h, class: c.extra ? 'extra' : '', style: { minWidth: c.w + 'px' } }));
        i++;
      }
    }
    l1.appendChild(el('th', { rowspan: 2, text: '', style: { minWidth: '62px' } }));
    thead.appendChild(l1);
    thead.appendChild(l2);
  }

  /* ---------------- render ---------------- */
  function filtrar() {
    return Store.juntas.filter(function (j) {
      if (filtroExterno && !filtroExterno(j)) return false;
      if (filtroSituacao && Store.situacao(j) !== filtroSituacao) return false;
      if (filtroPendencia && !Store.pendencias(j).length) return false;
      if (!busca) return true;
      return Store.COLS.some(function (c) {
        return String(j[c.k] || '').toLowerCase().indexOf(busca) >= 0;
      });
    });
  }

  /** Recebe o recorte vindo do painel ("Ver no mapa"). */
  function filtrarPor(pred, rotulo) {
    filtroExterno = pred;
    filtroExternoRotulo = rotulo || 'recorte do painel';
    if (root) montar(root);
  }

  function chipRecorte() {
    if (!filtroExterno) return null;
    return el('button', {
      class: 'chipf on', title: 'Remover o recorte trazido do painel',
      onclick: function () { filtroExterno = null; filtroExternoRotulo = ''; montar(root); }
    }, [
      document.createTextNode('Painel · ' + filtroExternoRotulo),
      el('span', { class: 'x', text: '×' })
    ]);
  }

  /* ============================================================
     Renderização virtualizada — o mapa real tem milhares de linhas,
     então só a janela visível vai para o DOM.
     ============================================================ */
  var ALTURA_LINHA = 30;
  var BUFFER = 8;
  var janelaIni = -1, janelaFim = -1;
  var espacadorTopo, espacadorBase;

  function render() {
    if (!tbody) return;
    visiveis = filtrar();
    janelaIni = janelaFim = -1;
    UI.clear(tbody);
    var cols = colunasVisiveis();

    if (!visiveis.length) {
      tbody.appendChild(el('tr', null, [
        el('td', { colspan: cols.length + 3 }, [
          el('div', { class: 'empty' }, [
            el('h3', { text: Store.juntas.length ? 'Nenhuma junta corresponde ao filtro' : 'Mapa de juntas vazio' }),
            el('p', {
              text: Store.juntas.length
                ? 'Ajuste a busca ou os filtros acima.'
                : 'Traga a planilha que você já usa ou comece uma junta de cada vez.'
            }),
            Store.juntas.length ? null : el('div', { style: { display: 'flex', gap: '8px', justifyContent: 'center', marginTop: '14px' } }, [
              el('button', { class: 'btn primary', text: 'Importar do Excel', onclick: importar }),
              el('button', { class: 'btn', text: '+ Primeira junta', onclick: function () { adicionar(1); } })
            ])
          ])
        ])
      ]));
      atualizarResumo();
      return;
    }

    espacadorTopo = el('tr', { class: 'spacer-row' }, [el('td', { colspan: cols.length + 3 })]);
    espacadorBase = el('tr', { class: 'spacer-row' }, [el('td', { colspan: cols.length + 3 })]);
    tbody.appendChild(espacadorTopo);
    tbody.appendChild(espacadorBase);

    var wrap = $('#gridWrap');
    if (wrap && !wrap._virt) {
      wrap._virt = true;
      wrap.addEventListener('scroll', function () {
        if (wrap._raf) return;
        wrap._raf = requestAnimationFrame(function () { wrap._raf = null; renderJanela(); });
      });
    }
    renderJanela(true);
    atualizarResumo();
  }

  function renderJanela(forcar) {
    var wrap = $('#gridWrap');
    if (!wrap || !visiveis.length || !espacadorTopo) return;

    /* o cabeçalho é sticky e cobre o topo, então a primeira linha
       visível é medida direto pelo scrollTop */
    var altura = wrap.clientHeight || 600;
    var ini = Math.max(0, Math.floor(wrap.scrollTop / ALTURA_LINHA) - BUFFER);
    var qtd = Math.ceil(altura / ALTURA_LINHA) + BUFFER * 2;
    var fim = Math.min(visiveis.length, ini + qtd);

    if (!forcar && ini === janelaIni && fim === janelaFim) return;
    janelaIni = ini; janelaFim = fim;

    /* remove as linhas atuais (mantém os espaçadores) */
    var n = espacadorTopo.nextSibling;
    while (n && n !== espacadorBase) {
      var prox = n.nextSibling;
      tbody.removeChild(n);
      n = prox;
    }

    espacadorTopo.firstChild.style.height = (ini * ALTURA_LINHA) + 'px';
    espacadorBase.firstChild.style.height = ((visiveis.length - fim) * ALTURA_LINHA) + 'px';

    var cols = colunasVisiveis();
    var frag = document.createDocumentFragment();
    for (var i = ini; i < fim; i++) frag.appendChild(linha(visiveis[i], i, cols));
    tbody.insertBefore(frag, espacadorBase);
  }

  function linha(j, idx, cols) {
    var sit = Store.situacao(j);
    var tr = el('tr', { class: 'sit-' + sit });

    tr.appendChild(el('td', { class: 'rownum', text: String(idx + 1) }));

    var pend = Store.pendencias(j);
    tr.appendChild(el('td', {
      title: pend.length ? 'Pendente: ' + pend.map(function (e) { return e.nome; }).join(', ') : 'Sem pendências',
      style: { color: pend.length ? 'var(--warning)' : 'var(--good)', fontWeight: '700', fontSize: '11px' },
      text: pend.length ? String(pend.length) : '✓'
    }));

    cols.forEach(function (c) {
      var td = el('td', {
        class: (c.extra ? 'extra ' : '') + (c.list || c.type === 'date' || c.calc ? '' : 'txt'),
        style: { minWidth: c.w + 'px' }
      });
      td.appendChild(campo(j, c, idx));
      tr.appendChild(td);
    });

    tr.appendChild(el('td', null, [
      el('div', { class: 'row-actions' }, [
        el('button', { class: 'icon-btn', title: 'Duplicar junta', text: '⧉', onclick: function () { duplicar(j); } }),
        el('button', { class: 'icon-btn del', title: 'Excluir junta', text: '✕', onclick: function () { excluir(j); } })
      ])
    ]));
    return tr;
  }

  function campo(j, c, idx) {
    var input;

    if (c.calc) {
      var txt = Store.situacaoCalculada(j);
      var sit = Store.situacao(j);
      input = el('span', { class: 'cell-badge b-' + sit, text: txt });
      input.dataset.row = idx; input.dataset.key = c.k;
      return input;
    }

    if (c.list) {
      var ops = Store.opcoes(c.list);
      input = el('select');
      input.appendChild(el('option', { value: '', text: '—' }));
      ops.forEach(function (o) { input.appendChild(el('option', { value: o.c, text: o.c, title: o.d || '' })); });
      if (j[c.k] && !ops.some(function (o) { return o.c === j[c.k]; })) {
        input.appendChild(el('option', { value: j[c.k], text: j[c.k] }));
      }
      input.value = j[c.k] || '';
      input.addEventListener('change', function () {
        j[c.k] = input.value;
        Store.notificar('mapa');
        atualizarLinha(input, j, idx);
      });
    } else if (c.type === 'date') {
      input = campoData(j, c);
    } else {
      input = el('input', { type: 'text', value: j[c.k] || '' });
      if (c.sug) input.setAttribute('list', 'dl-' + c.k);
      input.addEventListener('input', function () { j[c.k] = input.value; Store.notificar('mapa'); });
      input.addEventListener('change', function () { atualizarLinha(input, j, idx); });
      input.addEventListener('paste', function (ev) { colar(ev, idx, c); });
    }

    input.dataset.row = idx;
    input.dataset.key = c.k;
    input.addEventListener('keydown', navegar);
    return input;
  }

  /* ---------------- campo de data ----------------
     O mapa original guarda texto livre em alguns campos ("Falta US",
     "N/A"). Por isso o campo alterna entre <input type=date> e texto.
  -------------------------------------------------- */
  function campoData(j, c) {
    var valor = String(j[c.k] || '');
    var eData = /^\d{4}-\d{2}-\d{2}$/.test(valor);
    var input = el('input', { type: eData || !valor ? 'date' : 'text', value: valor });
    if (!eData && valor) input.title = 'Texto livre — apague para voltar ao seletor de data';

    input.addEventListener('input', function () {
      j[c.k] = input.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(input.value)) {
        dataRef = input.value;
        localStorage.setItem(KEY_DATAREF, dataRef);
        var dr = root.querySelector('.toolbar input[type=date]');
        if (dr) dr.value = dataRef;
      }
      Store.notificar('mapa');
    });
    input.addEventListener('change', function () { atualizarLinha(input, j, parseInt(input.dataset.row, 10)); });

    /* preenchimento automático com a data de referência */
    function preencher() {
      if (input.value) return false;
      input.value = dataRef;
      j[c.k] = dataRef;
      Store.notificar('mapa');
      atualizarLinha(input, j, parseInt(input.dataset.row, 10));
      return true;
    }
    input.addEventListener('dblclick', preencher);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !input.value) { ev.preventDefault(); ev.stopPropagation(); preencher(); }
    });
    return input;
  }

  /** Atualiza só o que muda na linha, sem recriar os campos (mantém o foco). */
  function atualizarLinha(node, j, idx) {
    var tr = node.closest ? node.closest('tr') : null;
    if (!tr) return;
    var sit = Store.situacao(j);
    tr.className = 'sit-' + sit;

    var pend = Store.pendencias(j);
    var tdPend = tr.children[1];
    if (tdPend) {
      tdPend.textContent = pend.length ? String(pend.length) : '✓';
      tdPend.style.color = pend.length ? 'var(--warning)' : 'var(--good)';
      tdPend.title = pend.length
        ? 'Pendente: ' + pend.map(function (e) { return e.nome; }).join(', ')
        : 'Sem pendências';
    }
    var badge = tr.querySelector('[data-key="situacao"]');
    if (badge) {
      badge.textContent = Store.situacaoCalculada(j);
      badge.className = 'cell-badge b-' + sit;
    }
    atualizarResumo();
    montarDatalists();
  }

  var resumoTimer = null;
  function atualizarResumo() {
    if (resumoTimer) return;
    resumoTimer = setTimeout(function () {
      resumoTimer = null;
      var chip = $('#mapaResumo');
      if (!chip) return;
      var d = Store.resumoGeral();
      var c = d.contagem;
      chip.textContent = d.total + ' juntas · ' + Store.formatarPD(d.pd) + '″ · ' +
        c.concluido + ' concluídas · ' + c.aguardando + ' aguardando · ' + c.reprovado + ' reprovadas' +
        (visiveis.length !== d.total ? ' · ' + visiveis.length + ' exibidas' : '');
    }, 200);
  }

  /* ---------------- teclado ---------------- */
  function navegar(ev) {
    var cols = colunasVisiveis();
    var r = parseInt(this.dataset.row, 10);
    var chave = this.dataset.key;
    var ci = -1;
    for (var i = 0; i < cols.length; i++) if (cols[i].k === chave) { ci = i; break; }

    if (ev.key === 'd' && (ev.ctrlKey || ev.metaKey)) {
      ev.preventDefault();
      if (r > 0 && visiveis[r - 1]) {
        visiveis[r][chave] = visiveis[r - 1][chave];
        this.value = visiveis[r][chave];
        Store.notificar('mapa');
      }
      return;
    }

    var alvo = null;
    if (ev.key === 'ArrowDown' || (ev.key === 'Enter' && !ev.shiftKey)) alvo = r + 1;
    else if (ev.key === 'ArrowUp' || (ev.key === 'Enter' && ev.shiftKey)) alvo = r - 1;
    else return;

    ev.preventDefault();
    focar(alvo, chave);
  }

  function focar(row, key) {
    var n = tbody.querySelector('[data-row="' + row + '"][data-key="' + key + '"]');
    if (n) { n.focus(); if (n.select) { try { n.select(); } catch (e) { } } }
  }

  /* ---------------- colar do Excel ---------------- */
  function colar(ev, idx, col) {
    var texto = (ev.clipboardData || window.clipboardData).getData('text');
    if (!texto || (texto.indexOf('\t') < 0 && texto.indexOf('\n') < 0)) return;
    ev.preventDefault();

    var cols = colunasVisiveis();
    var ci = 0;
    for (var i = 0; i < cols.length; i++) if (cols[i].k === col.k) { ci = i; break; }
    var linhas = texto.replace(/\r/g, '').replace(/\n$/, '').split('\n');

    linhas.forEach(function (ln, li) {
      var alvoIdx = idx + li;
      while (alvoIdx >= visiveis.length) {
        var nova = Store.novaJunta();
        Store.juntas.push(nova);
        visiveis.push(nova);
      }
      var j = visiveis[alvoIdx];
      ln.split('\t').forEach(function (valor, vi) {
        var c = cols[ci + vi];
        if (!c || c.calc || c.ro) return;
        valor = valor.trim();
        if (c.type === 'date') valor = Excel.isoDeData(valor);
        j[c.k] = valor;
      });
    });
    Store.notificar('mapa');
    montarDatalists();
    render();
    UI.toast(linhas.length + ' linha(s) coladas do Excel', 'ok');
  }

  /* ---------------- ações ---------------- */
  function adicionar(n) {
    var ultima = Store.juntas[Store.juntas.length - 1];
    for (var i = 0; i < n; i++) {
      var nova = Store.novaJunta();
      /* herda o contexto da última junta para não redigitar tudo */
      if (ultima) {
        ['area', 'projeto', 'rev', 'empresa', 'classeIsolamento', 'fluido', 'corLinha',
          'linha', 'revLinha', 'folha', 'parte', 'sch', 'diametro', 'material',
          'classeInsp', 'pressaoOp', 'pressaoTeste', 'pc', 'eps', 'ieis', 'ieip',
          'consumiveis'].forEach(function (k) { nova[k] = ultima[k]; });
      }
      Store.juntas.push(nova);
    }
    Store.notificar('mapa');
    render();
    var wrap = $('#gridWrap');
    if (wrap) wrap.scrollTop = wrap.scrollHeight;
  }

  function proximoNumero(v) {
    var m = /^(\D*)(\d+)(\D*)$/.exec(String(v || ''));
    if (!m) return v;
    var n = String(parseInt(m[2], 10) + 1);
    while (n.length < m[2].length) n = '0' + n;
    return m[1] + n + m[3];
  }

  function duplicar(j) {
    var copia = Store.novaJunta();
    Store.COLS.forEach(function (c) { if (!c.calc) copia[c.k] = j[c.k]; });
    copia.junta = proximoNumero(j.junta);
    Store.juntas.splice(Store.juntas.indexOf(j) + 1, 0, copia);
    Store.notificar('mapa');
    render();
  }

  function excluir(j) {
    var i = Store.juntas.indexOf(j);
    if (i < 0) return;
    Store.juntas.splice(i, 1);
    Store.notificar('mapa');
    render();
  }

  function limparTudo() {
    UI.confirmar('Limpar mapa de juntas',
      'As ' + Store.juntas.length + ' linhas do mapa serão apagadas. Configurações, soldadores e modelos são mantidos. Continuar?',
      function () {
        Store.juntas.length = 0;
        Store.notificar('mapa');
        render();
        UI.toast('Mapa limpo', 'ok');
      });
  }

  /* ============================================================
     IMPORTAÇÃO DO EXCEL
     Pode substituir o mapa aberto, acrescentar a ele ou criar um
     mapa novo (outro contrato) já com as juntas do arquivo.
     ============================================================ */
  function importar() {
    UI.escolherArquivo('.xlsx,.xlsm', async function (file) {
      var carregando = UI.toast('Lendo ' + file.name + '…', '', 60000);
      try {
        var res = await Excel.importarMapa(file);
        if (carregando && carregando.remove) carregando.remove();
        if (!res.juntas.length) {
          UI.toast('O arquivo foi lido, mas nenhuma linha de junta foi encontrada.', 'err');
          return;
        }
        dialogoImportacao(file, res);
      } catch (e) {
        if (carregando && carregando.remove) carregando.remove();
        console.error(e);
        UI.toast('Erro ao importar: ' + e.message, 'err');
      }
    });
  }

  function dialogoImportacao(file, res) {
    var atual = Store.mapaAtual ? Store.mapaAtual() : null;
    var nomeAtual = (atual && atual.nome) || Store.config.projeto.projeto || 'mapa atual';
    var qtdAtual = Store.resumoGeral().total;
    var pdArquivo = Store.somaPolegadas(res.juntas);

    var body = el('div');

    /* --- resumo da leitura --- */
    body.appendChild(el('div', { class: 'imp-resumo' }, [
      el('div', { class: 'imp-arquivo', text: file.name }),
      el('div', {
        class: 'hint',
        text: 'Planilha "' + res.planilha + '" · cabeçalho na linha ' + res.linhaCabecalho +
          ' · dados a partir da linha ' + res.primeiraLinha + ' · ' + res.colunas + ' colunas reconhecidas'
      }),
      el('div', { class: 'imp-numeros' }, [
        el('b', { text: res.juntas.length.toLocaleString('pt-BR') }),
        document.createTextNode(' juntas · '),
        el('b', { text: Store.formatarPD(pdArquivo) + '″' }),
        document.createTextNode(' de polegadas diametrais')
      ])
    ]));

    /* --- amostra, para conferir se as colunas bateram --- */
    var amostra = el('table', { class: 'plain imp-amostra' });
    amostra.appendChild(el('thead', null, [el('tr', null,
      ['Linha', 'Spool', 'Junta', 'Ø', 'Classe de inspeção', 'Soldador']
        .map(function (h) { return el('th', { text: h }); })
    )]));
    var tb = el('tbody');
    res.juntas.slice(0, 3).forEach(function (j) {
      tb.appendChild(el('tr', null, [
        el('td', { text: j.linha || '—' }),
        el('td', { text: j.spool || '—' }),
        el('td', { text: j.junta || '—' }),
        el('td', { text: j.diametro || '—' }),
        el('td', { text: j.classeInsp || '—' }),
        el('td', { text: j.soldRaiz || '—' })
      ]));
    });
    amostra.appendChild(tb);
    body.appendChild(el('div', { class: 'f', style: { marginTop: '14px' } }, [
      el('label', { text: 'Amostra das três primeiras linhas' }), amostra
    ]));

    /* --- destino --- */
    var vazio = qtdAtual === 0;
    var modo = vazio ? 'substituir' : 'novo';
    var camposNovo;

    function radio(valor, titulo, descricao) {
      var inp = el('input', { type: 'radio', name: 'impDestino', value: valor, checked: modo === valor ? true : null });
      inp.addEventListener('change', function () {
        if (!inp.checked) return;
        modo = valor;
        camposNovo.style.display = (modo === 'novo') ? '' : 'none';
      });
      return el('label', { class: 'imp-opcao' }, [
        inp,
        el('div', null, [
          el('div', { class: 'imp-op-titulo', text: titulo }),
          el('div', { class: 'hint', text: descricao })
        ])
      ]);
    }

    var grupo = el('div', { style: { marginTop: '16px' } });
    grupo.appendChild(el('label', { class: 'imp-rotulo', text: 'O que fazer com estas juntas?' }));

    grupo.appendChild(radio('novo', 'Criar um novo mapa (outro contrato)',
      'As juntas entram num mapa próprio. O mapa aberto não é tocado.'));

    grupo.appendChild(radio('substituir',
      vazio ? 'Carregar no mapa aberto “' + nomeAtual + '”' : 'Substituir as juntas do mapa aberto “' + nomeAtual + '”',
      vazio ? 'O mapa aberto está vazio.'
        : 'As ' + qtdAtual.toLocaleString('pt-BR') + ' juntas atuais são apagadas e trocadas pelas do arquivo.'));

    grupo.appendChild(radio('acrescentar', 'Acrescentar ao mapa aberto “' + nomeAtual + '”',
      'O mapa fica com ' + (qtdAtual + res.juntas.length).toLocaleString('pt-BR') + ' juntas. Nada é apagado.'));

    body.appendChild(grupo);

    /* --- dados do novo mapa --- */
    camposNovo = el('div', { class: 'form-grid', style: { marginTop: '12px', display: modo === 'novo' ? '' : 'none' } });
    function campoTexto(rot, valor, ph) {
      var i = el('input', { type: 'text', value: valor || '', placeholder: ph || '' });
      camposNovo.appendChild(el('div', { class: 'f' }, [el('label', { text: rot }), i]));
      return i;
    }
    var sugNome = res.cfg.projeto || (res.juntas[0] && res.juntas[0].projeto) || file.name.replace(/\.xls[xm]$/i, '');
    var iNome = campoTexto('Nome do mapa', sugNome, 'ex.: FRIGO — Área 2');
    var iContrato = campoTexto('Contrato', '', 'ex.: CT-2026-118');
    var iCliente = campoTexto('Cliente', res.cfg.cliente || '', 'ex.: UNIPAR');
    body.appendChild(camposNovo);

    UI.modal('Importar mapa de juntas do Excel', body, [
      { label: 'Cancelar' },
      {
        label: 'Importar', class: 'primary',
        onClick: async function () {
          try {
            await aplicarImportacao(modo, res, {
              nome: iNome.value.trim() || sugNome,
              contrato: iContrato.value.trim(),
              cliente: iCliente.value.trim()
            });
          } catch (e) {
            console.error(e);
            UI.toast('Erro ao importar: ' + e.message, 'err');
          }
        }
      }
    ]);
  }

  async function aplicarImportacao(modo, res, dados) {
    if (modo === 'novo') {
      await Store.criarMapa(dados.nome, dados.contrato, dados.cliente);
    }
    if (modo === 'substituir' || modo === 'novo') Store.juntas.length = 0;

    res.juntas.forEach(function (j) { Store.juntas.push(j); });

    if (modo === 'substituir') {
      if (res.cfg.cliente) Store.config.projeto.cliente = res.cfg.cliente;
      if (res.cfg.projeto) Store.config.projeto.projeto = res.cfg.projeto;
    }
    if (res.soldadores.length && !Store.soldadores.length) {
      res.soldadores.forEach(function (s) { Store.soldadores.push(s); });
    }

    Store.notificar('import', true);
    await Store.salvar(true);

    if (typeof App !== 'undefined' && App.recarregar) App.recarregar();
    else { montarDatalists(true); render(); }

    var alvo = Store.mapaAtual ? (Store.mapaAtual() || {}).nome : '';
    UI.toast(res.juntas.length.toLocaleString('pt-BR') + ' juntas importadas' + (alvo ? ' em "' + alvo + '"' : ''), 'ok');
  }

  async function exportar() {
    try {
      if (!Store.juntasPreenchidas().length) { UI.toast('Nenhuma junta preenchida para exportar.', 'err'); return; }
      var res = await Excel.exportarMapa();
      var nome = 'Mapa de Juntas - ' + UI.slug(Store.config.projeto.projeto || 'projeto') + ' - ' + UI.hoje() + '.xlsx';
      UI.baixar(res.blob, nome);
      UI.toast(res.viaModelo
        ? 'Exportado sobre o modelo original (planilha "' + res.planilha + '")'
        : 'Exportado — importe o modelo do mapa em Configurações para manter a formatação original', 'ok');
    } catch (e) {
      console.error(e);
      UI.toast('Erro ao exportar: ' + e.message, 'err');
    }
  }

  function imprimir() {
    var js = Store.juntasPreenchidas();
    if (!js.length) { UI.toast('Nenhuma junta preenchida para imprimir.', 'err'); return; }
    Print.mapa(js, { colunas: colunasVisiveis() });
  }

  global.Mapa = { montar: montar, render: render, filtrarPor: filtrarPor, importar: importar };
})(window);

</script>
<script>
/* ============================================================
   ui-relatorios.js - Aba de relatórios (FOR-266 e FOR-053)
   ============================================================ */
(function (global) {
  'use strict';

  var el = UI.el, $ = UI.$;
  var root, tipo = 'EVS', rels = [], sel = 0, listaEl, previewEl, resumoEl;

  function montar(container) {
    root = container;
    UI.clear(root);
    root.classList.add('view-grid');
    root.appendChild(barra());

    var layout = el('div', { class: 'rep-layout' });
    listaEl = el('div', { class: 'rep-list' });
    previewEl = el('div', { class: 'rep-preview' });
    layout.appendChild(listaEl);
    layout.appendChild(previewEl);
    root.appendChild(layout);

    atualizar();
  }

  function barra() {
    var b = el('div', { class: 'toolbar' });

    var seg = el('div', { style: { display: 'flex', gap: '2px' } });
    [['EVS', 'FOR-266 · Visual de Solda'], ['LP', 'FOR-053 · Líquido Penetrante']].forEach(function (t) {
      seg.appendChild(el('button', {
        class: 'btn' + (tipo === t[0] ? ' primary' : ''),
        text: t[1],
        'data-tipo': t[0],
        onclick: function () { tipo = t[0]; sel = 0; montar(root); }
      }));
    });
    b.appendChild(seg);
    b.appendChild(el('span', { class: 'sep' }));

    var cfg = Store.config.relatorios;
    b.appendChild(el('label', {
      class: 'chk',
      title: 'Marcado: juntas com o mesmo n° de relatório lançado no mapa saem no mesmo formulário. Desmarcado: um relatório por linha do mapa.'
    }, [
      el('input', {
        type: 'checkbox', checked: cfg.agruparPorNumero ? true : null,
        onchange: function () { cfg.agruparPorNumero = this.checked; Store.notificar('rel'); montar(root); }
      }),
      el('span', { text: 'Agrupar pelo n° de relatório do mapa' })
    ]));
    b.appendChild(el('span', { class: 'sep' }));

    b.appendChild(el('button', { class: 'btn', text: 'Imprimir selecionado', onclick: imprimirUm }));
    b.appendChild(el('button', { class: 'btn primary', text: 'Imprimir todos / PDF', onclick: imprimirTodos }));
    b.appendChild(el('span', { class: 'sep' }));
    b.appendChild(el('button', { class: 'btn', text: 'Excel (selecionado)', onclick: excelUm }));
    b.appendChild(el('button', { class: 'btn', text: 'Excel (todos .zip)', onclick: excelTodos }));

    b.appendChild(el('span', { class: 'spacer' }));
    resumoEl = el('span', { class: 'status-chip' });
    b.appendChild(resumoEl);
    return b;
  }

  function atualizar() {
    rels = Relatorios.gerar(tipo);
    if (sel >= rels.length) sel = 0;
    renderLista();
    renderPreview();
    if (resumoEl) {
      resumoEl.textContent = rels.length
        ? rels.length + ' relatório(s) · ' + rels.reduce(function (a, r) { return a + r.juntas.length; }, 0) + ' juntas'
        : 'nenhuma junta com ensaio ' + tipo;
    }
  }

  var buscaRel = '', limite = 150;

  function filtrados() {
    if (!buscaRel) return rels;
    var q = buscaRel.toLowerCase();
    return rels.filter(function (r) {
      if (String(r.numero).toLowerCase().indexOf(q) >= 0) return true;
      if (String(r.docRef).toLowerCase().indexOf(q) >= 0) return true;
      return r.juntas.some(function (j) {
        return String(j.junta).toLowerCase().indexOf(q) >= 0 ||
          String(j.spool).toLowerCase().indexOf(q) >= 0;
      });
    });
  }

  function renderLista() {
    UI.clear(listaEl);

    if (rels.length) {
      listaEl.appendChild(el('input', {
        type: 'search', class: 'busca-rel',
        placeholder: 'Buscar n°, linha, spool ou junta…',
        value: buscaRel,
        oninput: function () { buscaRel = this.value.trim(); limite = 150; renderLista(); }
      }));
    }

    if (!rels.length) {
      listaEl.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'Nenhum relatório' }),
        el('p', {
          text: tipo === 'EVS'
            ? 'Nenhuma junta tem "VS" na classe de inspeção. Preencha a coluna "Classe de inspeção" no mapa (ex.: VA / VS / LP-R. / LP A. / US 100%).'
            : 'Nenhuma junta tem "LP-R." ou "LP A." na classe de inspeção. Preencha a coluna "Classe de inspeção" no mapa.'
        })
      ]));
      return;
    }
    var lista = filtrados();
    var mostrar = lista.slice(0, limite);

    listaEl.appendChild(el('div', {
      class: 'hint', style: { padding: '2px 2px 8px' },
      text: lista.length === rels.length
        ? rels.length + ' relatórios'
        : lista.length + ' de ' + rels.length + ' relatórios'
    }));

    var frag = document.createDocumentFragment();
    mostrar.forEach(function (r) {
      var i = rels.indexOf(r);
      var lau = r.laudoFinal === 'REP' ? 'REPROVADO' : r.laudoFinal === 'APR' ? 'APROVADO' : '—';
      frag.appendChild(el('div', {
        class: 'rep-item' + (i === sel ? ' on' : ''),
        onclick: function () { sel = i; renderLista(); renderPreview(); }
      }, [
        el('div', { class: 'n', text: r.numero }),
        el('div', { class: 'd', text: (r.docRef || '(sem desenho)') + ' · junta ' + r.juntas.map(function (j) { return j.junta; }).join(', ').slice(0, 40) }),
        el('div', {
          class: 'd',
          text: lau + ' · ' + UI.dataBR(r.data),
          style: { color: r.laudoFinal === 'REP' ? 'var(--critical)' : r.laudoFinal === 'APR' ? 'var(--good)' : '' }
        })
      ]));
    });
    listaEl.appendChild(frag);

    if (lista.length > mostrar.length) {
      listaEl.appendChild(el('button', {
        class: 'btn', style: { width: '100%', justifyContent: 'center', marginTop: '6px' },
        text: 'Mostrar mais ' + Math.min(150, lista.length - mostrar.length) +
          ' (faltam ' + (lista.length - mostrar.length) + ')',
        onclick: function () { limite += 150; renderLista(); }
      }));
    }
  }

  function renderPreview() {
    UI.clear(previewEl);
    if (!rels.length) return;
    var r = rels[sel];

    previewEl.appendChild(editor(r));
    var folha = Relatorios.html(r);
    previewEl.appendChild(folha);
    ajustarZoom(folha);
  }

  /* A folha tem 210 mm (~794 px). Reduz para caber no painel de pré-visualização. */
  function ajustarZoom(folha) {
    var disp = previewEl.clientWidth - 44;
    var z = Math.min(1, disp / 794);
    folha.style.zoom = z > 0.35 ? z : 0.35;
    var card = previewEl.querySelector('.card');
    if (card) card.style.maxWidth = Math.max(360, disp) + 'px';
  }

  function editor(r) {
    var card = el('div', { class: 'card', style: { maxWidth: '210mm', margin: '0 auto 14px' } });
    card.appendChild(el('h3', null, [
      document.createTextNode('Campos do relatório'),
      el('span', { class: 'tagline', text: '— preenchidos automaticamente pelo mapa; ajuste o que for específico deste laudo' })
    ]));
    var body = el('div', { class: 'card-body' });
    var g = el('div', { class: 'form-grid' });

    function f(label, valor, onchange, tipoInp) {
      var inp = el('input', { type: tipoInp || 'text', value: valor || '' });
      inp.addEventListener('change', function () { onchange(inp.value); });
      return el('div', { class: 'f' }, [el('label', { text: label }), inp]);
    }

    g.appendChild(f('N° do relatório', r.numero, function (v) { r.numero = v; Relatorios.salvarOverride(r, { numero: v }); renderLista(); renderPreview(); }));
    g.appendChild(f('Data', r.data, function (v) { r.data = v; Relatorios.salvarOverride(r, { data: v }); renderPreview(); }, 'date'));
    g.appendChild(f('Doc. ref. / isométrico', r.docRef, function (v) { r.docRef = v; Relatorios.salvarOverride(r, { docRef: v }); renderPreview(); }));
    g.appendChild(f('Rev. do documento', r.revDoc, function (v) { r.revDoc = v; Relatorios.salvarOverride(r, { revDoc: v }); renderPreview(); }));

    /* equipamento: lista cadastrada em Configurações, mas aceita texto livre */
    var cadastrados = Store.listaEquipamentos();
    var inpEq = el('input', { type: 'text', value: r.equipamento || '', list: 'dl-rel-equip' });
    var dlEq = el('datalist', { id: 'dl-rel-equip' });
    cadastrados.forEach(function (v) { dlEq.appendChild(el('option', { value: v })); });
    inpEq.addEventListener('change', function () {
      r.equipamento = inpEq.value;
      Relatorios.salvarOverride(r, { equipamento: inpEq.value });
      renderPreview();
    });
    g.appendChild(el('div', { class: 'f' }, [
      el('label', { text: 'Equipamento' }), inpEq, dlEq,
      el('div', {
        class: 'hint',
        text: cadastrados.length
          ? cadastrados.length + ' cadastrado(s) em Configurações'
          : 'Cadastre os equipamentos em Configurações para escolher pela lista'
      })
    ]));

    var selL = el('select', null, [
      el('option', { value: '', text: '—' }),
      el('option', { value: 'APR', text: 'APROVADO' }),
      el('option', { value: 'REP', text: 'REPROVADO' }),
      el('option', { value: 'COMP', text: 'EXAME COMPLEMENTAR' })
    ]);
    selL.value = r.laudoFinal || '';
    selL.addEventListener('change', function () {
      r.laudoFinal = selL.value; Relatorios.salvarOverride(r, { laudoFinal: selL.value }); renderLista(); renderPreview();
    });
    g.appendChild(el('div', { class: 'f' }, [el('label', { text: 'Laudo final' }), selL]));

    ['numero', 'tipo', 'cota', 'comprimento'].forEach(function (k) {
      var rot = { numero: 'Descontinuidade N°', tipo: 'Descontinuidade tipo', cota: 'Descontinuidade cota', comprimento: 'Descontinuidade compr.' }[k];
      g.appendChild(f(rot, r.desc[k], function (v) {
        r.desc[k] = v;
